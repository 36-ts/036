<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>損保大学課程 専門コース 模擬試験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#ECEEEC; --surface:#FFFFFF; --ink:#1C1F23; --muted:#596068; --line:#D0D4D8;
  --coverbg:#DADDDF; --hexc:#6F767D;
  --law:#27466E; --law-box:#27466E; --tax:#2B614A; --tax-box:#2B614A;
  --ok:#1A6788; --ng:#B3261E; --warn:#9C5300; --flagbg:#FFF1D2;
  --u:var(--law); --ubox:var(--law-box);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141619; --surface:#1D2024; --ink:#E5E7E9; --muted:#A0A7AE; --line:#343940;
    --coverbg:#262A2F; --hexc:#8A929B;
    --law:#9DB8DE; --law-box:#2E4C76; --tax:#93CDAF; --tax-box:#2E5F4A;
    --ok:#86C6E2; --ng:#F2A39A; --warn:#E9B46A; --flagbg:#3A2E17;
  }
}
:root[data-theme="dark"]{
  --paper:#141619; --surface:#1D2024; --ink:#E5E7E9; --muted:#A0A7AE; --line:#343940;
  --coverbg:#262A2F; --hexc:#8A929B;
  --law:#9DB8DE; --law-box:#2E4C76; --tax:#93CDAF; --tax-box:#2E5F4A;
  --ok:#86C6E2; --ng:#F2A39A; --warn:#E9B46A; --flagbg:#3A2E17;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
.u-law{--u:var(--law);--ubox:var(--law-box)}
.u-tax{--u:var(--tax);--ubox:var(--tax-box)}
h1,h2,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--u);outline-offset:2px}
.small{font-size:.85rem;color:var(--muted);margin-top:10px}

.btn{appearance:none;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:4px;padding:.55em 1.1em;min-height:44px;cursor:pointer;line-height:1.4}
.btn:hover{border-color:var(--u)}
.btn.primary{background:var(--ubox);border-color:var(--ubox);color:#fff}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:38px;padding:.3em .85em;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ---------- home ---------- */
.home{max-width:1080px;margin:0 auto;padding:32px 18px 56px}
.mast .course{font-weight:700;color:var(--muted);letter-spacing:.08em}
.mast h1{font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.15;letter-spacing:.14em;margin:.08em 0 .35em;
  border-bottom:3px solid var(--ink);display:inline-block;padding-bottom:.08em}
.lead{max-width:38em;color:var(--muted)}
.unit{display:grid;grid-template-columns:1fr;margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
@media (min-width:780px){.unit{grid-template-columns:320px 1fr}}
.cover{position:relative;min-height:230px;background:var(--coverbg);color:var(--hexc);padding:20px;
  display:flex;flex-direction:column;gap:10px;overflow:hidden}
.cover .hex{position:absolute;inset:0;width:100%;height:100%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cover .hex{opacity:.6}}
:root[data-theme="dark"] .cover .hex{opacity:.6}
.cover-t{position:relative;align-self:flex-end;color:var(--ink);font-weight:700;letter-spacing:.1em;
  background:var(--coverbg);padding:0 .3em}
.cover .label{position:relative;align-self:flex-end;background:var(--ubox);color:#fff;font-weight:700;
  font-size:2rem;letter-spacing:.14em;padding:.18em .55em .18em .69em;line-height:1.3}
.spec{position:relative;margin:auto 0 0;display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);align-self:flex-start}
.spec div{background:var(--surface);padding:6px 12px}
.spec dt{font-size:.75rem;color:var(--muted);line-height:1.3}
.spec dd{margin:0;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.panel{padding:20px}
.ph{font-weight:700;margin-bottom:10px}
.sets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (min-width:520px){.sets{grid-template-columns:repeat(10,1fr)}}
.set{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:4px;min-height:54px;padding:4px 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-variant-numeric:tabular-nums}
.set:hover{border-color:var(--u)}
.set .n{font-weight:700;font-size:1.05rem;line-height:1.15}
.set .b{font-size:.7rem;color:var(--muted);line-height:1.2;min-height:1.2em}
.set.tried{border-color:var(--u);border-width:2px}
.set.pass{background:var(--ubox);border-color:var(--ubox);color:#fff}
.set.pass .b{color:#fff}
.legend{font-size:.8rem;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px}
.lg.tried{border:2px solid var(--u)}
.lg.pass,.lg.done{background:var(--ubox);border-color:var(--ubox)}
.lg.fl{border-radius:50%;width:10px;height:10px;background:var(--warn);border:0}
.note{margin-top:34px;font-size:.85rem;color:var(--muted);max-width:44em;display:grid;gap:6px}

/* ---------- exam ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:nowrap}
@media (max-width:430px){.bar .w{display:none}.chip{font-size:.8rem}.timer{font-size:1.1rem}}
.chip{background:var(--ubox);color:#fff;font-weight:700;padding:.1em .6em;border-radius:3px;font-size:.88rem;white-space:nowrap}
.prog{font-weight:700;font-variant-numeric:tabular-nums}
.prog small{font-size:.85rem;color:var(--muted);font-weight:400}
.timer{margin-left:auto;font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;letter-spacing:.05em}
.timer.low{color:var(--warn)}
.sheet{max-width:46rem;margin:0 auto;padding:20px 16px 120px}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.qno{border:1.5px solid var(--ink);padding:0 .55em;font-weight:700;border-radius:3px;font-size:.95rem}
.qpart{color:var(--muted);font-size:.85rem}
.prompt{font-weight:700;font-size:1.05rem;margin:.2em 0 1em}
.stmts{list-style:none;margin:0 0 1.2em;padding:0;border-top:1px solid var(--line)}
.stmts li{display:grid;grid-template-columns:2.8em 1fr;padding:12px 0;border-bottom:1px solid var(--line)}
.stmts .k{font-weight:700}
.ex{font-size:.9rem;color:var(--muted);margin-top:6px}
.ex b{margin-right:.6em;white-space:nowrap}
.is-ok .ex b{color:var(--ok)} .is-ng .ex b{color:var(--ng)}
.ex.calc{background:var(--paper);padding:12px 14px;border-radius:4px;margin-top:14px;color:var(--ink)}
.ex.calc b{display:block;margin-bottom:2px}
.cap{font-weight:700;margin-bottom:6px}
.opts ul{list-style:none;margin:0 0 1.2em;padding:0}
.opts li{display:grid;grid-template-columns:2em 1fr;padding:3px 0;font-variant-numeric:tabular-nums}
.opts li.is-ans{color:var(--ok);font-weight:700}
.tbl{overflow-x:auto;margin:0 0 1.1em}
table{border-collapse:collapse;font-size:.86rem}
caption{text-align:left;font-weight:700;padding:2px 0 4px}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{background:var(--paper);font-weight:700}
.bubbles{display:flex;gap:8px;flex-wrap:wrap}
.bub{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;width:60px;padding:6px 0 10px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.bub:hover:not(:disabled){border-color:var(--u)}
.bub .lb{font-weight:700}
.bub .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:block;transition:background-color .12s}
.bub.on{border-color:var(--u);border-width:2px}
.bub.on .dot{background:var(--ink);box-shadow:inset 0 0 0 4px var(--surface)}
.bub:disabled{cursor:default}
.bub.right{border-color:var(--ok);border-width:2px}
.bub.right .dot{border-color:var(--ok)}
.bub.right.on .dot{background:var(--ok)}
.bub.miss{border-color:var(--ng)}
.bub.miss .dot{border-color:var(--ng);background:var(--ng)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:center;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.foot .btn{flex:1;max-width:13rem}
.btn.flag.on{background:var(--flagbg);border-color:var(--warn);color:var(--warn)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(18,20,23,.5);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--surface);width:100%;max-width:40rem;border-radius:10px 10px 0 0;padding:18px 16px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;display:grid;gap:10px}
@media (min-width:700px){.overlay{align-items:center}.sheetbox{border-radius:8px}}
.sheetbox h2{font-size:1.1rem}
.sb-head{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (min-width:520px){.grid{grid-template-columns:repeat(10,1fr)}}
.cell{appearance:none;position:relative;border:1px solid var(--line);background:var(--surface);border-radius:4px;min-height:44px;
  font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.done{background:var(--ubox);border-color:var(--ubox);color:#fff}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.fl::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* ---------- result ---------- */
.result,.drill{max-width:46rem;margin:0 auto;padding:24px 16px 56px}
.score-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 20px;border-top:6px solid var(--ubox)}
.rs-title{font-weight:700;color:var(--muted)}
.score{margin:.2em 0}
.score b{font-size:4rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.score span{color:var(--muted);font-size:1.1rem;margin-left:.2em}
.verdict{font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.verdict span{font-weight:400;font-size:.85rem;color:var(--muted)}
.verdict.pass{color:var(--ok)} .verdict.fail{color:var(--ng)}
.meta{color:var(--muted);margin-top:8px;font-size:.92rem}
.breakdown,.review{margin-top:28px}
.breakdown h2,.review h2{font-size:1.05rem;margin-bottom:10px}
.bd{display:grid;grid-template-columns:1fr 110px 3.6em;gap:6px 12px;align-items:center;padding:6px 0;font-size:.9rem;border-bottom:1px solid var(--line)}
.bd-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bd-bar i{display:block;height:100%;background:var(--u)}
.bd-v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:520px){.bd{grid-template-columns:1fr 3.6em}.bd-bar{grid-column:1/-1;grid-row:2}}
.rv-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.tog{font-size:.9rem;display:flex;align-items:center;gap:6px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--ubox)}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:8px 0}
.rv summary{display:grid;grid-template-columns:1.8em auto 1fr;gap:2px 8px;padding:10px 12px;cursor:pointer;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv[open] summary{border-bottom:1px solid var(--line)}
.mk{font-weight:700}
.rv.ok .mk{color:var(--ok)} .rv.ng .mk{color:var(--ng)}
.rv-no{font-weight:700}
.rv-a{grid-column:2/-1;color:var(--muted);font-size:.85rem}
.rv-body{padding:14px 12px 16px}

/* ---------- drill ---------- */
.dr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.segbtn{appearance:none;border:0;background:var(--surface);padding:.35em .9em;min-height:38px;font-weight:700;cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--ubox);color:#fff}
.tally{font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chipbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3em .85em;font-size:.82rem;cursor:pointer;min-height:36px}
.chipbtn.calc{border-style:dashed}
.chipbtn[aria-pressed="true"]{background:var(--ubox);border-color:var(--ubox);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 16px;margin-top:16px}
.dr-res{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dr-res.pass b{color:var(--ok)} .dr-res.fail b{color:var(--ng)}
/* ---------- study ---------- */
.sub-h{margin-top:18px;margin-bottom:8px}
.study{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 12px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-height:68px}
.tile:hover{border-color:var(--u)}
.tile .tl{font-size:.78rem;color:var(--muted);font-weight:700;line-height:1.3}
.tile b{font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile b small{font-size:.72rem;font-weight:400;color:var(--muted);margin-left:2px}
.tile b.wk{font-size:1rem}
.star{margin-left:auto;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.1em .8em;min-height:34px;
  font-size:.82rem;font-weight:700;cursor:pointer;display:inline-flex;gap:.35em;align-items:center;color:var(--muted);white-space:nowrap}
.star.on{color:var(--warn);border-color:var(--warn);background:var(--flagbg)}
.rv-tools{display:flex;justify-content:flex-end;margin-bottom:10px}
.rv.mark .mk{color:var(--warn)}
.note-box{margin-top:16px;padding:12px 14px;border-radius:4px;background:var(--paper);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.dr-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.dr-title{font-size:1.35rem;letter-spacing:.04em}
.dr-sub{margin-top:2px}
.dr-top .seg{margin-left:auto}
.tag{display:inline-block;font-size:.7rem;font-weight:700;color:var(--surface);background:var(--ng);padding:0 .45em;border-radius:3px;margin-left:.5em;vertical-align:1px}
.bd-v small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.pn{display:inline-block;color:var(--muted);margin-right:.5em;font-size:.78rem}
.review .rv:first-child{margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LAW = [
// ===== 第1編 損害保険契約に関する知識 =====
{p:1,t:"保険契約と保険法",s:[
["保険法は、保険契約に関する一般的なルールを定めた法律であり、保険契約と同等の内容を有する共済契約にも適用される。",1,"正しい。保険法は名称を問わず、保険契約と同等の内容を持つ共済契約にも適用される。"],
["保険法には、保険契約者等に不利な約款の定めを無効とする片面的強行規定が設けられている。",1,"正しい。告知義務や解除などの規定の多くが片面的強行規定とされている。"],
["保険法の規定はすべて任意規定であり、約款によって自由に変更することができる。",0,"誤り。保険法には片面的強行規定や絶対的強行規定があり、それより保険契約者等に不利な約款の定めは無効となる。"],
["保険契約は、当事者の意思表示の合致のみで成立する諾成契約であり、保険料の支払いは契約の成立要件ではない。",1,"正しい。保険契約は諾成・不要式の契約である。"],
["保険契約は、保険証券などの書面を作成しなければ成立しない要式契約である。",0,"誤り。保険契約は諾成・不要式の契約である。保険者の書面交付義務は、契約成立後の義務である。"],
["保険法は、保険契約を損害保険契約、生命保険契約、傷害疾病定額保険契約の3つに分類して規定している。",1,"正しい。"]
]},
{p:1,t:"告知義務",s:[
["保険法上の告知義務は、保険者が告知を求めた事項について事実を告知すればよい質問応答義務とされている。",1,"正しい。危険に関する重要な事項のうち、保険者が告知を求めたものについて告知する。"],
["保険契約者または被保険者が故意または重大な過失により事実の告知をしなかった場合、保険者は契約を解除することができる。",1,"正しい。"],
["告知義務違反による解除権は、保険者が解除の原因があることを知った時から1か月間行使しないときは消滅する。",1,"正しい。また、契約締結の時から5年を経過したときも消滅する。"],
["告知義務違反による解除権は、契約締結の時から3年を経過したときに消滅する。",0,"誤り。契約締結の時から5年である。保険者が解除の原因を知った時から1か月行使しない場合も消滅する。"],
["保険媒介者が保険契約者に対して告知をしないことを勧めた場合、保険者は原則として告知義務違反を理由に契約を解除することができない。",1,"正しい。保険媒介者による告知妨害・不告知教唆がある場合は、原則として解除できない。"],
["告知義務違反により契約が解除された場合、解除前に発生した事故は、告知しなかった事実と無関係に発生したものであっても保険金は支払われない。",0,"誤り。告知しなかった事実に基づかずに発生した事故については、保険者は保険給付を行う責任を負う(因果関係不存在の特則)。"]
]},
{p:1,t:"危険の増加・減少と超過保険",s:[
["危険増加とは、告知事項についての危険が高くなり、契約で定めた保険料がその危険を基に算出される保険料に不足する状態をいう。",1,"正しい。"],
["保険料を変更すれば契約を継続できる危険増加の場合でも、約款で通知義務が定められ、保険契約者等が故意または重大な過失により遅滞なく通知しなかったときは、保険者は契約を解除できる。",1,"正しい。適切に通知された場合は、保険料の変更にとどまり解除はできない。"],
["保険料を変更すれば契約を継続できる危険増加が生じた場合、保険者は通知の有無にかかわらず、ただちに契約を解除することができる。",0,"誤り。解除できるのは、約款上の通知義務に故意または重大な過失により違反した場合に限られる。"],
["損害保険契約の締結時に保険金額が保険価額を超えていた場合、保険契約者および被保険者が善意でかつ重大な過失がなかったときは、保険契約者は超過部分について契約を取り消すことができる。",1,"正しい(保険法9条)。"],
["契約締結後に危険が著しく減少したときは、保険契約者は保険者に対し、将来に向かって保険料の減額を請求することができる。",1,"正しい(保険法11条)。"],
["契約締結後に危険が著しく減少しても、保険契約者は保険料の減額を請求することはできない。",0,"誤り。将来に向かって、減少後の危険に対応する保険料への減額を請求できる。"]
]},
{p:1,t:"保険価額と保険金額",s:[
["保険価額とは、被保険利益を金銭に評価した額であり、損害保険における損害てん補の上限となる。",1,"正しい。"],
["保険金額が保険価額に満たない一部保険の場合、約款に別段の定めがなければ、損害額に保険金額の保険価額に対する割合を乗じた額が支払われる。",1,"正しい。比例てん補の原則(保険法19条)。"],
["保険金額が保険価額に満たない一部保険であっても、保険法上は保険金額を限度に損害額の全額が支払われるのが原則である。",0,"誤り。保険法の原則は比例てん補である。約款で実損てん補とする定めを置くことは可能。"],
["重複保険の場合、保険法では各保険者はそれぞれ独立責任額の全額について支払義務を負い、自己の負担部分を超えて支払った保険者は他の保険者に求償できる。",1,"正しい。独立責任額全額主義(保険法20条)。"],
["重複保険の場合、保険法では各保険者は保険金額の割合で按分した額についてのみ支払義務を負う。",0,"誤り。保険法は独立責任額全額主義を採用している。約款で按分方式とすることは可能。"],
["約定保険価額があるときでも、約定保険価額が保険価額を著しく超える場合には、てん補損害額は実際の保険価額によって算定する。",1,"正しい(保険法18条2項)。"]
]},
{p:1,t:"保険代位",s:[
["保険の目的物の全部が滅失し保険者が保険給付を行ったときは、保険者は給付額の保険価額に対する割合に応じて、目的物に対する被保険者の所有権等を取得する。",1,"正しい。残存物代位(保険法24条)。"],
["残存物代位は、保険の目的物の一部が損傷した分損の場合にも生じる。",0,"誤り。残存物代位は、目的物の全部が滅失した場合に生じる。"],
["保険者は保険給付を行ったときは、給付額と被保険者債権の額のいずれか少ない額を限度として、被保険者が第三者に対して有する債権を当然に取得する。",1,"正しい。請求権代位(保険法25条1項)。"],
["保険給付の額がてん補損害額に不足するときは、被保険者はその不足額について、保険者より優先して第三者に対する債権を行使できる。",1,"正しい(保険法25条2項)。"],
["請求権代位の規定は、傷害疾病定額保険契約にも適用される。",0,"誤り。保険代位は損害保険契約の規定であり、定額保険には適用されない。"]
]},
{p:1,t:"責任保険契約",s:[
["責任保険契約の被害者は、被保険者が保険者に対して有する保険給付請求権について先取特権を有する。",1,"正しい(保険法22条1項)。"],
["責任保険契約の被保険者は、被害者に弁済した金額または被害者の承諾があった金額の限度においてのみ、保険給付請求権を行使できる。",1,"正しい(保険法22条2項)。"],
["責任保険契約の保険給付請求権は、原則として被害者以外の者に譲渡し、質権の目的とし、または差し押さえることができない。",1,"正しい(保険法22条3項)。"],
["保険法では、責任保険契約の被害者に対し、保険者への直接請求権が一般的に認められている。",0,"誤り。保険法に直接請求権の規定はない。自賠法による被害者請求や、約款による直接請求の定めがある。"],
["責任保険契約の被害者の先取特権は、被保険者が破産した場合には効力を失う。",0,"誤り。被害者は先取特権により、被保険者の他の債権者に優先して保険金から弁済を受けられ、被保険者の破産時にも保護される。"]
]},
{p:1,t:"損害保険契約の終了",s:[
["保険契約者は、いつでも損害保険契約を解除することができる。",1,"正しい(保険法27条)。"],
["保険契約者または被保険者が、保険給付を行わせることを目的として損害を生じさせ、または生じさせようとしたときは、保険者は契約を解除することができる。",1,"正しい。重大事由による解除(保険法30条)。"],
["保険者による契約の解除は、契約締結時にさかのぼってその効力を生じる。",0,"誤り。解除は将来に向かってのみ効力を生じる(保険法31条1項)。"],
["保険契約者の詐欺を理由に保険者が契約を取り消した場合、保険者は既に受領した保険料を返還する義務を負わない。",1,"正しい(保険法32条)。"],
["保険給付を請求する権利および保険料の返還を請求する権利は、行使できる時から3年間行使しないときは時効により消滅する。",1,"正しい(保険法95条1項)。"],
["保険給付を請求する権利は、行使できる時から5年間行使しないときに時効により消滅する。",0,"誤り。保険法上の時効期間は3年である。なお、保険料請求権は1年。"]
]},
{p:1,t:"傷害疾病定額保険契約",s:[
["保険契約者と被保険者が異なる傷害疾病定額保険契約は、原則として被保険者の同意がなければ効力を生じない。",1,"正しい(保険法67条)。"],
["保険契約者は、保険事故が発生するまでは、保険者に対する意思表示によって保険金受取人を変更することができる。",1,"正しい(保険法72条)。"],
["遺言による保険金受取人の変更は、保険法上認められていない。",0,"誤り。遺言による変更も認められる。ただし、保険契約者の相続人が保険者に通知しなければ保険者に対抗できない(保険法73条)。"],
["保険金受取人が保険事故の発生前に死亡したときは、その相続人の全員が保険金受取人となる。",1,"正しい(保険法75条)。"],
["差押債権者等による契約の解除は、保険者がその通知を受けた時から1か月を経過した日に効力を生じ、その間に一定の保険金受取人が払戻金相当額を支払うなどすれば解除の効力は生じない。",1,"正しい。介入権制度(保険法89条)。"],
["介入権制度では、差押債権者等による解除は、保険者が通知を受けた時から3か月を経過した日に効力を生じる。",0,"誤り。1か月を経過した日である。"]
]},
{p:1,t:"保険約款",s:[
["保険約款とは、保険会社があらかじめ作成した定型的な契約条項であり、普通保険約款と特約条項がある。",1,"正しい。"],
["判例は、保険契約者が約款の内容を知らなくても、特に反対の意思を表示しない限り、約款による意思で契約したものと推定している(意思推定説)。",1,"正しい。"],
["保険約款は、保険契約者が個別に内容を確認して署名した条項以外は、契約の内容とならない。",0,"誤り。判例上、約款による意思で契約したものと推定され、約款全体が契約内容となる。"],
["普通保険約款の内容を補充・変更・排除するために付される条項を特約条項という。",1,"正しい。"],
["保険約款の定めが保険法の片面的強行規定に反し、保険契約者等に不利なものである場合、その定めは無効となる。",1,"正しい。"],
["保険会社は、金融庁の認可などの手続きを経ることなく、普通保険約款を自由に変更することができる。",0,"誤り。普通保険約款などの基礎書類の変更には、原則として内閣総理大臣(金融庁)の認可が必要である。"],
["2020年施行の改正民法で定型約款の規定が設けられ、一定の要件を満たせば、定型約款の個別の条項にも合意したものとみなされる。",1,"正しい(民法548条の2)。"]
]},
{p:1,t:"損害防止義務と保険者の免責",s:[
["保険契約者および被保険者は、保険事故が発生したことを知ったときは、これによる損害の発生および拡大の防止に努めなければならない。",1,"正しい(保険法13条)。"],
["損害の発生・拡大の防止のために必要または有益であった費用は、保険者が負担する。",1,"正しい(保険法23条1項2号)。"],
["保険者は、保険契約者または被保険者の故意または重大な過失によって生じた損害をてん補する責任を負わない。",1,"正しい(保険法17条1項)。"],
["保険法上、戦争その他の変乱によって生じた損害は、保険者のてん補責任の対象外とされている。",1,"正しい(保険法17条1項)。"],
["責任保険契約では、被保険者の重大な過失によって生じた損害についても、保険者は保険法上てん補責任を負わない。",0,"誤り。責任保険契約で保険法上免責となるのは故意による場合のみで、重大な過失は免責事由とされていない(保険法17条2項)。"],
["保険契約者等は、保険事故による損害が生じたことを知ったときは、遅滞なく保険者に通知しなければならない。",1,"正しい(保険法14条)。"],
["損害防止義務は保険者のための義務であるため、防止のために要した費用はすべて保険契約者が負担する。",0,"誤り。必要または有益であった損害防止費用は保険者が負担する。"]
]},

// ===== 第2編 損害賠償に関する知識 =====
{p:2,t:"不法行為責任と債務不履行責任",s:[
["不法行為責任が成立するには、加害者の故意・過失、権利または法律上保護される利益の侵害、損害の発生、因果関係、責任能力が必要である。",1,"正しい(民法709条・712条・713条)。"],
["不法行為責任では、原則として被害者が加害者の故意または過失を立証しなければならない。",1,"正しい。"],
["債務不履行責任では、債務者が自己の責めに帰すべき事由がないことを立証しない限り、責任を免れない。",1,"正しい(民法415条1項ただし書)。"],
["人の生命または身体を害する不法行為による損害賠償請求権は、被害者等が損害および加害者を知った時から5年間行使しないときは時効により消滅する。",1,"正しい(民法724条の2)。"],
["物の損壊による不法行為の損害賠償請求権は、損害および加害者を知った時から5年間行使しないときに時効により消滅する。",0,"誤り。人の生命・身体以外の侵害は、知った時から3年(不法行為の時から20年)である。"],
["債務不履行による損害賠償請求権は、権利を行使できることを知った時から10年間行使しないときに時効により消滅する。",0,"誤り。知った時から5年、権利を行使できる時から10年である(人の生命・身体の侵害は20年)。"]
]},
{p:2,t:"一般の不法行為",s:[
["未成年者が他人に損害を加えた場合、自己の行為の責任を弁識するに足りる知能を備えていなかったときは、賠償責任を負わない。",1,"正しい(民法712条)。"],
["責任無能力者の監督義務者は、監督義務を怠らなかったこと、またはその義務を怠らなくても損害が生ずべきであったことを証明したときは、責任を負わない。",1,"正しい(民法714条1項)。"],
["精神上の障害により責任能力を欠く状態で他人に損害を加えた者は、故意または過失によって一時的にその状態を招いた場合であっても、賠償責任を負わない。",0,"誤り。故意または過失により一時的に責任能力を欠く状態を招いたときは責任を負う(民法713条ただし書)。"],
["他人の不法行為に対し、自己または第三者の権利を防衛するため、やむを得ず加害行為をした者は、損害賠償の責任を負わない。",1,"正しい。正当防衛(民法720条1項)。"],
["失火責任法により、失火者は重大な過失がある場合を除き、失火による不法行為責任を負わない。",1,"正しい。"],
["失火責任法は債務不履行責任にも適用されるため、借家人が軽過失で借家を焼失させた場合、家主に対する損害賠償責任を負わない。",0,"誤り。失火責任法は不法行為責任にのみ適用され、借家人の返還義務の不履行(債務不履行責任)には適用されない。"]
]},
{p:2,t:"使用者責任・注文者の責任",s:[
["使用者は、被用者がその事業の執行について第三者に加えた損害を賠償する責任を負う。",1,"正しい(民法715条1項)。"],
["使用者は、被用者の選任および事業の監督について相当の注意をしたとき、または相当の注意をしても損害が生ずべきであったときは、使用者責任を負わない。",1,"正しい(民法715条1項ただし書)。ただし、実際に免責が認められることはまれである。"],
["使用者責任に基づき被害者に賠償した使用者は、被用者に対して求償することが一切できない。",0,"誤り。使用者は被用者に求償できる(民法715条3項)。ただし、判例上、信義則により制限されることがある。"],
["注文者は、注文または指図についてその注文者に過失があったときを除き、請負人がその仕事について第三者に加えた損害を賠償する責任を負わない。",1,"正しい(民法716条)。"],
["注文者は、請負人が仕事について第三者に加えた損害について、常に請負人と連帯して賠償責任を負う。",0,"誤り。注文者は原則として責任を負わず、注文または指図に過失があった場合に限り責任を負う。"]
]},
{p:2,t:"工作物責任・動物占有者の責任・共同不法行為",s:[
["土地の工作物の設置または保存に瑕疵があって他人に損害を生じたときは、まず工作物の占有者が責任を負い、占有者が必要な注意をしたときは所有者が責任を負う。",1,"正しい(民法717条1項)。"],
["工作物責任における所有者の責任は、過失がなくても責任を負う無過失責任である。",1,"正しい。"],
["工作物の占有者は、損害の発生を防止するのに必要な注意をしていた場合であっても、責任を免れることはできない。",0,"誤り。占有者は必要な注意をしたことを証明すれば免責され、その場合は所有者が責任を負う。"],
["動物の占有者は、動物の種類および性質に従い相当の注意をもってその管理をしたときは、その動物が他人に加えた損害を賠償する責任を負わない。",1,"正しい(民法718条1項)。"],
["数人が共同の不法行為によって他人に損害を加えたときは、各自が連帯してその損害を賠償する責任を負う。",1,"正しい(民法719条1項)。"],
["共同行為者のうちいずれの者がその損害を加えたかを知ることができない場合には、共同行為者のいずれも賠償責任を負わない。",0,"誤り。この場合も各自が連帯して賠償責任を負う(民法719条1項後段)。"]
]},
{p:2,t:"不法行為による損害賠償",s:[
["不法行為による損害賠償は、別段の意思表示がない限り、金銭で行うのが原則である。",1,"正しい(民法722条1項・417条)。"],
["他人の名誉を毀損した者に対して、裁判所は損害賠償に代えて、または損害賠償とともに、名誉を回復するのに適当な処分を命じることができる。",1,"正しい(民法723条)。"],
["不法行為の被害者に過失があったときは、裁判所はこれを考慮して損害賠償の額を定めることができる。",1,"正しい(民法722条2項)。不法行為の過失相殺は任意的である。"],
["被害者本人が事理弁識能力のない幼児である場合、被害者側である親の過失を考慮して過失相殺をすることはできない。",0,"誤り。判例上、被害者と身分上・生活関係上一体をなす者(被害者側)の過失を考慮できる。"],
["被害者が加入していた生命保険から遺族が受け取った死亡保険金は、損益相殺として加害者が支払う損害賠償額から控除される。",0,"誤り。判例上、生命保険金は払い込んだ保険料の対価であり、損益相殺の対象とならない。"],
["胎児は、損害賠償の請求権については、既に生まれたものとみなされる。",1,"正しい(民法721条)。"],
["他人の生命を侵害した者は、被害者の父母、配偶者および子に対しては、その財産権が侵害されなかった場合においても、損害の賠償をしなければならない。",1,"正しい(民法711条)。近親者の慰謝料請求権。"]
]},
{p:2,t:"債務不履行",s:[
["債務不履行の形態には、履行遅滞、履行不能、不完全履行がある。",1,"正しい。"],
["債務の履行について確定期限があるときは、債務者はその期限の到来した時から遅滞の責任を負う。",1,"正しい(民法412条1項)。"],
["債務の履行について期限を定めなかったときは、債務者は履行の請求を受けた時から遅滞の責任を負う。",1,"正しい(民法412条3項)。"],
["不確定期限がある債務は、債務者が期限の到来を知ったかどうかにかかわらず、期限が到来した時から当然に遅滞となる。",0,"誤り。期限到来後に履行の請求を受けた時、または期限の到来を知った時のいずれか早い時から遅滞となる(民法412条2項)。"],
["金銭債務の不履行については、債務者は不可抗力をもって抗弁とすることができない。",1,"正しい(民法419条3項)。"],
["債務不履行による損害賠償の範囲は通常生ずべき損害に限られ、特別の事情によって生じた損害は、当事者が予見すべきであったとしても賠償の対象とならない。",0,"誤り。特別の事情による損害も、当事者がその事情を予見すべきであったときは賠償の対象となる(民法416条2項)。"],
["判例上、使用者が労働者の生命・身体の安全に配慮する義務(安全配慮義務)に違反した場合、債務不履行責任を負うことがある。",1,"正しい。"]
]},
{p:2,t:"損害賠償の解決方法",s:[
["示談は、当事者が互いに譲歩して争いをやめることを約する和解契約の一種である。",1,"正しい(民法695条)。"],
["示談が成立した後は、示談当時に予想できなかった重大な後遺症が生じた場合であっても、追加の損害賠償請求は一切認められない。",0,"誤り。判例上、示談当時に予想できなかった後発損害については、追加請求が認められることがある。"],
["民事調停は、裁判官と民間の調停委員で構成される調停委員会が当事者の間に入り、話し合いによる解決を図る手続きである。",1,"正しい。"],
["少額訴訟は、訴訟の目的の価額が60万円以下の金銭の支払いを求める場合に利用でき、原則として1回の期日で審理を終える。",1,"正しい。"],
["少額訴訟の判決に不服がある場合は、地方裁判所に控訴することができる。",0,"誤り。少額訴訟の判決に対しては控訴できず、同じ簡易裁判所に異議を申し立てることができる。"],
["簡易裁判所は、訴訟の目的の価額が140万円を超えない請求について、第一審の裁判権を有する。",1,"正しい(裁判所法33条)。"]
]},
{p:2,t:"国家賠償法",s:[
["国家賠償法では、公権力の行使にあたる公務員が職務を行うについて故意または過失によって違法に他人に損害を加えたときは、国または公共団体が賠償責任を負う。",1,"正しい(国家賠償法1条1項)。"],
["公権力の行使にあたる公務員の職務上の不法行為について、被害者は、国または公共団体とともに公務員個人に対しても直接損害賠償を請求できる。",0,"誤り。判例上、公務員個人は被害者に対して直接責任を負わない。"],
["公務員に故意または重大な過失があったときは、賠償した国または公共団体は、その公務員に求償することができる。",1,"正しい(国家賠償法1条2項)。"],
["道路・河川などの公の営造物の設置または管理に瑕疵があったために他人に損害が生じたときは、国または公共団体は過失の有無にかかわらず賠償責任を負う。",1,"正しい(国家賠償法2条1項)。無過失責任とされる。"],
["公の営造物の設置・管理の瑕疵による損害については、国または公共団体に過失があることを被害者が立証しなければならない。",0,"誤り。営造物責任は無過失責任であり、過失の立証は不要である。"]
]},
{p:"c",calc:"kashitsu"},
{p:"c",calc:"kyodo"},

// ===== 第3編 相続に関する知識 =====
{p:3,t:"親族",s:[
["民法上の親族とは、6親等内の血族、配偶者、3親等内の姻族をいう。",1,"正しい(民法725条)。"],
["兄弟姉妹は、2親等の傍系血族である。",1,"正しい。"],
["配偶者の兄弟姉妹は、2親等の血族である。",0,"誤り。配偶者の兄弟姉妹は2親等の姻族である。"],
["甥・姪は、4親等の傍系血族である。",0,"誤り。甥・姪は3親等の傍系血族である。いとこが4親等。"],
["養子と養親およびその血族との間には、養子縁組の日から血族間におけるのと同一の親族関係が生じる。",1,"正しい(民法727条)。"],
["夫婦の一方が死亡した場合、生存配偶者が姻族関係を終了させる意思を表示したときは、姻族関係は終了する。",1,"正しい(民法728条2項)。離婚の場合は当然に終了する。"]
]},
{p:3,t:"夫婦・親子",s:[
["婚姻は、男女ともに18歳にならなければすることができない。",1,"正しい(民法731条)。"],
["夫婦の一方が日常の家事に関して第三者と法律行為をしたときは、他の一方は、これによって生じた債務について連帯して責任を負う。",1,"正しい(民法761条)。"],
["夫婦の一方が婚姻前から有する財産および婚姻中自己の名で得た財産は、その者の特有財産となる。",1,"正しい(民法762条1項)。"],
["普通養子縁組をすると、養子と実親との親族関係は終了する。",0,"誤り。普通養子縁組では実親との親族関係は継続する。実親との親族関係が終了するのは特別養子縁組である。"],
["特別養子縁組において、養子となる者は原則として15歳未満でなければならない。",1,"正しい(民法817条の5)。"],
["成年に達した子を認知するには、その子の承諾を得なければならない。",1,"正しい(民法782条)。"],
["嫡出でない子の相続分は、嫡出である子の相続分の2分の1である。",0,"誤り。2013年の民法改正により、嫡出でない子の相続分は嫡出である子と同等となった。"]
]},
{p:3,t:"相続人と相続分",s:[
["被相続人の配偶者は、常に相続人となる。",1,"正しい(民法890条)。"],
["相続人の順位は、第1順位が子、第2順位が直系尊属、第3順位が兄弟姉妹である。",1,"正しい。"],
["相続人となるべき兄弟姉妹が相続開始以前に死亡していた場合、その子(甥・姪)が代襲相続し、甥・姪も死亡していればその子が再代襲する。",0,"誤り。兄弟姉妹の代襲相続は甥・姪までで、再代襲は認められない。"],
["相続放棄をした者の子は、放棄した者に代わって代襲相続人となる。",0,"誤り。相続放棄は代襲原因ではない。代襲原因は相続開始以前の死亡、相続欠格、廃除である。"],
["相続人が配偶者と兄弟姉妹の場合、配偶者の法定相続分は4分の3である。",1,"正しい。"],
["相続人が配偶者と直系尊属の場合、配偶者の法定相続分は3分の2である。",1,"正しい。"],
["父母の一方のみを同じくする兄弟姉妹の相続分は、父母の双方を同じくする兄弟姉妹の相続分の2分の1である。",1,"正しい(民法900条4号)。"]
]},
{p:3,t:"相続の承認と放棄",s:[
["相続人は、原則として自己のために相続の開始があったことを知った時から3か月以内に、単純承認・限定承認・相続放棄のいずれかを選択しなければならない。",1,"正しい(民法915条)。この期間を熟慮期間という。"],
["限定承認は、相続人が数人あるときは、共同相続人の全員が共同してのみすることができる。",1,"正しい(民法923条)。"],
["限定承認は、共同相続人のうち1人でも単独で行うことができる。",0,"誤り。共同相続人全員が共同して行わなければならない。"],
["相続放棄は、相続開始前であっても、家庭裁判所の許可を得れば行うことができる。",0,"誤り。相続開始前の相続放棄はできない。相続開始前に家庭裁判所の許可を得てできるのは遺留分の放棄である。"],
["相続人が相続財産の全部または一部を処分したときは、単純承認をしたものとみなされる。",1,"正しい(民法921条1号)。"],
["被相続人が保険契約者・被保険者で、相続人を保険金受取人と指定した死亡保険金は受取人固有の財産であり、その受取人が相続放棄をしても受け取ることができる。",1,"正しい。判例上、受取人の固有財産とされる。"]
]},
{p:3,t:"相続の効力",s:[
["相続人が数人あるときは、相続財産はその共有に属する。",1,"正しい(民法898条)。"],
["配偶者居住権は、相続開始時に被相続人所有の建物に居住していた配偶者が、遺産分割や遺贈などによって取得できる権利である。",1,"正しい(民法1028条)。"],
["配偶者居住権は、登記をしなくても第三者に対抗することができる。",0,"誤り。配偶者居住権を第三者に対抗するには登記が必要である(民法1031条)。"],
["被相続人の親族(相続人等を除く)が無償で療養看護等をして被相続人の財産の維持・増加に特別の寄与をした場合、相続人に対して特別寄与料を請求できる。",1,"正しい(民法1050条)。"],
["預貯金債権は、相続開始と同時に当然に法定相続分に応じて分割されるため、遺産分割の対象とならない。",0,"誤り。2016年の判例変更により、預貯金債権は遺産分割の対象となる。"],
["各共同相続人は、遺産分割前でも、預貯金債権の一定額(1つの金融機関につき150万円が上限)について単独で払戻しを受けることができる。",1,"正しい(民法909条の2)。"]
]},
{p:3,t:"遺言",s:[
["遺言は、15歳に達した者であればすることができる。",1,"正しい(民法961条)。"],
["自筆証書遺言は全文・日付・氏名を自書して押印する必要があるが、添付する財産目録は自書でなくてもよい(各ページへの署名押印が必要)。",1,"正しい(民法968条2項)。"],
["公正証書遺言は、家庭裁判所の検認を受ける必要がない。",1,"正しい。"],
["法務局の遺言書保管制度を利用して保管された自筆証書遺言は、家庭裁判所の検認を受ける必要がない。",1,"正しい。"],
["自筆証書遺言は、法務局で保管されているものを含め、すべて家庭裁判所の検認を受けなければならない。",0,"誤り。法務局で保管された自筆証書遺言は検認が不要である。"],
["2人以上の者が同一の証書で遺言をすることは認められている。",0,"誤り。共同遺言は禁止されている(民法975条)。"],
["遺言者は、いつでも遺言の方式に従って、遺言の全部または一部を撤回することができる。",1,"正しい(民法1022条)。"]
]},
{p:3,t:"遺産分割と遺留分",s:[
["遺産分割は共同相続人の協議によって行うが、協議が調わないときは、家庭裁判所に分割を請求することができる。",1,"正しい(民法907条)。"],
["被相続人は、遺言で、相続開始の時から5年を超えない期間内、遺産の分割を禁止することができる。",1,"正しい(民法908条)。"],
["兄弟姉妹には遺留分がない。",1,"正しい(民法1042条)。"],
["直系尊属のみが相続人である場合の総体的遺留分は、遺留分を算定するための財産の価額の3分の1である。",1,"正しい。それ以外の場合は2分の1。"],
["遺留分を侵害された者は、受遺者等に対して、遺贈の目的物そのものの返還を請求するのが原則である。",0,"誤り。2019年施行の改正により、遺留分侵害額に相当する金銭の支払いを請求する権利(遺留分侵害額請求権)とされた。"],
["遺留分侵害額請求権は、遺留分権利者が相続の開始および遺留分を侵害する贈与・遺贈があったことを知った時から1年間行使しないときは時効により消滅する。",1,"正しい(民法1048条)。相続開始の時から10年を経過したときも同様。"],
["相続開始前における遺留分の放棄は、家庭裁判所の許可を受けたときに限り、その効力を生じる。",1,"正しい(民法1049条)。"]
]},
{p:3,t:"相続欠格・廃除と具体的相続分",s:[
["故意に被相続人を死亡させ、刑に処せられた者は、相続欠格者として相続人となることができない。",1,"正しい(民法891条)。"],
["詐欺または強迫によって被相続人に遺言をさせた者は、相続人となることができない。",1,"正しい(民法891条4号)。"],
["被相続人に対して虐待や重大な侮辱をした推定相続人について、被相続人は家庭裁判所に請求してその者を相続人から廃除することができる。",1,"正しい(民法892条)。対象は遺留分を有する推定相続人。"],
["相続人の廃除は、兄弟姉妹である推定相続人に対しても請求できる。",0,"誤り。廃除の対象は遺留分を有する推定相続人であり、遺留分のない兄弟姉妹は対象とならない。"],
["相続欠格や廃除により相続権を失った者の子は、代襲相続人となることができる。",1,"正しい。相続欠格・廃除は代襲原因となる。"],
["共同相続人の中に被相続人から生計の資本として贈与を受けた者がいるときは、その贈与の価額を相続財産に加えて各相続人の相続分を算定する。",1,"正しい。特別受益(民法903条)。"],
["寄与分は、共同相続人以外の親族であっても、家庭裁判所に請求すれば認められる。",0,"誤り。寄与分は共同相続人に認められるもの。相続人以外の親族は特別寄与料を請求できる。"]
]},
{p:"c",calc:"souzokubun"},
{p:"c",calc:"iryubun"},

// ===== 第4編 安心・安全に関する法律知識 =====
{p:4,t:"自動車損害賠償保障法",s:[
["自賠法では、自己のために自動車を運行の用に供する者(運行供用者)は、その運行によって他人の生命または身体を害したときは、損害賠償責任を負う。",1,"正しい(自賠法3条)。"],
["運行供用者が責任を免れるには、自己および運転者が注意を怠らなかったこと、被害者または第三者に故意・過失があったこと、自動車に構造上の欠陥・機能の障害がなかったことのすべてを証明しなければならない。",1,"正しい。実質的な無過失責任とされる。"],
["自賠法3条の運行供用者責任は、他人の車両や家屋などの物損にも適用される。",0,"誤り。自賠法3条は人身損害(他人の生命・身体)に限られる。物損は民法の不法行為による。"],
["自賠責保険の被害者は、加害者の加入する保険会社に対して直接、損害賠償額の支払いを請求することができる。",1,"正しい。被害者請求(自賠法16条)。"],
["自賠責保険の支払限度額は、被害者1名につき、死亡による損害が3,000万円、傷害による損害が120万円である。",1,"正しい。後遺障害は常時介護を要する場合で最高4,000万円。"],
["自賠責保険では、被害者に過失があれば、その割合に応じて通常の過失相殺が行われる。",0,"誤り。自賠責保険では、被害者に重大な過失(7割以上)がある場合に限り減額される。"],
["ひき逃げや無保険車による事故の被害者は、政府保障事業によって救済を受けることができる。",1,"正しい。"]
]},
{p:4,t:"道路交通法等",s:[
["酒気を帯びて運転するおそれがある者に車両を提供した者も、道路交通法の罰則の対象となる。",1,"正しい。"],
["飲酒運転であることを知りながら運転者に運送を依頼して同乗しても、同乗者は罰則の対象にはならない。",0,"誤り。運転者が酒気を帯びていることを知りながら運送を要求・依頼して同乗した者も罰則の対象となる。"],
["自転車は道路交通法上の軽車両にあたり、車両としての交通ルールが適用される。",1,"正しい。"],
["2023年4月から、自転車を利用するすべての者に乗車用ヘルメットの着用が努力義務化された。",1,"正しい。"],
["2024年11月から、自転車の酒気帯び運転や、運転中に携帯電話を使用する「ながら運転」に対する罰則が整備・強化された。",1,"正しい。"],
["交通事故があったときは、運転者は直ちに運転を停止して負傷者を救護し、道路における危険を防止する等の措置を講じ、警察官に報告しなければならない。",1,"正しい(道路交通法72条)。"],
["交通事故を起こした運転者は、負傷者がいなければ警察官への報告をする必要はない。",0,"誤り。物損事故であっても警察官への報告義務がある。"]
]},
{p:4,t:"自然災害に関する法律",s:[
["災害対策基本法は、防災に関する責務の明確化や防災計画の作成など、災害対策の基本を定めた法律である。",1,"正しい。"],
["災害救助法に基づく救助には、避難所の設置、応急仮設住宅の供与、食品や飲料水の供給などがある。",1,"正しい。"],
["被災者生活再建支援法に基づく支援金は、住宅の被害程度にかかわらず、被災したすべての世帯に一律の額が支給される。",0,"誤り。支援金は、住宅の被害程度に応じた基礎支援金と、住宅の再建方法に応じた加算支援金からなる。"],
["被災者生活再建支援金は、複数世帯で住宅が全壊し住宅を建設・購入する場合、基礎支援金と加算支援金を合わせて最高300万円である。",1,"正しい(基礎支援金100万円+加算支援金200万円)。単数世帯は4分の3の額。"],
["災害弔慰金は、災害により死亡した者の遺族に対し、生計維持者の死亡の場合は500万円、その他の者の死亡の場合は250万円を限度に支給される。",1,"正しい(災害弔慰金の支給等に関する法律)。"],
["地震保険は、地震保険に関する法律に基づき、政府が再保険を引き受けることで運営されている。",1,"正しい。"],
["災害救助法による救助は、被災者からの申請に基づいて、被災者が費用を負担して行われる。",0,"誤り。災害救助法による救助は、都道府県知事等が行い、費用は公費で負担される。"]
]},
{p:4,t:"犯罪リスクに関する法律と被害者支援",s:[
["犯罪被害者等給付金支給法に基づく給付金には、遺族給付金、重傷病給付金、障害給付金がある。",1,"正しい。"],
["犯罪被害者等給付金は、被害者が加害者から損害賠償を受けた場合でも、減額されることなく全額が支給される。",0,"誤り。損害賠償を受けたときは、その額の限度で給付金は支給されない。"],
["振り込め詐欺救済法に基づき、振り込め詐欺等の被害者は、振込先口座の残高から被害回復分配金の支払いを受けられる場合がある。",1,"正しい。"],
["預金者保護法では、偽造・盗難キャッシュカードによる預金の不正払戻しについて、預金者に過失がない場合は、原則として金融機関が全額補償する。",1,"正しい。"],
["預金者保護法では、盗難キャッシュカードによる不正払戻しについて、預金者に重大な過失がある場合でも、金融機関は全額を補償しなければならない。",0,"誤り。預金者に重大な過失がある場合は補償されない(軽過失の場合は4分の3の補償)。"],
["ストーカー規制法では、つきまとい等を行った者に対して、警察による警告や公安委員会による禁止命令等の措置がとられる。",1,"正しい。"]
]},
{p:4,t:"交通・自然災害への備え",s:[
["自動車保険の対人賠償責任保険は、自賠責保険で支払われる金額を超える部分の損害を補償する。",1,"正しい。"],
["火災保険では、地震・噴火またはこれらによる津波を原因とする火災による損害は補償されず、地震保険で補償される。",1,"正しい(地震火災費用保険金を除く)。"],
["地震保険の保険金額は、火災保険の保険金額の30%〜50%の範囲内で、建物5,000万円、家財1,000万円が限度である。",1,"正しい。"],
["地震保険は、火災保険に付帯せず単独で契約することができる。",0,"誤り。地震保険は火災保険に付帯して契約する。"],
["地震保険の損害の程度は、全損・大半損・小半損・一部損の4区分で認定される。",1,"正しい。支払額は保険金額のそれぞれ100%・60%・30%・5%(時価額が限度)。"],
["地震保険の損害の程度は、全損と分損の2区分で認定される。",0,"誤り。全損・大半損・小半損・一部損の4区分である。"],
["地震保険の保険料は、建物の構造と所在地(都道府県)によって異なる。",1,"正しい。"]
]},

// ===== 第5編 リスクマネジメントに関する知識 =====
{p:5,t:"リスクの概念",s:[
["純粋リスクとは損失のみを生じるリスクであり、投機的リスクとは損失と利得の両方の可能性があるリスクである。",1,"正しい。"],
["火災、自然災害、賠償責任などは、典型的な純粋リスクである。",1,"正しい。"],
["為替相場の変動や新規事業への投資は、典型的な純粋リスクである。",0,"誤り。損失だけでなく利得の可能性もあるため、投機的リスクに分類される。"],
["ハザードとは、損失の発生頻度や規模を増大させる要因や状態をいい、損失の原因となる事故(ペリル)とは区別される。",1,"正しい。"],
["ハザードには、建物の構造などの物理的なもののほか、人の不注意や不誠実といった心理的・道徳的なものもある。",1,"正しい。"],
["保険によって処理できるのは主に投機的リスクであり、純粋リスクは保険の対象になりにくい。",0,"誤り。保険の対象となるのは主に純粋リスクである。"]
]},
{p:5,t:"リスクマネジメントの手順と手段",s:[
["リスクマネジメントは、一般に、リスクの発見・確認、リスクの分析・評価、リスク処理手段の選択、実行、結果の検証・見直しという手順で行われる。",1,"正しい。"],
["リスク処理手段は、リスクコントロールとリスクファイナンシングに大別される。",1,"正しい。"],
["保険の購入は、リスクコントロールのうち損失予防に分類される。",0,"誤り。保険はリスクファイナンシングのうち、リスクの移転に分類される。"],
["リスクの回避とは、リスクを伴う活動そのものを行わないことにより、リスクの発生可能性をなくす手段である。",1,"正しい。"],
["発生頻度は低いが損失規模が大きいリスクには、一般に保険によるリスクの移転が適している。",1,"正しい。"],
["発生頻度が高く損失規模も大きいリスクには、保険によるリスクの移転が最も適している。",0,"誤り。発生頻度・損失規模がともに大きいリスクは、一般に回避が適している。"],
["キャプティブ(自社専用の保険子会社)の活用は、リスクファイナンシングの手法の一つである。",1,"正しい。"]
]},
{p:5,t:"純粋リスクの処理例",s:[
["企業の財産損失リスクには、建物・設備の損壊などの直接損害のほか、休業による利益の喪失などの間接損害がある。",1,"正しい。"],
["製造物責任法(PL法)では、製造物の欠陥により他人の生命・身体・財産を侵害した製造業者等は、過失の有無にかかわらず損害賠償責任を負う。",1,"正しい。"],
["PL法の対象となる「製造物」には、不動産や未加工の農林水産物も含まれる。",0,"誤り。PL法の製造物は、製造または加工された動産である。"],
["PL法では、製造物を引き渡した時の科学・技術の知見によっては欠陥を認識できなかったことを証明すれば、製造業者等は免責される。",1,"正しい。開発危険の抗弁(PL法4条1号)。"],
["PL法による損害賠償請求権は、損害および賠償義務者を知った時から3年(人の生命・身体の侵害は5年)行使しないときは時効により消滅する。",1,"正しい(PL法5条)。"],
["会社役員が職務の遂行に関して負う損害賠償責任に備える保険として、会社役員賠償責任保険(D&O保険)がある。",1,"正しい。"],
["企業の休業による利益の減少は、火災保険の建物の補償によって当然に補償される。",0,"誤り。利益の減少は、利益保険や企業費用・利益総合保険などで備える。"]
]},
{p:5,t:"BCPとBCM",s:[
["BCP(事業継続計画)とは、緊急事態が発生した際に、中核となる事業を中断させない、または中断しても目標復旧時間内に再開させるための計画である。",1,"正しい。"],
["BCPの策定では、中核事業の特定、目標復旧時間の設定、代替手段の確保などを検討する。",1,"正しい。"],
["BCM(事業継続マネジメント)とは、BCPの策定から導入、運用、見直しまでを継続的に行うマネジメント活動である。",1,"正しい。"],
["BCPは一度策定すれば、定期的な訓練や見直しを行う必要はない。",0,"誤り。訓練や見直しを継続的に行い、実効性を高める必要がある(BCM)。"],
["BCPは、防災計画と同様に、人命の安全確保と物的被害の軽減のみを目的とする計画である。",0,"誤り。BCPは、防災計画の視点に加え、事業の継続・早期復旧を目的とする。"],
["中小企業等経営強化法に基づき、中小企業が策定した防災・減災の事前対策に関する計画を経済産業大臣が認定する「事業継続力強化計画」の制度がある。",1,"正しい。"]
]},
{p:5,t:"統合的リスクマネジメント(ERM)",s:[
["ERMとは、企業が抱えるさまざまなリスクを、全社的な視点で統合的に把握・管理する手法である。",1,"正しい。"],
["ERMは、純粋リスクだけでなく、戦略リスクなどの投機的リスクも対象とする。",1,"正しい。"],
["ERMは、各部門が個別にリスクを管理し、全社的な視点を持たないことを特徴とする。",0,"誤り。部門ごとの縦割りの管理ではなく、全社的・統合的に管理するのがERMである。"],
["ERMの対象は、保険で移転できる純粋リスクに限られる。",0,"誤り。ERMは投機的リスクを含む全社的なリスクを対象とする。"],
["COSO(トレッドウェイ委員会支援組織委員会)は、ERMのフレームワークを公表している。",1,"正しい。"],
["ISO31000は、リスクマネジメントに関する国際規格である。",1,"正しい。"],
["リスクアペタイトとは、企業が目標を達成するために受け入れる意思のあるリスクの種類と量をいう。",1,"正しい。"]
]},
{p:5,t:"企業経営リスク",s:[
["会社役員は、任務を怠ったことにより会社に損害を生じさせた場合、会社に対して損害賠償責任を負う。",1,"正しい(会社法423条)。"],
["株主は、一定の要件のもとで、会社に代わって役員の責任を追及する訴え(株主代表訴訟)を提起することができる。",1,"正しい。"],
["役員が職務を行うについて悪意または重大な過失があったときは、第三者に生じた損害についても賠償責任を負う。",1,"正しい(会社法429条)。"],
["会社役員賠償責任保険(D&O保険)は、役員が法令違反を認識しながら行った行為や犯罪行為に起因する損害も補償する。",0,"誤り。故意の法令違反や犯罪行為などに起因する損害は、一般に補償の対象外とされる。"],
["使用者は、労働者がその生命・身体の安全を確保しつつ労働できるよう、必要な配慮をする義務(安全配慮義務)を負う。",1,"正しい(労働契約法5条)。"],
["サイバー攻撃による情報漏えいでは、損害賠償責任のほか、原因調査費用や事故対応費用、休業による利益損失なども生じうる。",1,"正しい。"],
["従業員が業務上の事故で死傷した場合は労災保険から給付が行われるため、企業が民事上の損害賠償責任を負うことはない。",0,"誤り。安全配慮義務違反などがあれば、労災保険給付を超える損害について企業が民事上の賠償責任を負うことがある。"]
]},

// ===== 第6編 内部統制等に関する知識 =====
{p:6,t:"コンプライアンスと企業倫理",s:[
["コンプライアンスとは、法令遵守にとどまらず、社内規程や社会規範、企業倫理を守ることも含む概念である。",1,"正しい。"],
["法令に違反していなければ、社会的な批判を受ける行為であってもコンプライアンス上の問題はない。",0,"誤り。コンプライアンスは社会規範や企業倫理の遵守も含むため、法令違反でなくても問題となりうる。"],
["企業には、株主だけでなく、従業員・顧客・取引先・地域社会など、さまざまなステークホルダーの期待に応えることが求められている。",1,"正しい。"],
["会社法は、取締役の職務の執行が法令・定款に適合することを確保するための体制その他業務の適正を確保するための体制を、内部統制として位置づけている。",1,"正しい。"],
["コンプライアンスを推進する体制として、コンプライアンス担当部署や責任者の設置、コンプライアンス・マニュアルの策定などがある。",1,"正しい。"],
["コンプライアンス・プログラムは一度策定すれば十分であり、研修や見直しを継続的に行う必要はない。",0,"誤り。研修・モニタリング・見直しを継続的に行うことが重要である。"]
]},
{p:6,t:"公益通報者保護法",s:[
["公益通報者保護法は2004年に制定され、2020年の改正で、常時使用する労働者が300人を超える事業者に内部通報体制の整備が義務付けられた。",1,"正しい(改正法は2022年6月施行)。300人以下の事業者は努力義務。"],
["公益通報者保護法の改正により内部通報体制の整備が義務付けられたのは、常時使用する労働者が500人を超える事業者である。",0,"誤り。300人を超える事業者である。"],
["公益通報者保護法で保護される通報者には、労働者のほか、退職後1年以内の退職者や役員も含まれる。",1,"正しい。"],
["公益通報者として保護されるのは、事業者内部や行政機関に通報した場合に限られ、報道機関などに通報した場合は保護されない。",0,"誤り。報道機関など外部への通報も、一定の要件を満たせば保護の対象となる。"],
["公益通報をしたことを理由とする解雇は無効であり、降格・減給などの不利益な取扱いも禁止される。",1,"正しい。"],
["内部通報体制の整備が義務付けられた事業者は、公益通報対応業務従事者を定める必要があり、従事者には守秘義務が課される。",1,"正しい。"]
]},
{p:6,t:"コーポレート・ガバナンス",s:[
["コーポレート・ガバナンスとは、企業の経営を監視・規律し、健全で効率的な経営を実現するための仕組みである。",1,"正しい。"],
["指名委員会等設置会社では、指名委員会・監査委員会・報酬委員会の各委員会の委員の過半数は社外取締役でなければならない。",1,"正しい。"],
["指名委員会等設置会社は、監査役を置かなければならない。",0,"誤り。指名委員会等設置会社は監査役を置くことができない。"],
["監査役会設置会社では、監査役は3人以上で、そのうち半数以上は社外監査役でなければならない。",1,"正しい。"],
["コーポレートガバナンス・コードは、原則を実施するか、実施しない場合にはその理由を説明する「コンプライ・オア・エクスプレイン」の手法を採用している。",1,"正しい。"],
["ディスクロージャーとは、企業が投資家などの利害関係者に対して、財務内容や経営状況などの情報を開示することをいう。",1,"正しい。"],
["コーポレートガバナンス・コードは法律であり、違反した上場会社には罰則が科される。",0,"誤り。コーポレートガバナンス・コードは法律ではなく、取引所の上場規則を通じて適用される規範である。"]
]},
{p:6,t:"内部統制",s:[
["会社法では、大会社である取締役会設置会社は、内部統制システムの整備について取締役会で決定しなければならない。",1,"正しい。"],
["金融商品取引法では、上場会社に対して、財務報告に係る内部統制報告書の提出を義務付けている。",1,"正しい(いわゆるJ-SOX)。"],
["金融庁の内部統制の基本的枠組みでは、内部統制の基本的要素として、統制環境、リスクの評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応の6つを挙げている。",1,"正しい。"],
["内部統制は適切に整備・運用されていれば、経営者が不当な目的で内部統制を無視した場合でも、必ず不正を防止できる。",0,"誤り。経営者による無視・無効化など、内部統制には固有の限界がある。"],
["内部監査は、業務執行部門から独立した立場で、内部統制の整備・運用状況を検証・評価する活動である。",1,"正しい。"],
["モニタリングには、業務に組み込まれて行われる日常的モニタリングと、業務から独立した視点で定期的・随時に行われる独立的評価がある。",1,"正しい。"],
["内部統制の独立的評価は、外部の第三者機関のみが行うものであり、経営者や内部監査部門が行うものは含まれない。",0,"誤り。独立的評価は、経営者、取締役会、監査役等、内部監査部門などが行う。"],
["内部統制は一度構築すれば機能し続けるため、その有効性を継続的に確認する必要はない。",0,"誤り。モニタリングにより機能しているかを常に確認し、不備を発見・是正する必要がある。"],
["いわゆる3ラインモデルにおいて、内部監査部門は第1線として、業務執行部門とともにリスクを直接管理する役割を担う。",0,"誤り。内部監査部門は第3線であり、独立した立場から評価を行う。第1線は業務執行部門である。"]
]},
{p:6,t:"不正の防止とリスク管理",s:[
["不正のトライアングルとは、「動機・プレッシャー」「機会」「正当化」の3つの要素がそろったときに不正が発生しやすいとする考え方である。",1,"正しい。"],
["不正のトライアングルの要素のうち「機会」は、内部統制によって低減することが最も困難な要素である。",0,"誤り。「機会」は職務分離や相互チェックなどの内部統制によって最も低減しやすい要素とされる。"],
["不正を防止するため、1人の担当者に一連の業務を任せず、職務を分離することが有効である。",1,"正しい。"],
["保険代理店では、保険料の着服・流用を防止するため、領収した保険料を自己の財産と明確に区分して管理すること(分別管理)が重要である。",1,"正しい。"],
["定期的な人事ローテーションや連続休暇の取得は、不正の抑止や早期発見に有効である。",1,"正しい。"],
["保険代理店で不正が発覚した場合は、顧客や保険会社への報告は行わず、代理店内部で処理することが望ましい。",0,"誤り。速やかに保険会社等へ報告し、適切に対応する必要がある。"]
]},
{p:6,t:"利益相反管理",s:[
["利益相反とは、顧客の利益と、業者自身または他の顧客の利益が相反する状況をいう。",1,"正しい。"],
["保険業法では、保険会社に対し、グループ内の金融機関の取引に伴い顧客の利益が不当に害されることのないよう、利益相反管理体制の整備を義務付けている。",1,"正しい。"],
["利益相反の管理方法には、部門の分離、取引条件や方法の変更、取引の中止、利益相反の事実の顧客への開示などがある。",1,"正しい。"],
["利益相反のおそれがある取引は、管理方法を問わず、すべて一律に禁止しなければならない。",0,"誤り。部門の分離や顧客への開示など適切な方法で管理することで、取引を行うことができる。"],
["利益相反管理は、顧客の利益よりも自社の利益を確保することを主な目的としている。",0,"誤り。顧客の利益が不当に害されることを防ぐことが目的である。"],
["金融機関に利益相反管理体制の整備を義務付けているのは、金融サービス提供法である。",0,"誤り。利益相反管理体制の整備義務は、保険業法・銀行法・金融商品取引法などに定められている。"],
["利益相反管理は、利益相反のおそれのある取引をあらかじめ特定して管理するものであり、問題が起きるたびに再発防止策を講じるだけでは足りない。",1,"正しい。"],
["保険代理店が、手数料が高いことを理由に顧客の意向に沿わない商品を推奨することは、利益相反の典型的な例である。",1,"正しい。"],
["2024年施行の改正金融サービス提供法では、金融事業者に対し、顧客等の最善の利益を勘案しつつ、誠実かつ公正に業務を遂行する義務が定められた。",1,"正しい。"]
]},
{p:6,t:"公正な事業活動のための法律",s:[
["独占禁止法は、私的独占、不当な取引制限(カルテル)、不公正な取引方法などを禁止している。",1,"正しい。"],
["独占禁止法を運用する行政機関は、公正取引委員会である。",1,"正しい。"],
["競争関係にある事業者同士が話し合って価格を取り決めるカルテルは、独占禁止法上の「不公正な取引方法」に該当する。",0,"誤り。カルテルは「不当な取引制限」に該当する。"],
["景品表示法は、優良誤認表示や有利誤認表示などの不当表示と、過大な景品類の提供を規制している。",1,"正しい。"],
["2023年10月から、広告であることを隠した表示(いわゆるステルスマーケティング)は、景品表示法の不当表示として規制されている。",1,"正しい。"],
["景品表示法は、公正取引委員会が単独で所管している。",0,"誤り。景品表示法は消費者庁が所管している。"]
]},
{p:6,t:"消費者保護に関する法律",s:[
["消費者契約法では、事業者の不実告知等により誤認して契約した消費者は、その契約を取り消すことができる。",1,"正しい。"],
["消費者契約法による誤認を理由とする取消権は、追認をすることができる時から1年間、または契約締結時から5年間行使しないときは時効により消滅する。",1,"正しい。"],
["事業者の損害賠償責任の全部を免除する契約条項は、消費者契約法により無効となる。",1,"正しい。"],
["消費者契約法は、事業者同士の契約にも適用される。",0,"誤り。消費者契約法は消費者と事業者の間の契約に適用される。"],
["個人情報保護法では、個人の権利利益を害するおそれが大きい個人データの漏えい等が発生した場合、個人情報保護委員会への報告と本人への通知が義務付けられている。",1,"正しい。"],
["個人情報取扱事業者は、法令に基づく場合であっても、本人の同意なく個人データを第三者に提供することは一切できない。",0,"誤り。法令に基づく場合や、人の生命・身体・財産の保護に必要な場合などは、本人の同意なく提供できる。"],
["保険業法では、保険期間が1年以下の契約などを除き、保険契約の申込みの撤回等(クーリング・オフ)が認められている。",1,"正しい。"]
]},
{p:6,t:"労働に関する法律",s:[
["労働基準法の法定労働時間は、原則として1日8時間、1週40時間である。",1,"正しい。"],
["法定労働時間を超えて労働させるには、労使協定(36協定)を締結し、労働基準監督署長に届け出る必要がある。",1,"正しい。"],
["使用者は、労働時間が6時間を超える場合は少なくとも30分、8時間を超える場合は少なくとも1時間の休憩を与えなければならない。",0,"誤り。6時間を超える場合は少なくとも45分である。"],
["使用者は、年10日以上の年次有給休暇が付与される労働者に対して、そのうち年5日については時季を指定して取得させなければならない。",1,"正しい。"],
["労働者を解雇しようとする場合、使用者は原則として少なくとも30日前に予告をするか、30日分以上の平均賃金を支払わなければならない。",1,"正しい。"],
["有期労働契約が更新されて通算5年を超えた場合、労働者の申込みにより期間の定めのない労働契約に転換される。",1,"正しい(労働契約法18条)。"],
["月60時間を超える時間外労働に対する50%以上の割増賃金率は大企業にのみ適用され、中小企業には適用されない。",0,"誤り。2023年4月から中小企業にも適用されている。"]
]},
{p:6,t:"カスタマーハラスメント",s:[
["カスタマーハラスメントに当たるかどうかは、顧客の要求内容の妥当性と、要求を実現するための手段・態様が社会通念上相当かどうかの観点から判断される。",1,"正しい。"],
["顧客の要求内容に妥当性がある場合は、威圧的な言動や長時間の拘束を伴っていても、カスタマーハラスメントには当たらない。",0,"誤り。要求内容に妥当性があっても、手段・態様が社会通念上不相当であればカスタマーハラスメントに当たりうる。"],
["事業主には、カスタマーハラスメント対策として、基本方針の明確化や対応ルール・手順の策定、従業員への教育、相談体制の整備などが求められる。",1,"正しい。"],
["カスタマーハラスメントの被害を受けた従業員へのケア(メンタルヘルスへの配慮など)も、事業主の取組みとして求められる。",1,"正しい。"],
["カスタマーハラスメントは顧客と従業員個人の間の問題であり、事業主が組織として対応する必要はない。",0,"誤り。従業員の就業環境を守るため、組織として対応することが求められる。"]
]},

// ===== 損害保険に関する募集コンプライアンス =====
{p:7,t:"代理店登録と募集人届出",s:[
["損害保険代理店は、内閣総理大臣(財務局等)の登録を受けなければ保険募集を行うことができない。",1,"正しい(保険業法276条)。"],
["損害保険代理店の役員・使用人として保険募集を行う者は、財務局等に募集人として届け出なければならない。",1,"正しい(保険業法302条)。"],
["損保一般試験の基礎単位に合格していれば、財務局等への届出をしなくても、募集人として保険募集を行うことができる。",0,"誤り。試験合格に加えて、財務局等への募集人の届出が必要である。"],
["損保一般試験には基礎単位のほか、取り扱う保険商品に応じた商品単位がある。",1,"正しい。"],
["法人代理店の役員に変更があった場合など、登録事項に変更が生じたときは、財務局等に届け出る必要がある。",1,"正しい。"],
["法人代理店に出向している社員は、常態的に出向元の法人で勤務している場合でも、出向先代理店の募集人として届け出ることができる。",0,"誤り。出向先代理店の募集人となるには、出向先の業務に常態的に従事している必要がある。"],
["保険募集人は、募集を行う際に、所属保険会社の商号や、自らが契約締結の代理を行うのか媒介を行うのかなどを顧客に明示しなければならない。",1,"正しい(権限等の明示)。"]
]},
{p:7,t:"保険募集の禁止行為",s:[
["保険契約者に対して虚偽のことを告げ、または保険契約の契約条項のうち重要な事項を告げない行為は、保険業法で禁止されている。",1,"正しい(保険業法300条1項1号)。"],
["保険契約者等が保険会社に重要な事実を告げるのを妨げ、または告げないことを勧める行為は禁止されている。",1,"正しい(告知妨害・不告知教唆)。"],
["保険料の割引・割戻しなど特別の利益の提供を約束し、または提供する行為は禁止されている。",1,"正しい。"],
["社会通念上相当な範囲の粗品であっても、保険契約者に提供することは特別利益の提供として一律に禁止されている。",0,"誤り。社会通念上相当と認められる範囲の粗品等の提供は、特別利益の提供にあたらない。"],
["不利益となる事実を告げずに既存の契約を消滅させ、新たな契約の申込みをさせる行為(不当な乗換募集)は禁止されている。",1,"正しい。"],
["他の保険契約と比較して、誤解させるおそれのある表示をすることは禁止されている。",1,"正しい。"],
["契約者の了解さえあれば、代理店が契約者に代わって告知書に記入し、内容を確認させずに提出してもよい。",0,"誤り。告知は契約者等が自ら行うものであり、代理店が代わりに記入して確認させない行為は不適切である。"]
]},
{p:7,t:"意向把握と情報提供",s:[
["2016年施行の改正保険業法により、保険募集人には、顧客の意向を把握し、それに沿った保険契約を提案・説明・確認する義務(意向把握義務)が課された。",1,"正しい。"],
["保険募集人は、契約概要や注意喚起情報を記載した書面を用いるなどして、顧客に重要事項を説明する必要がある(情報提供義務)。",1,"正しい。"],
["意向把握義務は、顧客から申出があった場合にのみ果たせばよい。",0,"誤り。すべての保険募集において、顧客の意向を把握する必要がある。"],
["契約締結前に、顧客の最終的な意向と申込みの内容が合致しているかを確認する必要がある。",1,"正しい(意向確認)。"],
["複数の保険会社の商品を扱う代理店が特定の商品を推奨する場合、比較可能な商品の概要と、その商品を推奨する理由を説明する必要がある。",1,"正しい(比較推奨販売)。"],
["注意喚起情報には、クーリング・オフや告知義務、責任開始日、主な免責事由など、顧客に特に注意を促すべき事項が記載される。",1,"正しい。"],
["高齢の顧客への募集であっても、特別な配慮は求められず、他の顧客と同じ手順で行えば足りる。",0,"誤り。親族の同席や複数回の面談など、高齢者の特性に配慮した対応が求められる。"]
]},
{p:7,t:"告知受領",s:[
["告知義務は、危険に関する重要な事項のうち保険会社が告知を求めた事項について回答する義務(質問応答義務)である。",1,"正しい。"],
["保険契約の締結の代理権と告知受領権を持つ代理店に対して告げられた事実は、保険会社に告知されたものとして扱われる。",1,"正しい。"],
["保険契約の締結の媒介のみを行う代理店は告知受領権を持たないため、契約者が口頭で代理店に告げただけでは告知したことにならない。",1,"正しい。告知書や申込書に正しく記入してもらう必要がある。"],
["何が告知事項に当たるかの説明は代理店の役割ではなく、告知の内容はすべて契約者の自己責任である。",0,"誤り。代理店は、告知事項を契約者等に正しく理解してもらい、正確な告知を取り付ける必要がある。"],
["告知義務違反があった場合に契約が解除されるなど不利益が生じうることは、顧客に説明する必要がある。",1,"正しい。"],
["代理店が契約者に事実を告げないよう勧めた場合、保険会社は原則として告知義務違反を理由に契約を解除することができない。",1,"正しい。"]
]},
{p:7,t:"保険料の領収と管理",s:[
["代理店は、領収した保険料を自己の財産と明確に区分し、保険料専用の口座などで管理する必要がある。",1,"正しい(分別管理)。"],
["代理店が領収した保険料を一時的に自己の運転資金に流用することは、期日までに保険会社に精算すれば問題ない。",0,"誤り。保険料の流用は、期日までに精算する場合であっても認められない。"],
["保険料を領収したときは、保険会社所定の領収証を発行する必要がある。",1,"正しい。"],
["契約者の資金繰りが苦しい場合は、代理店が保険料を立て替えて保険会社に支払ってもよい。",0,"誤り。保険料の立替えは認められない(特別利益の提供にあたるおそれもある)。"],
["領収した保険料は、所定の期日までに遅滞なく保険会社に精算(送金)する必要がある。",1,"正しい。"]
]},
{p:7,t:"代理店の体制整備",s:[
["2016年施行の改正保険業法により、保険代理店にも、業務の規模・特性に応じた体制整備義務が課された。",1,"正しい。"],
["代理店の体制整備には、募集人に対する教育・管理・指導、顧客情報の適正な管理、苦情への対応、委託先の管理などが含まれる。",1,"正しい。"],
["所属保険会社が研修を実施していれば、募集人が多数いる代理店であっても、代理店自身が募集人の教育・管理を行う必要はない。",0,"誤り。代理店の規模に応じて、代理店自身が募集人の教育・管理・指導を行う体制を整える必要がある。"],
["苦情を通じて不備が判明した場合は、苦情に対処するだけでなく、発生原因を分析して改善策を講じることが求められる。",1,"正しい。"],
["体制整備は、規程を形式的に整えるだけでなく、PDCAサイクルを回して実効性を確保し、その対応を記録に残すことが重要である。",1,"正しい。"],
["代理店の体制整備は、規模や業務特性にかかわらず、すべての代理店に同一の水準が求められる。",0,"誤り。代理店の規模や業務の特性に応じた体制整備が求められる。"]
]},
{p:7,t:"便宜供与と保険金関連事業",s:[
["保険会社から代理店への過度な便宜供与は、代理店が顧客本位ではなく便宜を受けられる保険会社の商品を優先するおそれがあるため、是正が求められている。",1,"正しい。"],
["保険会社の役職員が、代理店主催のイベントに保険業と関係の薄い労務を提供する形で参加することは、過度な便宜供与にあたるおそれがある。",1,"正しい。"],
["代理店と良好な関係を築くためであれば、保険会社が代理店の兼業先の商品を大量に購入しても問題はない。",0,"誤り。過度な便宜供与にあたるおそれがあり、不適切である。"],
["自動車整備業や建設業など、保険金の使途となる財・サービスを提供する事業(保険金関連事業)を兼業する代理店は、利益相反の弊害を防止する態勢を構築する必要がある。",1,"正しい。"],
["修理業を兼業する代理店が、自社で修理を請け負った事故の保険金請求に関与する場合は、修理費の水増しなど利益相反のおそれがあるため注意が必要である。",1,"正しい。"],
["保険金関連事業を兼業している代理店であっても、顧客との利益相反のおそれはないため、特別な管理態勢は必要ない。",0,"誤り。利益相反のおそれがあるため、自律的な管理態勢の構築が求められる。"]
]},
{p:7,t:"顧客情報の管理と反社会的勢力への対応",s:[
["代理店は、個人情報保護法に基づき、顧客の個人データの漏えいなどを防ぐための安全管理措置を講じる必要がある。",1,"正しい。"],
["保険募集で取得した顧客情報を、本人の同意なく兼業先の商品の営業に利用することは、利用目的の範囲外となるおそれがある。",1,"正しい。"],
["顧客情報の漏えいのおそれを把握した場合でも、代理店内部で処理すれば足り、所属保険会社への報告は不要である。",0,"誤り。速やかに所属保険会社へ報告し、指示に従って対応する必要がある。"],
["健康状態など要配慮個人情報(機微情報)の取得・利用は、保険業務の適切な運営に必要な範囲などに限定されている。",1,"正しい。"],
["反社会的勢力との関係を遮断するため、契約締結時の確認などを行い、反社会的勢力と判明した場合は取引を行わないことが求められる。",1,"正しい。"],
["反社会的勢力であっても、保険料が確実に支払われる契約であれば取引を継続してよい。",0,"誤り。反社会的勢力との取引は行わないことが求められる。"]
]}
];

const TAX = [
// ===== 第1編 税金の基礎知識 =====
{p:1,t:"税金の基礎",s:[
["税金は、課税主体によって国税と地方税に、税負担者と納税義務者が同じかどうかによって直接税と間接税に分類される。",1,"正しい。"],
["所得税、法人税、相続税は国税の直接税であり、消費税は国税の間接税である。",1,"正しい。"],
["固定資産税は国税である。",0,"誤り。固定資産税は市町村税(東京23区は都税)である。"],
["申告納税方式は、納税者が自ら税額を計算して申告・納付する方式であり、所得税・法人税・相続税などで採用されている。",1,"正しい。"],
["賦課課税方式は、納税者が自ら税額を計算して申告する方式であり、固定資産税などで採用されている。",0,"誤り。賦課課税方式は、国や地方公共団体が税額を決定して納税者に通知する方式である。"],
["延滞税や過少申告加算税、無申告加算税などは、本来の税に付随して課される附帯税である。",1,"正しい。"],
["租税には、累進的な課税や社会保障への支出を通じて、所得や資産の再分配を図る役割がある。",1,"正しい。"],
["源泉徴収は、給与や報酬などの支払者が支払いの際に所得税を差し引き、国に納付する制度である。",1,"正しい。"]
]},
{p:1,t:"所得税の仕組み",s:[
["所得税は、個人が1月1日から12月31日までの1年間に得た所得に対して課される。",1,"正しい(暦年課税)。"],
["所得税では、所得をその性質に応じて10種類に区分して計算する。",1,"正しい。"],
["所得税の税率は、課税総所得金額に応じて5%から45%までの7段階の超過累進税率となっている。",1,"正しい。"],
["所得税の税率は、所得の多寡にかかわらず一律20%の比例税率である。",0,"誤り。総合課税の所得には5%〜45%の超過累進税率が適用される。"],
["所得税の確定申告は、原則として翌年2月16日から3月15日までの間に行う。",1,"正しい。"],
["給与の支払いを1か所から受け、給与収入が2,000万円以下の給与所得者は、給与所得以外の所得が20万円以下であれば、原則として確定申告は不要である。",1,"正しい。"],
["1か所から給与を受けている年収500万円の給与所得者は、給与以外に雑所得が30万円あっても確定申告をする必要はない。",0,"誤り。給与所得以外の所得が20万円を超えるため、確定申告が必要である。"],
["個人事業主が納付した所得税は、事業所得の計算上、必要経費に算入できる。",0,"誤り。所得税や住民税は必要経費にならない。事業税や事業用資産の固定資産税は必要経費になる。"],
["2013年から2037年までの各年分の所得税には、基準所得税額の2.1%の復興特別所得税があわせて課される。",1,"正しい。"],
["退職所得や山林所得は、他の所得と合算して総合課税される。",0,"誤り。退職所得・山林所得は他の所得と合算せず分離課税される。"]
]},
{p:1,t:"各種所得と損益通算",s:[
["一時所得の金額は、総収入金額から、その収入を得るために支出した金額と特別控除額(最高50万円)を控除して計算する。",1,"正しい。"],
["一時所得は、その金額の2分の1に相当する額が総所得金額に算入される。",1,"正しい。"],
["一時所得の金額は、その全額が総所得金額に算入される。",0,"誤り。一時所得の金額の2分の1が総所得金額に算入される。"],
["不動産所得、事業所得、山林所得、譲渡所得の損失は、一定の場合を除き、他の所得と損益通算できる。",1,"正しい。"],
["一時所得の計算上生じた損失は、他の所得と損益通算することができる。",0,"誤り。一時所得の損失は損益通算できない。"],
["配当所得の計算上生じた損失は、損益通算の対象とならない。",1,"正しい。損益通算できるのは不動産所得・事業所得・山林所得・譲渡所得の損失に限られる。"],
["保険料負担者が受け取った満期返戻金は、一時所得として課税される。",1,"正しい。"],
["給与所得の金額は、給与等の収入金額から給与所得控除額を差し引いて計算する。",1,"正しい。"],
["公的年金等は、雑所得として課税される。",1,"正しい。"]
]},
{p:1,t:"所得控除",s:[
["社会保険料控除は、自己または生計を一にする配偶者その他の親族が負担すべき社会保険料を支払った場合に、支払った全額が控除される。",1,"正しい。"],
["医療費控除の額は、支払った医療費から保険金等で補てんされる金額を差し引き、さらに10万円(総所得金額等が200万円未満の者は総所得金額等の5%)を差し引いた額で、最高200万円である。",1,"正しい。"],
["医療費控除の計算では、入院給付金などの保険金で補てんされた金額を差し引く必要はない。",0,"誤り。保険金等で補てんされる金額は差し引いて計算する。"],
["地震保険料控除の控除限度額は、所得税で5万円、住民税で2万5千円である。",1,"正しい。"],
["火災保険料のうち地震保険料以外の部分も、地震保険料控除の対象となる。",0,"誤り。対象は地震保険料(および経過措置の旧長期損害保険料)に限られる。"],
["生命保険料控除(新制度)の所得税の控除限度額は、一般生命保険料・介護医療保険料・個人年金保険料の各4万円、合計12万円である。",1,"正しい。"],
["小規模企業共済等掛金控除では、掛金の全額が控除される。",1,"正しい。iDeCoの掛金も対象。"]
]},
{p:1,t:"相続税",s:[
["相続税の基礎控除額は、「3,000万円+600万円×法定相続人の数」で計算する。",1,"正しい。"],
["基礎控除額の計算上、法定相続人の数に含める養子の数は、実子がいる場合は1人まで、実子がいない場合は2人までである。",1,"正しい。"],
["相続放棄をした者がいる場合、基礎控除額の計算上の法定相続人の数からその者を除いて計算する。",0,"誤り。相続放棄がなかったものとして法定相続人の数を数える。"],
["配偶者の税額軽減により、配偶者が取得した財産が1億6,000万円または配偶者の法定相続分相当額のいずれか多い金額までは、相続税はかからない。",1,"正しい。"],
["相続税の申告期限は、相続の開始があったことを知った日の翌日から10か月以内である。",1,"正しい。"],
["相続税は金銭で一時に納付するのが原則だが、要件を満たせば延納ができ、延納によっても金銭で納付することが困難な場合には物納が認められる。",1,"正しい。"],
["相続税の納税者は、要件を満たせば延納と物納のいずれかを自由に選択することができる。",0,"誤り。物納は、延納によっても金銭で納付することが困難な場合に限り認められる。"],
["配偶者の税額軽減は、その適用によって納付税額がゼロになる場合でも、相続税の申告書を提出しなければ適用を受けられない。",1,"正しい。"],
["相続税の申告期限は、相続の開始があったことを知った日の翌日から4か月以内である。",0,"誤り。相続税は10か月以内。4か月以内は被相続人の所得税の準確定申告の期限である。"],
["被相続人の1親等の血族(代襲相続人である孫を含む)および配偶者以外の者が財産を取得した場合、その者の相続税額は2割加算される。",1,"正しい。兄弟姉妹などが対象。"],
["小規模宅地等の特例により、特定居住用宅地等は330㎡までの部分について評価額が80%減額される。",1,"正しい。"]
]},
{p:1,t:"贈与税",s:[
["暦年課税による贈与税の基礎控除額は、受贈者1人につき年間110万円である。",1,"正しい。"],
["相続時精算課税制度は、原則として60歳以上の父母・祖父母から18歳以上の子・孫への贈与について選択できる。",1,"正しい。"],
["相続時精算課税制度では累計2,500万円の特別控除があり、2024年1月以後の贈与からは別途年110万円の基礎控除が設けられている。",1,"正しい。"],
["相続時精算課税制度の特別控除額を超える部分には、一律30%の贈与税が課される。",0,"誤り。特別控除額を超える部分は一律20%である。"],
["相続時精算課税を選択した後も、同じ贈与者からの贈与について、翌年以降は暦年課税に戻すことができる。",0,"誤り。一度選択すると、その贈与者からの贈与について暦年課税に戻ることはできない。"],
["婚姻期間が20年以上の夫婦間で居住用不動産等を贈与した場合、基礎控除とは別に最高2,000万円を控除できる(贈与税の配偶者控除)。",1,"正しい。"],
["著しく低い価額で財産を譲り受けた場合、時価と対価との差額に相当する金額は贈与により取得したものとみなされる。",1,"正しい(みなし贈与財産)。"],
["贈与税は、要件を満たせば延納は認められるが、物納は認められない。",1,"正しい。"],
["贈与税は、要件を満たせば相続税と同様に物納が認められる。",0,"誤り。贈与税に物納の制度はなく、延納のみ認められる。"],
["個人が法人から財産の贈与を受けた場合は、贈与税の課税対象となる。",0,"誤り。法人からの贈与は所得税(一時所得や給与所得など)の対象となる。"],
["贈与税の申告期限は、贈与を受けた年の翌年2月1日から3月15日までである。",1,"正しい。"]
]},
{p:1,t:"法人税",s:[
["法人税の課税所得金額は、益金の額から損金の額を差し引いて計算する。",1,"正しい。"],
["法人税の申告期限は、原則として事業年度終了の日の翌日から2か月以内である。",1,"正しい。"],
["日本国内に本店がない外国法人も、日本国内で生じた所得(国内源泉所得)については法人税が課される。",1,"正しい。"],
["宗教法人や学校法人などの公益法人等には、所得の全部に対して法人税が課される。",0,"誤り。公益法人等は、収益事業から生じた所得に対してのみ課税される。"],
["取引先の倒産などにより売掛金や貸付金の債権が法的に消滅した場合、その貸倒損失は損金に算入できる。",1,"正しい。"],
["普通法人の法人税の基本税率は23.2%であり、中小法人の年800万円以下の所得には軽減税率が適用される。",1,"正しい。"],
["法人が支出した交際費等は、法人の規模にかかわらず原則として全額損金に算入できる。",0,"誤り。交際費等は原則として損金不算入であり、中小法人の定額控除などの特例がある。"],
["青色申告法人の欠損金は、一定の期間繰り越して、以後の事業年度の所得から控除することができる。",1,"正しい(2018年4月1日以後開始事業年度に生じた欠損金は10年)。"],
["法人が役員に支給する給与は、定期同額給与や事前確定届出給与など一定のものに限り損金に算入できる。",1,"正しい。"],
["法人税の申告期限は、事業年度終了の日の翌日から6か月以内である。",0,"誤り。原則として2か月以内である(申告期限の延長の特例あり)。"]
]},
{p:1,t:"その他の租税と地方税",s:[
["消費税の標準税率は10%(うち地方消費税2.2%)、軽減税率は8%(うち地方消費税1.76%)である。",1,"正しい。"],
["損害保険料は、消費税の非課税取引である。",1,"正しい。"],
["保険金の受取りは資産の譲渡等の対価にあたるため、消費税の課税対象となる。",0,"誤り。保険金は資産の譲渡等の対価ではないため、課税対象外(不課税)である。"],
["個人住民税は、前年の所得を基に計算され、その年の1月1日現在の住所地で課税される。",1,"正しい。"],
["個人住民税の所得割の標準税率は、道府県民税4%と市町村民税6%を合わせて10%である。",1,"正しい。"],
["固定資産税の課税標準は固定資産課税台帳に登録された価格であり、評価の基準は総務大臣が定め、価格は市町村長が決定する。",1,"正しい。"],
["自動車重量税の税額は、自動車の取得価額に一定の税率を乗じて計算する。",0,"誤り。自動車重量税は、自動車の区分や重量などに応じた定額で課される。"],
["個人住民税には、所得割・均等割のほか、利子割・配当割・株式等譲渡所得割がある。",1,"正しい。"],
["法人事業税の外形標準課税は、付加価値割・資本割・所得割で構成されている。",1,"正しい(資本金1億円超の法人などが対象)。"],
["個人事業税は、所得税と同様に10種類すべての所得を課税対象とする。",0,"誤り。個人事業税は、法定の業種を営む者の事業所得等が課税対象である。"],
["不動産取得税は、不動産を取得した者に対して都道府県が課す税である。",1,"正しい。"]
]},
{p:"c",calc:"souzokuKiso"},
{p:"c",calc:"zoyo"},
{p:"c",calc:"seiho"},
{p:"c",calc:"taishoku"},

// ===== 第2編 損害保険契約等にかかる税務知識 =====
{p:2,t:"保険料と所得控除(個人)",s:[
["個人が支払った火災保険料のうち地震保険料部分は、地震保険料控除の対象となる。",1,"正しい。"],
["身体の傷害のみに基因して保険金が支払われる傷害保険の保険料は、生命保険料控除の対象とならない。",1,"正しい。"],
["損害保険会社の所得補償保険や医療保険の保険料は、介護医療保険料控除の対象となる。",1,"正しい。"],
["自動車保険の保険料は、地震保険料控除の対象となる。",0,"誤り。自動車保険料は地震保険料控除・生命保険料控除のいずれの対象にもならない。"],
["2006年12月31日までに締結した一定の長期損害保険契約の保険料は、経過措置により地震保険料控除の対象となる(所得税の控除限度額1万5千円)。",1,"正しい。"]
]},
{p:2,t:"地震保険料控除",s:[
["本人または生計を一にする親族が所有し、常時居住している家屋や生活用動産を保険の対象とする地震保険の保険料は、地震保険料控除の対象となる。",1,"正しい。"],
["本人が所有し、季節的にのみ使用している別荘を保険の対象とする地震保険の保険料も、地震保険料控除の対象となる。",0,"誤り。常時居住の用に供していない別荘は対象とならない。"],
["年間の地震保険料が50,000円以下であれば、その全額が所得税の地震保険料控除の対象となる。",1,"正しい(旧長期損害保険契約がない場合)。"],
["住民税の地震保険料控除額は、支払った地震保険料の2分の1で、最高25,000円である。",1,"正しい。"],
["店舗併用住宅の地震保険料は、居住用部分の割合にかかわらず、全額が地震保険料控除の対象となる。",0,"誤り。原則として居住用部分に対応する保険料が対象となる(居住用部分がおおむね90%以上なら全額を対象にできる)。"],
["地震保険料控除の対象は地震保険料部分であり、あわせて契約した火災保険の保険料部分は対象とならない。",1,"正しい。"]
]},
{p:2,t:"生命保険料控除",s:[
["生命保険料控除の対象となるのは、保険金等の受取人のすべてが本人または配偶者その他の親族である契約の保険料である。",1,"正しい。"],
["保険金受取人のすべてが本人の親族である生命保険契約の保険料は、生命保険料控除の対象とならない。",0,"誤り。受取人のすべてが本人・配偶者その他の親族であることが、控除の対象となる要件である。"],
["2012年1月1日以後に締結した、疾病や身体の傷害などによる医療費の支払事由に基因して保険金等が支払われる契約の保険料は、介護医療保険料控除の対象となる。",1,"正しい。"],
["2012年1月1日以後に締結した契約で一般の生命保険料を年間100,000円支払った場合、所得税の一般生命保険料控除額は40,000円となる(扶養親族に関する特例は考慮しない)。",1,"正しい。80,000円超は一律40,000円。"],
["給与収入が2,000万円を超える者は、生命保険料控除を受けることができない。",0,"誤り。生命保険料控除に所得制限はない。"],
["少額短期保険業者と締結した保険契約の保険料も、生命保険料控除の対象となる。",0,"誤り。少額短期保険の保険料は生命保険料控除の対象とならない。"]
]},
{p:2,t:"保険料の税務(個人事業主)",s:[
["個人事業主が事業用建物について支払った火災保険料(掛捨型)は、事業所得の必要経費に算入できる。",1,"正しい。"],
["個人事業主が店舗併用住宅の火災保険料を支払った場合、その全額を事業所得の必要経費に算入できる。",0,"誤り。必要経費となるのは事業用部分に対応する保険料に限られる。"],
["個人事業主が、生計を一にする父の所有する建物全体を店舗として使用し、その建物の火災保険料を支払った場合、その保険料は必要経費となる。",1,"正しい。生計を一にする親族の資産を事業に使用している場合、その資産に係る保険料は必要経費に算入できる。"],
["個人事業主が支払った火災保険料に翌年分が含まれる場合でも、短期前払費用の要件を満たして継続適用するなら、支払った年の必要経費とすることができる。",1,"正しい。"],
["個人事業主が満期返戻金付きの火災保険の保険料を支払った場合、積立保険料部分は資産に計上し、補償に相当する部分は必要経費となる。",1,"正しい。"],
["個人事業主が、自分自身と従業員を被保険者とする傷害保険の保険料を支払った場合、その全額が必要経費となる。",0,"誤り。事業主本人を被保険者とする部分は必要経費とならない。"],
["個人事業主が、従業員が所有し通勤にのみ使っている自動車の保険料を負担した場合、その保険料は従業員の給与として課税される。",1,"正しい。"]
]},
{p:2,t:"保険料の税務(法人)",s:[
["法人が支払った掛捨型の火災保険料は、原則として期間の経過に応じて損金に算入される。",1,"正しい。"],
["法人が長期の保険料を一括で支払った場合、当期に対応する部分は損金とし、翌期以降に対応する部分は前払保険料として資産に計上する。",1,"正しい。"],
["法人が支払った積立型損害保険の保険料のうち、積立保険料部分は資産に計上する。",1,"正しい。"],
["法人が支払った積立型損害保険の積立保険料部分は、支払時に全額損金に算入できる。",0,"誤り。積立保険料部分は資産に計上し、危険保険料部分が損金となる。"],
["法人が全役員・従業員を被保険者とし、保険金受取人を法人とする掛捨型の傷害保険の保険料は、損金に算入できる。",1,"正しい。"],
["法人が特定の役員のみを被保険者とし、保険金受取人をその役員またはその遺族とする掛捨型の傷害保険の保険料は、原則としてその役員に対する給与となる。",1,"正しい。"],
["法人が役員個人所有の自宅の火災保険料を負担した場合、法人の損金となり、その役員に課税されることはない。",0,"誤り。個人の資産に係る保険料を法人が負担した場合は、原則としてその者に対する給与(役員給与)となる。"]
]},
{p:2,t:"保険金の税務(損害・傷害)",s:[
["個人が居住用建物や家財の損害に対して受け取った火災保険金は、非課税である。",1,"正しい。"],
["被保険者本人が受け取った、身体の傷害に基因して支払われる入院保険金・通院保険金・後遺障害保険金は、非課税である。",1,"正しい。"],
["被保険者本人が受け取った所得補償保険の保険金は、非課税である。",1,"正しい。身体の傷害・疾病に基因して支払われるものとして非課税とされる。"],
["個人事業主が商品(棚卸資産)の損害について受け取った保険金は、非課税である。",0,"誤り。棚卸資産の損害に対する保険金は、事業所得の総収入金額に算入される。"],
["火災で店舗が休業したことによる収益の減少を補償する保険金を個人事業主が受け取った場合、事業所得の総収入金額に算入される。",1,"正しい。"],
["個人事業主の店舗建物が全焼して受け取った保険金は非課税であり、その保険金で店舗を建て直しても、保険金が帳簿価額を超える部分に課税されることはない。",1,"正しい。個人の資産の損害に基因する保険金は非課税である(資産損失の計算では損失額から差し引く)。"],
["個人事業主が事業用車両の損傷について受け取った車両保険金は、事業所得の総収入金額に算入される。",0,"誤り。事業用固定資産の損害に基因する保険金は非課税であり、資産損失の計算上、損失額から差し引く。"],
["医療費を補てんする保険金を受け取った場合、医療費控除の計算上、その金額を支払った医療費から差し引く。",1,"正しい。"],
["個人が受け取った家財の火災保険金は、一時所得として課税される。",0,"誤り。資産の損害に基因する保険金は非課税である。"]
]},
{p:2,t:"死亡保険金の課税関係",s:[
["保険料負担者と被保険者が同一で、保険金受取人が相続人である場合の死亡保険金は、相続税の課税対象となる。",1,"正しい。"],
["保険料負担者と保険金受取人が同一で、被保険者が別の者である場合の死亡保険金は、受取人の所得税(一時所得)の課税対象となる。",1,"正しい。"],
["保険料負担者、被保険者、保険金受取人がすべて異なる場合の死亡保険金は、受取人の贈与税の課税対象となる。",1,"正しい。"],
["保険料負担者と保険金受取人が同一である場合の死亡保険金は、相続税の課税対象となる。",0,"誤り。受取人自身が保険料を負担しているため、所得税(一時所得)の課税対象となる。"],
["相続人が受け取った死亡保険金には、「500万円×法定相続人の数」の非課税限度額が適用される。",1,"正しい。"],
["妻が自ら契約者(保険料負担者)となり、自分と夫を被保険者とした国内旅行傷害保険で、夫の死亡により妻が受け取った死亡保険金は、妻の所得税(一時所得)の課税対象となる。",1,"正しい。保険料負担者と受取人が同じため一時所得となる。"],
["契約者(保険料負担者)である被保険者が自動車事故で死亡し、人身傷害保険の死亡保険金が相続人に支払われた場合、被保険者自身の過失に相当する部分は、みなし相続財産として相続税の課税対象となる。",1,"正しい。相手方の過失に相当する部分は損害賠償金として非課税とされる。"],
["法人契約の自動車保険の人身傷害保険から、けがをした従業員が受け取った医療保険金は、非課税である。",1,"正しい。"],
["相続放棄をした者が受け取った死亡保険金にも、死亡保険金の非課税限度額が適用される。",0,"誤り。相続放棄をした者は相続人ではないため非課税の適用はない(遺贈により取得したものとみなされ相続税の対象となる)。"]
]},
{p:2,t:"保険金の税務(法人)",s:[
["法人が受け取った火災保険金は、益金に算入される。",1,"正しい。"],
["法人が受け取った保険金は、損害のてん補であるため益金に算入されない。",0,"誤り。法人が受け取った保険金は益金に算入される。"],
["法人が火災保険金で代替資産を取得した場合、圧縮記帳により保険差益に対する課税を繰り延べることができる。",1,"正しい。"],
["圧縮記帳は、保険差益に対する課税を免除し、永久に非課税とする制度である。",0,"誤り。圧縮記帳は課税の繰延べであり、将来の減価償却費の減少等を通じて課税される。"],
["法人が棚卸資産の損害について受け取った保険金は、益金に算入される。",1,"正しい。棚卸資産は圧縮記帳の対象とならない。"],
["法人が受け取った休業損失に対する保険金は、益金に算入される。",1,"正しい。"]
]},
{p:2,t:"圧縮記帳",s:[
["法人が火災保険金で代替資産を取得した場合、一定の要件のもとで圧縮記帳を行い、保険差益に対する課税を繰り延べることができる。",1,"正しい。"],
["保険差益の圧縮記帳は、法人だけでなく、個人事業主が保険金で店舗を建て直した場合にも認められる。",0,"誤り。個人の資産の損害に対する保険金は非課税であるため、個人には保険差益の圧縮記帳の制度はない。"],
["圧縮記帳の対象となるのは、固定資産の滅失等の日から3年以内に支払いが確定した保険金で、滅失等した資産と同一種類の代替資産を取得した場合などである。",1,"正しい。"],
["休業損失に対して法人が受け取った保険金も、所定の要件を満たせば圧縮記帳の対象となる。",0,"誤り。圧縮記帳の対象は固定資産の滅失・損壊に対する保険金であり、休業損失や棚卸資産に対する保険金は対象外である。"],
["圧縮記帳は、保険差益に対する課税を免除し、永久に非課税とする制度である。",0,"誤り。圧縮記帳は課税の繰延べであり、将来の減価償却費の減少などを通じて課税される。"],
["法人が棚卸資産の損害に対して受け取った保険金は益金に算入され、圧縮記帳の対象とならない。",1,"正しい。"]
]},
{p:2,t:"満期返戻金・年金給付金",s:[
["積立型保険の満期返戻金を保険料負担者が受け取った場合、一時所得として所得税の課税対象となる。",1,"正しい。"],
["満期返戻金を保険料負担者以外の者が受け取った場合、贈与税の課税対象となる。",1,"正しい。"],
["保険料負担者が受け取った満期返戻金は、非課税である。",0,"誤り。一時所得として課税される。"],
["保険料負担者が受け取った満期返戻金の一時所得の計算では、総収入金額から払込保険料の総額を差し引くことができる。",1,"正しい。"],
["保険期間が5年以下(または5年以内に解約)の一時払積立保険の差益は、金融類似商品として20.315%の源泉分離課税となる。",1,"正しい。"],
["年金払積立傷害保険の年金を保険料負担者が受け取った場合、公的年金等に係る雑所得となる。",0,"誤り。公的年金等以外の雑所得となる。"]
]},
{p:2,t:"損害賠償金の税務",s:[
["個人が受け取った心身の損害に対する損害賠償金(慰謝料など)は、非課税である。",1,"正しい。"],
["個人が受け取った慰謝料は、一時所得として所得税の課税対象となる。",0,"誤り。心身の損害に基因する慰謝料は非課税である。"],
["個人が受け取った自動車の修理費など、資産の損害に対する損害賠償金は非課税である。",1,"正しい。"],
["個人事業主が物損事故で事業用建物に損害を受け、相手方から受け取った損害賠償金のうち、休業による収益の補償に当たる部分は、事業所得の総収入金額に算入される。",1,"正しい。"],
["個人事業主が業務中の人身事故でけがをし、相手方から休業損害を含む損害賠償金を受け取った場合、その全額が事業所得の収入金額となる。",0,"誤り。身体の損害に基因する損害賠償金は、休業による収益の補償を含めて非課税である。"],
["個人が第三者に支払った損害賠償金は、雑損控除の対象とならない。",1,"正しい。"],
["従業員が業務中の事故で第三者に損害を与え法人が賠償金を支払った場合、従業員に故意または重大な過失がなければ、法人はその賠償金を損金として処理できる。",1,"正しい。"],
["法人が業務の遂行に関連して他人に与えた損害について支払った損害賠償金は、原則として損金に算入される。",1,"正しい。"],
["役員・従業員の故意または重過失による損害賠償金を法人が負担した場合でも、法人はその全額を損金に算入でき、役員・従業員に課税されることはない。",0,"誤り。故意・重過失によるものは、原則としてその役員・従業員に対する債権(求償できない場合は給与等)として扱われる。"]
]},
{p:2,t:"医療費控除",s:[
["納税者が自己または生計を一にする配偶者その他の親族のために医療費を支払った場合、一定額を超える部分について医療費控除を受けられる。",1,"正しい。"],
["医療費控除の対象となるのは、その年中に実際に支払った医療費であり、未払いのものは対象とならない。",1,"正しい。"],
["疾病の予防や健康増進のための医薬品の購入費用も、医療費控除の対象となる。",0,"誤り。治療・療養に必要な医薬品の購入費用が対象で、予防や健康増進のためのものは対象とならない。"],
["医療費控除の計算上、入院給付金や医療費を補てんする損害保険金は、その給付の目的となった医療費から差し引く。",1,"正しい。"],
["医療費を補てんする保険金がその給付の目的となった医療費を超える場合、超える部分は他の医療費からも差し引かなければならない。",0,"誤り。補てん額は給付の目的となった医療費を限度に差し引き、他の医療費からは差し引かない。"],
["セルフメディケーション税制(医療費控除の特例)は、通常の医療費控除と選択して適用する。",1,"正しい。"]
]},
{p:2,t:"災害等に関する税務",s:[
["災害により住宅や家財に損害を受けた場合、所得税の軽減について、雑損控除と災害減免法による軽減のいずれか有利な方を選択できる。",1,"正しい。"],
["災害減免法による所得税の軽減は、その年の合計所得金額が1,000万円以下で、住宅または家財の損害額がその時価の2分の1以上である場合に適用できる。",1,"正しい。"],
["雑損控除は、災害・盗難・横領による損失のほか、詐欺や恐喝による損失も対象となる。",0,"誤り。詐欺や恐喝による損失は雑損控除の対象とならない。"],
["雑損控除の額のうち、その年の所得から控除しきれない金額は、翌年以後3年間(特定非常災害の場合は5年間)繰り越すことができる。",1,"正しい。"],
["生活に通常必要でない資産(別荘や1個30万円を超える貴金属など)の損失も、雑損控除の対象となる。",0,"誤り。生活に通常必要でない資産は雑損控除の対象外である。"],
["雑損控除の対象となる災害には、震災・風水害などの自然災害のほか、火災や火薬類の爆発など人為による異常な災害、害虫などの生物による異常な災害も含まれる。",1,"正しい。"],
["納税者本人だけでなく、生計を一にする配偶者その他の親族(所得が一定以下の者)が所有する生活用資産の損失も、雑損控除の対象となる。",1,"正しい。"],
["被災者生活再建支援金は、所得税の課税対象(一時所得)となる。",0,"誤り。被災者生活再建支援金は非課税である。"],
["社会通念上相当と認められる災害見舞金は、非課税である。",1,"正しい。"]
]},
{p:"c",calc:"ichiji"},
{p:"c",calc:"zasson"},
{p:"c",calc:"jishin"},

// ===== 第3編 社会保険制度 =====
{p:3,t:"医療保険制度の概要",s:[
["日本は国民皆保険制度をとっており、会社員等は健康保険、自営業者等は国民健康保険、原則75歳以上の者は後期高齢者医療制度に加入する。",1,"正しい。"],
["医療費の自己負担割合は、原則として、義務教育就学後から70歳未満の者は3割である。",1,"正しい。義務教育就学前は2割。"],
["70歳以上75歳未満の者の自己負担割合は、原則2割(現役並み所得者は3割)である。",1,"正しい。"],
["後期高齢者医療制度の自己負担割合は、原則1割(一定以上所得のある者は2割、現役並み所得者は3割)である。",1,"正しい。"],
["業務上の事由による病気やけがは、健康保険から療養の給付を受ける。",0,"誤り。業務上の傷病は労災保険の対象であり、健康保険の給付対象とならない。"],
["後期高齢者医療制度の運営主体は、国である。",0,"誤り。都道府県ごとに全市町村が加入する後期高齢者医療広域連合が運営する。"]
]},
{p:3,t:"健康保険の給付",s:[
["高額療養費制度は、1か月の医療費の自己負担額が所得区分に応じた上限額を超えた場合に、その超えた額が支給される制度である。",1,"正しい。"],
["傷病手当金は、業務外の病気・けがで仕事を連続して3日間休んだ後、4日目以降の休業日について支給される。",1,"正しい。"],
["傷病手当金の額は、原則として1日につき標準報酬日額の3分の2相当額である。",1,"正しい。"],
["傷病手当金の支給期間は、支給開始日から通算して1年6か月である。",1,"正しい。"],
["傷病手当金の支給期間は、支給開始日から通算して3年である。",0,"誤り。通算して1年6か月である。"],
["出産育児一時金は、原則として1児につき50万円である。",1,"正しい(産科医療補償制度に加入する医療機関等での出産の場合)。"],
["健康保険の被扶養者の範囲には、直系尊属・配偶者・子・孫・兄弟姉妹のほか、被保険者と同一世帯に属する3親等内の親族も含まれる。",1,"正しい(主として被保険者の収入で生計を維持していることが要件)。"],
["被扶養者が保険医療機関で療養を受けた場合、家族療養費として支給されるのは、原則として療養費用の7割(義務教育就学前は8割)である。",1,"正しい。"],
["健康保険の給付は、所得税の課税対象とならない(非課税)。",1,"正しい。"],
["健康保険の高額療養費の自己負担限度額は、被保険者の年齢や所得によって異なる。",1,"正しい。"],
["健康保険の高額療養費の自己負担限度額は、被保険者の所得によって異なるが、年齢によって異なることはない。",0,"誤り。70歳未満と70歳以上で区分や限度額が異なる。"],
["退職後、健康保険の被保険者期間が継続して2か月以上ある者は、退職日の翌日から20日以内に申し出ることで、最長2年間任意継続被保険者となることができる。",1,"正しい。"],
["国民健康保険では、原則として傷病手当金が法定給付として支給される。",0,"誤り。国民健康保険の傷病手当金は任意給付であり、多くの市町村で実施されていない。"]
]},
{p:3,t:"国民健康保険と後期高齢者医療制度",s:[
["国民健康保険は、自営業者や農業従事者、年金生活者などを対象に、疾病・負傷・出産・死亡に関して保険給付を行う制度である。",1,"正しい。"],
["国民健康保険の保険者は国(政府)である。",0,"誤り。都道府県と市町村(特別区を含む)が共同で運営するほか、国民健康保険組合も保険者となる。"],
["国民健康保険では、労災保険の適用を受ける場合を除き、業務上の傷病も給付の対象となる。",1,"正しい。"],
["国民健康保険にも健康保険と同様の被扶養者の制度があり、被扶養者は保険料を負担しない。",0,"誤り。国民健康保険に被扶養者の制度はなく、加入者ごとに保険料(税)が計算され、世帯主が納付する。"],
["後期高齢者医療制度の被保険者は、75歳以上の者と、65歳以上75歳未満で一定の障害の状態にあると認定を受けた者である。",1,"正しい。"],
["後期高齢者医療制度の保険料は、被保険者一人ひとりに課される。",1,"正しい。"]
]},
{p:3,t:"介護保険制度",s:[
["介護保険の第1号被保険者は65歳以上の者、第2号被保険者は40歳以上65歳未満の医療保険加入者である。",1,"正しい。"],
["第2号被保険者は、特定疾病が原因で要介護・要支援状態となった場合に限り、保険給付を受けられる。",1,"正しい。"],
["第2号被保険者は、原因を問わず要介護状態になれば保険給付を受けられる。",0,"誤り。第2号被保険者は特定疾病による場合に限られる。"],
["介護保険の保険者は、市町村(特別区を含む)である。",1,"正しい。"],
["介護保険サービスの利用者負担は、原則1割(一定以上所得者は2割または3割)である。",1,"正しい。"],
["要介護認定の区分は、要支援1・2と要介護1〜5である。",1,"正しい。"],
["居宅介護サービス計画(ケアプラン)の作成費用は全額が保険給付され、利用者の自己負担はない。",1,"正しい。"],
["介護保険では、要介護者に対する介護給付のほか、要支援者に対する予防給付が行われる。",1,"正しい。"],
["介護保険の施設サービスを利用した場合の食費と居住費は、原則として保険給付の対象外で自己負担となる。",1,"正しい。"],
["介護保険の保険者は、国である。",0,"誤り。保険者は市町村(特別区を含む)である。"]
]},
{p:3,t:"国民年金",s:[
["国民年金の被保険者は、第1号(自営業者等)、第2号(会社員・公務員等)、第3号(第2号被保険者の被扶養配偶者)に区分される。",1,"正しい。"],
["老齢基礎年金は、受給資格期間が10年以上ある場合に、原則として65歳から支給される。",1,"正しい。"],
["老齢基礎年金の繰下げ受給は最大75歳まで可能で、繰り下げた1か月につき0.7%増額される。",1,"正しい(1952年4月2日以後生まれの者)。"],
["老齢基礎年金を繰上げ受給した場合、繰り上げた1か月につき0.4%減額される。",1,"正しい(1962年4月2日以後生まれの者)。"],
["第3号被保険者は、国民年金の保険料を自ら納付しなければならない。",0,"誤り。第3号被保険者は、保険料を自ら納付する必要はない。"],
["遺族基礎年金は、死亡した者によって生計を維持されていた「子のある配偶者」または「子」に支給される。",1,"正しい。"],
["国民年金は政府が管掌しており、市町村が管掌することはない。",1,"正しい(事務の一部は市町村が行う)。"],
["障害基礎年金の年金額は、被保険者期間の長さにかかわらず、障害等級(1級・2級)に応じて定額である。",1,"正しい(1級は2級の1.25倍)。"],
["第1号被保険者で付加保険料を納付した者には、老齢基礎年金に上乗せして付加年金が支給される。",1,"正しい。"],
["年金は、支給すべき事由が生じた日の属する月の翌月から支給が始まり、権利が消滅した日の属する月で終わる。",1,"正しい。"],
["障害基礎年金では、受給権者に生計を維持されている配偶者がいる場合、配偶者の加算額が支給される。",0,"誤り。障害基礎年金の加算は子についてのみ。配偶者の加給年金額は障害厚生年金(1・2級)にある。"],
["障害基礎年金は、障害等級1級から3級に該当する場合に支給される。",0,"誤り。障害基礎年金は1級・2級のみ。3級は障害厚生年金にある。"]
]},
{p:3,t:"厚生年金保険",s:[
["厚生年金保険の保険料は、標準報酬月額と標準賞与額に保険料率を乗じた額を、事業主と被保険者が折半して負担する。",1,"正しい。保険料率は18.3%。"],
["厚生年金保険の保険料は、全額を事業主が負担する。",0,"誤り。事業主と被保険者が折半して負担する。"],
["障害厚生年金には、障害等級1級・2級のほか3級があり、さらに一時金としての障害手当金がある。",1,"正しい。"],
["遺族厚生年金の額は、原則として、死亡した者の老齢厚生年金の報酬比例部分の4分の3相当額である。",1,"正しい。"],
["在職老齢年金制度により、老齢厚生年金の受給者が働いて一定以上の収入を得ると、年金の一部または全部が支給停止される。",1,"正しい。"],
["老齢厚生年金は、厚生年金保険の被保険者期間が1か月以上あり、老齢基礎年金の受給資格期間(10年)を満たした者に、原則として65歳から支給される。",1,"正しい。"],
["老齢厚生年金は、老齢基礎年金の受給資格期間を満たしていなくても、厚生年金保険の被保険者期間が1か月以上あれば支給される。",0,"誤り。老齢基礎年金の受給資格期間(10年)を満たす必要がある。"],
["老齢厚生年金は雑所得として課税されるが、障害厚生年金と遺族厚生年金は非課税である。",1,"正しい。"],
["障害厚生年金や遺族厚生年金の受給者が、事故の加害者である第三者から損害賠償を受けた場合、一定期間年金の支給が停止されるなどの調整が行われることがある。",1,"正しい。"]
]},
{p:3,t:"企業年金と個人年金",s:[
["確定給付企業年金のうち規約型は、労使が合意した年金規約に基づき、企業が外部の資産管理運用機関と契約して年金資産を管理・運用する。",1,"正しい。"],
["確定給付企業年金のうち基金型は、企業とは別の法人格を持つ企業年金基金を設立して年金資産を管理・運用する。",1,"正しい。"],
["確定給付企業年金は、加入者自らが運用の指図を行い、運用結果によって給付額が変動する制度である。",0,"誤り。記述は確定拠出年金の説明である。確定給付企業年金は給付額があらかじめ約束されている。"],
["確定拠出年金の老齢給付金は年金としての受取りに限られ、一時金として受け取ることはできない。",0,"誤り。規約の定めにより、一時金として受け取ることもできる。"],
["企業型確定拠出年金では、規約の定めにより、従業員が企業の掛金に上乗せして掛金を拠出できる(マッチング拠出)。",1,"正しい。従業員の掛金は企業の掛金を超えず、合計が拠出限度額の範囲内である必要がある。"],
["個人型確定拠出年金(iDeCo)の掛金は、小規模企業共済等掛金控除として全額が所得控除の対象となる。",1,"正しい。"],
["保険型の個人年金のうち確定年金は、被保険者が生存している場合に限り、一定期間年金が支払われる。",0,"誤り。確定年金は、年金支払期間中は生死にかかわらず年金が支払われる。生存している場合に限り一定期間支払われるのは有期年金である。"],
["国民年金基金は、国民年金の第1号被保険者が老齢基礎年金に上乗せする年金を受け取るための制度である。",1,"正しい。"],
["2014年4月以降、厚生年金基金の新規設立は認められていない。",1,"正しい。"]
]},
{p:3,t:"労災保険",s:[
["労災保険は、原則として労働者を1人でも使用する事業に適用され、保険料は全額を事業主が負担する。",1,"正しい。"],
["労災保険の保険料は、労働者と事業主が折半して負担する。",0,"誤り。労災保険料は全額事業主負担である。"],
["労災保険は、業務災害だけでなく通勤災害も給付の対象としている。",1,"正しい。"],
["業務災害の療養(補償)給付では、労働者の自己負担はない。",1,"正しい。"],
["休業(補償)給付は、休業4日目から、1日につき給付基礎日額の60%が支給される(別途、休業特別支給金20%)。",1,"正しい。"],
["業務災害による傷病が療養開始後1年6か月を経過しても治らず、傷病等級(第1級〜第3級)に該当する場合は、休業補償給付に代えて傷病補償年金が支給される。",1,"正しい。"],
["傷病補償年金は、傷病等級の第1級または第2級に該当する場合に限り支給される。",0,"誤り。第1級〜第3級に該当する場合に支給される。"],
["労災保険の障害補償給付には、障害等級に応じて障害補償年金と障害補償一時金がある。",1,"正しい。"],
["労災保険は、常用・日雇・アルバイト・パートタイマーなどの雇用形態にかかわらず、適用事業に使用され賃金を支払われる労働者に適用される。",1,"正しい。"],
["国の直営事業や官公署の事業も含めて、労働者を1人でも使用する事業はすべて労災保険の適用事業となる。",0,"誤り。国の直営事業や官公署の事業(一部を除く)は労災保険の適用除外である。"],
["業務災害による休業の最初の3日間は、労災保険から休業補償給付が支給される。",0,"誤り。最初の3日間(待期期間)は労災保険から支給されず、業務災害の場合は事業主が労働基準法に基づき休業補償を行う。"],
["中小事業主や一人親方などは、特別加入制度により労災保険に加入することができる。",1,"正しい。"]
]},
{p:3,t:"雇用保険",s:[
["雇用保険の基本手当を受給するには、原則として離職の日以前2年間に被保険者期間が通算12か月以上必要である。",1,"正しい。"],
["倒産・解雇などにより離職した特定受給資格者は、離職の日以前1年間に被保険者期間が通算6か月以上あれば基本手当を受給できる。",1,"正しい。"],
["倒産により離職した者は、離職の日以前2年間に被保険者期間が通算12か月以上ある場合に限り、基本手当を受給できる。",0,"誤り。倒産・解雇などによる離職者は、離職の日以前1年間に被保険者期間が通算6か月以上あれば受給できる。"],
["高年齢雇用継続基本給付金は、雇用保険の被保険者であった期間が5年以上ある者が対象となる。",1,"正しい。"],
["高年齢雇用継続給付は、雇用保険の被保険者であった期間が10年以上なければ支給されない。",0,"誤り。5年以上で対象となる。"],
["雇用保険料のうち、失業等給付と育児休業給付に係る部分は事業主と被保険者が折半し、雇用保険二事業に係る部分は事業主が全額を負担する。",1,"正しい。"],
["2025年4月以降の自己都合退職による離職者の基本手当の給付制限期間は、原則として1か月である。",1,"正しい。"],
["雇用保険の保険料は、全額を事業主が負担する。",0,"誤り。雇用保険料は事業主と労働者がそれぞれ負担する(事業主の負担割合の方が大きい)。"],
["育児休業給付金は、休業開始から180日目までは、休業開始時賃金日額の67%相当額が支給される。",1,"正しい。"],
["雇用保険の基本手当は、所得税の課税対象となる。",0,"誤り。雇用保険の給付は非課税である。"],
["高年齢雇用継続基本給付金は、60歳以上65歳未満の被保険者の賃金が、60歳到達時の75%未満に低下した場合に支給される。",1,"正しい。"]
]},

// ===== 第4編 隣接業界 =====
{p:4,t:"生命保険",s:[
["生命保険は、保険金が支払われる条件によって、死亡保険、生存保険、生死混合保険に分類される。",1,"正しい。"],
["定期保険は、保険期間中に死亡した場合に死亡保険金が支払われる保険で、満期保険金はない。",1,"正しい。"],
["生命保険会社が取り扱う就業不能保険は、病気やけがで長期間働けなくなった場合に給付金が支払われる保険である。",1,"正しい。"],
["養老保険は、保険期間中に死亡した場合は死亡保険金が、満期まで生存した場合は死亡保険金と同額の満期保険金が支払われる。",1,"正しい。"],
["終身保険は保障が一生涯続くため、解約返戻金は一切ない。",0,"誤り。終身保険には解約返戻金があり、貯蓄性のある保険である。"],
["生命保険の保険料は、予定死亡率、予定利率、予定事業費率の3つの予定基礎率をもとに計算される。",1,"正しい。"],
["予定利率を高く設定すると、保険料は高くなる。",0,"誤り。予定利率が高いほど割引が大きくなり、保険料は安くなる。"]
]},
{p:4,t:"生命保険の契約と保護制度",s:[
["保険料の払込猶予期間を過ぎても払込みがない場合に、解約返戻金の範囲内で保険料を自動的に立て替える制度を自動振替貸付という。",1,"正しい。"],
["払済保険とは、以後の保険料の払込みを中止し、その時点の解約返戻金をもとに、保険期間を変えずに保険金額の少ない保険に変更する制度である。",1,"正しい。"],
["延長保険とは、保険料の払込みを中止し、その時点の解約返戻金をもとに、保険金額を変えずに定期保険に変更する制度である。",1,"正しい。"],
["契約者貸付では、解約返戻金を超える金額まで借り入れることができる。",0,"誤り。契約者貸付は、解約返戻金の一定範囲内で利用できる。"],
["生命保険会社が破綻した場合、生命保険契約者保護機構により、原則として破綻時点の責任準備金等の90%までが補償される。",1,"正しい(高予定利率契約を除く)。"],
["生命保険会社が破綻した場合、救済保険会社への契約の移転のほか、救済保険会社が現れないときは生命保険契約者保護機構自らが保険契約を引き受けることがある。",1,"正しい。"],
["生命保険契約者保護機構の保護を受けた契約は、必ず当初の契約どおりの保険金額が維持される。",0,"誤り。責任準備金の削減や予定利率の引下げなどにより、保険金額が減額されることがある。"],
["生命保険会社が破綻した場合、生命保険契約者保護機構により、保険金額の全額が必ず補償される。",0,"誤り。原則として責任準備金等の90%までの補償であり、保険金額が削減されることがある。"]
]},
{p:4,t:"少額短期保険",s:[
["少額短期保険業者が引き受けられる保険の保険期間は、損害保険が2年以内、生命保険・医療保険が1年以内である。",1,"正しい。"],
["少額短期保険業は、保険会社と同様に内閣総理大臣の免許を受けなければ営むことができない。",0,"誤り。少額短期保険業は登録制である。"],
["少額短期保険では、1被保険者あたりの保険金額に上限(原則として合計1,000万円)が定められている。",1,"正しい。"],
["少額短期保険業者は、保険期間満了後に満期返戻金を支払う積立型の保険を引き受けることはできない。",1,"正しい。"],
["少額短期保険の保険料は、生命保険料控除や地震保険料控除の対象とならない。",1,"正しい。"],
["少額短期保険業者が破綻した場合、損害保険契約者保護機構による補償の対象となる。",0,"誤り。少額短期保険業者は保険契約者保護機構に加入しておらず、補償の対象外である。"],
["少額短期保険業者は、保険期間が1年を超える生命保険を引き受けることができる。",0,"誤り。生命保険・医療保険の保険期間は1年以内である。"]
]},
{p:4,t:"共済",s:[
["共済は、農業協同組合法や消費生活協同組合法などの根拠法に基づき、組合員等を対象として事業が行われている。",1,"正しい。"],
["JA共済は農林水産省、CO-OP共済などの生協の共済は厚生労働省が所管している。",1,"正しい。"],
["根拠法のある共済(制度共済)には、保険業法が直接適用される。",0,"誤り。制度共済は、それぞれの根拠法に基づいて監督される。"],
["保険法は、保険契約と同等の内容を有する共済契約にも適用される。",1,"正しい。"],
["同一の共済団体が、生命分野と損害分野の両方の共済を取り扱うことがある。",1,"正しい。"],
["共済団体は保険業法による規制を受けるため、同一の団体が生命分野と損害分野の共済を併せて取り扱うことはない。",0,"誤り。制度共済は根拠法に基づき運営され、同一団体が生命・損害の両分野を取り扱う例がある。"],
["火災共済には、共済期間1年の掛捨型のほか、満期時に満期共済金が支払われる長期の積立型のものもある。",1,"正しい。"],
["こくみん共済coop(全労済)は、消費生活協同組合法に基づいて設立された、共済事業を行う協同組合である。",1,"正しい。"],
["所定の要件を満たす共済の掛金は、生命保険料控除や地震保険料控除の対象となる。",1,"正しい。"],
["共済団体が破綻した場合、生命保険契約者保護機構または損害保険契約者保護機構による補償が受けられる。",0,"誤り。共済は保険契約者保護機構の対象外である。"]
]},
{p:4,t:"保険業法と保険会社の業務",s:[
["保険会社は、内閣総理大臣の免許を受けなければ保険業を営むことができない。",1,"正しい。"],
["保険業法では、同一の保険会社が生命保険業と損害保険業を兼営することは禁止されている。",1,"正しい(子会社を通じた相互参入は可能)。"],
["同一の保険会社が、生命保険と損害保険の両方を自ら引き受けることができる。",0,"誤り。生損保の兼営は禁止されている。"],
["傷害保険や医療保険などのいわゆる第三分野の保険は、生命保険会社・損害保険会社のいずれも取り扱うことができる。",1,"正しい。"],
["保険会社は、保険の引受けと資産の運用を固有業務として行う。",1,"正しい。"],
["損害保険会社が破綻した場合、自賠責保険や家計地震保険は、損害保険契約者保護機構により保険金等の全額が補償される。",1,"正しい。"]
]}
];

const SETS = 30;

function rngFrom(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function shuffle(r, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const num = v => Math.round(v).toLocaleString("ja-JP");
const yen = v => num(v) + "円";
const manY = v => yen(v * 10000);
const man = v => num(v) + "万円";

// numeric multiple choice
function mc(r, correct, cands, fmt, step, opt) {
  opt = opt || {};
  const eq = (a, b) => Math.abs(a - b) < 1e-6;
  const ok = c => c != null && isFinite(c) && (c > 0 || (c === 0 && opt.zero)) && (!opt.int || Math.abs(c - Math.round(c)) < 1e-9);
  const vals = [correct];
  for (const c of cands) { if (vals.length >= 4) break; if (ok(c) && !vals.some(v => eq(v, c))) vals.push(c); }
  let k = 1;
  while (vals.length < 4 && k < 60) {
    for (const c of [correct + step * k, correct - step * k]) if (vals.length < 4 && c > 0 && !vals.some(v => eq(v, c))) vals.push(c);
    k++;
  }
  const sh = shuffle(r, vals);
  return { choices: sh.map(fmt), ans: sh.findIndex(v => eq(v, correct)) };
}
// fractions
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const fr = (n, d) => { const g = gcd(n, d); return [n / g, d / g]; };
const fk = f => f[0] + "/" + f[1];
const ff = f => f[0] === f[1] ? "全部" : f[1] + "分の" + f[0];
function mcF(r, correct, cands) {
  const vals = [correct];
  for (const c of cands) { if (vals.length >= 4) break; if (c && c[0] > 0 && c[0] <= c[1] && !vals.some(v => fk(v) === fk(c))) vals.push(c); }
  let k = 2;
  while (vals.length < 4) { const c = fr(1, correct[1] * k); if (!vals.some(v => fk(v) === fk(c))) vals.push(c); k++; }
  const sh = shuffle(r, vals);
  return { choices: sh.map(ff), ans: sh.findIndex(v => fk(v) === fk(correct)) };
}

const COMBO = ["ア・イともに正しい。", "アは正しいが、イは誤っている。", "アは誤っているが、イは正しい。", "ア・イともに誤っている。"];
const KANA = ["ア", "イ", "ウ", "エ", "オ"];
const CALC_PART = "計算問題(参考)";
const partName = (U, p) => p === "c" ? CALC_PART : U.parts[p];
const ABCD = ["A", "B", "C", "D"];

function buildQuestion(item, r, unit) {
  if (item.calc) {
    const g = CALC[item.calc](r);
    return { kind: "calc", p: item.p, t: g.t, q: g.q, tables: g.tables || [], choices: g.choices, ans: g.ans, e: g.e, labels: ABCD };
  }
  const T = item.s.filter(x => x[1]), F = item.s.filter(x => !x[1]);
  const fm = ["combo", "combo"];
  if (T.length >= 1 && F.length >= 2) fm.push("right", "right");
  if (F.length >= 1 && T.length >= 2) fm.push("wrong", "wrong");
  const f = pick(r, fm);
  let st, ans;
  if (f === "combo") {
    st = shuffle(r, item.s).slice(0, 2);
    ans = st[0][1] ? (st[1][1] ? 0 : 1) : (st[1][1] ? 2 : 3);
  } else {
    const target = f === "right" ? T : F, others = f === "right" ? F : T;
    const sizes = [3, 3, 3, 4, 5].filter(n => others.length >= n - 1);
    const n = pick(r, sizes);
    st = shuffle(r, [pick(r, target), ...shuffle(r, others).slice(0, n - 1)]);
    ans = st.findIndex(x => (f === "right") === !!x[1]);
  }
  const U = unit ? UNITS[unit] : null;
  const topic = U && U.quote.includes(+item.p) ? `「${item.t}」` : item.t;
  const tail = "解答欄の該当する箇所を選んでください。";
  const prompt = f === "combo"
    ? `${topic}に関する次の記述の正誤の組合せとして、正しいものを下記の選択肢の中から選び、${tail}`
    : `${topic}に関する次の記述のうち、${f === "right" ? "正しいもの" : "誤っているもの"}を1つ選び、${tail}`;
  return {
    kind: "stmt", f, p: item.p, t: item.t, q: prompt,
    stmts: st.map(x => ({ t: x[0], ok: !!x[1], e: x[2] })),
    choices: f === "combo" ? COMBO : null, ans,
    labels: f === "combo" ? ABCD : KANA.slice(0, st.length)
  };
}

function seedFor(unit, n) { return (unit === "law" ? 104729 : 224737) + n * 7919 + 500009; }

function buildExam(unit, seed) {
  const U = UNITS[unit], r = rngFrom(seed), pool = U.pool(), qs = [];
  Object.keys(U.parts).forEach(p => {
    const items = pool.filter(x => x.p == p);
    shuffle(r, items).slice(0, U.alloc[p]).forEach(it => qs.push(buildQuestion(it, r, unit)));
  });
  return qs;
}

function qid(q) {

  let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);

const tkey = q => q.p + "|" + q.t;
function recordMany(u, list) {

function removeMark(u, id) { const d = sGet(), su = sUnit(d, u); su.marks = su.marks.filter(m => m.id !== id); sSet(d); }
function analysis(u) {
  const U = UNITS[u], su = sUnit(sGet(), u), pool = U.pool().filter(x => x.s);
  const topics = pool.map(it => { const st = su.stats[it.p + "|" + it.t] || { a: 0, c: 0 }; return { p: String(it.p), t: it.t, a: st.a, c: st.c, acc: (st.c + 1) / (st.a + 2), item: it }; });

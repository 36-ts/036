  return `<div class="overlay" data-act="close"><div class="sheetbox" role="dialog" aria-modal="true" aria-label="問題一覧">
    <div class="sb-head"><h2>問題一覧</h2><button class="btn sm" data-act="close">閉じる</button></div>
    <div class="grid">${ex.qs.map((q, i) => `<button class="cell${ex.a[i] !== null ? " done" : ""}${ex.fl[i] ? " fl" : ""}${i === ex.cur ? " cur" : ""}" data-act="jump" data-i="${i}" aria-label="問題${i + 1}${ex.a[i] !== null ? "、解答済み" : "、未解答"}${ex.fl[i] ? "、見直し" : ""}">${i + 1}</button>`).join("")}</div>
    <p class="legend"><span class="lg done"></span>解答済み <span class="lg fl"></span>見直し　未解答 ${un}問</p>
    <div class="row">
      <button class="btn primary" data-act="sheet" data-s="confirm">解答を終了</button>
      <button class="btn ghost" data-act="quit">${ex.quitArm ? "もう一度押すと中断します(記録されません)" : "中断してホームへ"}</button>
    </div>
  </div></div>`;
}
function confirmSheet() {
  const ex = S.ex, un = ex.a.filter(x => x === null).length, fl = ex.fl.filter(Boolean).length;
  return `<div class="overlay" data-act="close"><div class="sheetbox" role="dialog" aria-modal="true" aria-label="解答の終了">
    <h2>解答を終了して採点しますか</h2>
    <p>${un ? `未解答が${un}問あります。` : "すべての問題に解答しています。"}${fl ? `見直しの印が${fl}問に付いています。` : ""}</p>
    <div class="row"><button class="btn" data-act="close">試験に戻る</button><button class="btn primary" data-act="finish">採点する</button></div>
  </div></div>`;
}
function finish(timeout) {
  const ex = S.ex; clearInterval(tick);
  const U = UNITS[ex.u];
  const res = ex.qs.map((q, i) => ex.a[i] === q.ans);
  const correct = res.filter(Boolean).length, score = correct * U.pts;
  const used = Math.min(Date.now(), ex.end) - ex.t0;
  const h = store.get(); h[ex.u] = h[ex.u] || {};
  const rec = h[ex.u][ex.set] || { best: 0, n: 0 };
  rec.best = Math.max(rec.best, score); rec.last = score; rec.n++; rec.at = Date.now();
  h[ex.u][ex.set] = rec; store.set(h);
  recordMany(ex.u, ex.qs.map((q, i) => ({ q, ok: res[i] })));
  S = { view: "result", rs: { u: ex.u, set: ex.set, qs: ex.qs, a: ex.a, res, correct, score, used, timeout: !!timeout, onlyWrong: false, nWrong: res.filter(x => !x).length } };
  render(true);
}

// ---------- 結果 ----------
function result() {
  const R = S.rs, U = UNITS[R.u], pass = R.score >= U.pass;
  const parts = Object.keys(U.parts).map(p => {
    const idx = R.qs.map((q, i) => i).filter(i => R.qs[i].p == p);
    return { p, c: idx.filter(i => R.res[i]).length, t: idx.length };
  });
  const items = R.qs.map((q, i) => ({ q, i })).filter(o => !R.onlyWrong || !R.res[o.i]);
  return `<div class="result u-${R.u}">
  <section class="score-card">
    <p class="rs-title">${U.name}　${setName(R.set)}の結果</p>
    <p class="score"><b>${R.score}</b><span>／${U.full}点</span></p>
    <p class="verdict ${pass ? "pass" : "fail"}">${pass ? "合格基準に到達しました" : `合格基準まであと${U.pass - R.score}点`}<span>合格基準 ${U.pass}点</span></p>
    <p class="meta">正答 ${R.correct}／${R.qs.length}問<br>所要時間 ${Math.max(1, Math.round(R.used / 60000))}分${R.timeout ? "(時間切れで自動採点)" : ""}</p>
    <div class="row">
      <button class="btn primary" data-act="start" data-unit="${R.u}" data-set="${R.set}">${R.set === "r" ? "新しい組み合わせで受験" : "この回をもう一度受験"}</button>
      <button class="btn" data-act="home">回の一覧へ戻る</button>
    </div>
    ${R.nWrong ? `<div class="note-box"><p>間違えた問題(未解答を含む)${R.nWrong}問を、復習リストに追加しました。</p><button class="btn sm" data-act="review" data-unit="${R.u}">今すぐ復習する</button></div>` : ""}
  </section>
  <section class="breakdown"><h2>分野別の正答数</h2>
    ${parts.map(x => `<div class="bd"><span class="bd-n">${esc(U.parts[x.p])}</span><span class="bd-bar" aria-hidden="true"><i style="width:${x.t ? x.c / x.t * 100 : 0}%"></i></span><span class="bd-v">${x.c}／${x.t}</span></div>`).join("")}
  </section>
  <section class="review">
    <div class="rv-head"><h2>問題と解説</h2><label class="tog"><input type="checkbox" id="onlywrong"${R.onlyWrong ? " checked" : ""}> 間違えた問題だけ表示</label></div>
    ${items.map(({ q, i }) => `<details class="rv ${R.res[i] ? "ok" : "ng"}" data-k="r${i}"><summary><span class="mk" aria-label="${R.res[i] ? "正解" : "不正解"}">${R.res[i] ? "◯" : "✕"}</span><span class="rv-no">問題${i + 1}</span><span class="rv-t">${esc(q.t)}</span><span class="rv-a">あなたの解答 ${R.a[i] == null ? "未解答" : q.labels[R.a[i]]}　正解 ${q.labels[q.ans]}</span></summary><div class="rv-body"><div class="rv-tools">${star(isMarked(R.u, q), "rs", i)}</div>${qBody(q, R.a[i], { reveal: true, lock: true, id: "r" + i })}</div></details>`).join("")}
    ${items.length ? "" : `<p class="small">間違えた問題はありません。</p>`}
  </section>
</div>`;
}

// ---------- 分野別ドリル ----------
function startDrill(u, mode) {
  mode = mode || "drill";
  S = { view: "drill", dr: { u, mode, parts: Object.keys(UNITS[u].parts), q: null, sel: null, done: false, c: 0, n: 0, last: null, queue: [], lastId: null, cleared: 0 } };
  nextDrill(); render(true);
}
function wpick(items, ws) {
  const tot = ws.reduce((a, b) => a + b, 0); let x = Math.random() * tot;
  for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; }
  return items[items.length - 1];
}
function nextDrill() {
  const d = S.dr, U = UNITS[d.u];
  d.sel = null; d.done = false;
  const seed = () => rngFrom(Math.floor(Math.random() * 2147483647));
  if (d.mode === "review" || d.mode === "marks") {
    const su = sUnit(sGet(), d.u), list = d.mode === "review" ? su.wrong : su.marks;
    if (!list.length) { d.q = null; return; }
    d.queue = d.queue.filter(id => list.some(x => x.id === id));
    if (!d.queue.length) d.queue = shuffle(seed(), list.map(x => x.id));
    let id = d.queue.shift();
    if (id === d.lastId && d.queue.length) { d.queue.push(id); id = d.queue.shift(); }
    d.lastId = id; d.q = list.find(x => x.id === id).q;
    return;
  }
  let it;
  if (d.mode === "focus") {
    const an = analysis(d.u), cands = an.topics.filter(x => x.item !== d.last);
    it = wpick(cands, cands.map(x => Math.max(0.02, Math.pow(1 - x.acc, 2)))).item;
  } else {
    const pool = U.pool().filter(x => d.parts.includes(String(x.p)));
    if (!pool.length) { d.q = null; return; }
    let guard = 0;
    do { it = pool[Math.floor(Math.random() * pool.length)]; guard++; } while (pool.length > 1 && it === d.last && guard < 10);
  }
  d.last = it; d.q = buildQuestion(it, seed(), d.u);
}
const DRILL_TITLE = { drill: "分野別ドリル", focus: "苦手分野の重点練習", review: "間違えた問題の復習", marks: "ブックマークの問題" };
function topBar(u, act) {
  return `<div class="dr-top">
    <button class="btn sm" data-act="home">ホームへ</button>
    <div class="seg" role="group" aria-label="単位">${["law", "tax"].map(x => `<button class="segbtn" data-act="${act}" data-unit="${x}" aria-pressed="${x === u}">${UNITS[x].name}</button>`).join("")}</div>
  </div>`;
}
function drill() {
  const d = S.dr, U = UNITS[d.u], su = sUnit(sGet(), d.u);
  let sub = "";
  if (d.mode === "review") sub = `残り${su.wrong.length}問${d.cleared ? `　今回克服した問題 ${d.cleared}問` : ""}`;
  if (d.mode === "marks") sub = `ブックマーク ${su.marks.length}問`;
  if (d.mode === "focus") sub = "正答率の低いテーマほど多く出題します";
  const empty = d.mode === "review" ? "復習する問題はありません。模擬試験やドリルで間違えた問題が、ここに自動で入ります。"
    : d.mode === "marks" ? "ブックマークした問題はありません。問題の右上にある「☆ ブックマーク」を押すと追加できます。"
    : "出題する分野を1つ以上選んでください。";
  const ok = d.done && d.sel === d.q.ans;
  const extra = d.mode === "review" && d.done ? (ok ? "　復習リストから外しました" : "　復習リストに残します") : "";
  return `<div class="drill u-${d.u}">
  ${topBar(d.u, "dunit")}
  <div class="dr-head"><h1 class="dr-title">${DRILL_TITLE[d.mode]}</h1><span class="tally">正答 ${d.c}／${d.n}問</span></div>
  ${sub ? `<p class="small dr-sub">${esc(sub)}</p>` : ""}
  ${d.mode === "drill" ? `<div class="chips" role="group" aria-label="出題する分野">${[...Object.keys(U.parts), "c"].map(p => `<button class="chipbtn${p === "c" ? " calc" : ""}" data-act="dpart" data-p="${p}" aria-pressed="${d.parts.includes(p)}">${esc(partName(U, p))}</button>`).join("")}</div>` : ""}
  ${d.q ? `<article class="card">
    <div class="qhead"><span class="qno">${d.mode === "review" ? "復習" : "練習"}</span><span class="qpart">${esc(partName(U, d.q.p))}</span>${star(isMarked(d.u, d.q), "drill")}</div>
    ${qBody(d.q, d.sel, { reveal: d.done, lock: d.done, act: "dpick", id: "d" })}
    ${d.done ? `<div class="dr-res ${ok ? "pass" : "fail"}"><b>${ok ? "◯ 正解" : `✕ 不正解　正解は${d.q.labels[d.q.ans]}`}<span class="small">${extra}</span></b><button class="btn primary" data-act="dnext">次の問題</button></div>` : `<p class="small">解答欄を選ぶと、すぐに正誤と解説が表示されます。</p>`}
  </article>` : `<p class="card">${empty}</p>${d.mode === "review" && d.cleared ? `<div class="row"><button class="btn" data-act="weak" data-unit="${d.u}">苦手分析を見る</button></div>` : ""}`}
</div>`;
}

// ---------- ブックマーク一覧 ----------
function marks() {
  const u = S.mk.u, U = UNITS[u], list = sUnit(sGet(), u).marks.slice().reverse();
  return `<div class="drill u-${u}">
  ${topBar(u, "vunit")}
  <div class="dr-head"><h1 class="dr-title">ブックマーク</h1><span class="tally">${list.length}問</span></div>
  ${list.length ? `<div class="row"><button class="btn primary" data-act="mpractice" data-unit="${u}">ブックマークした問題を解く</button></div>
  <div class="review">${list.map(m => `<details class="rv mark" data-k="m${m.id}"><summary><span class="mk" aria-hidden="true">★</span><span class="rv-no">${esc(shortPart(U, m.q.p))}</span><span class="rv-t">${esc(m.q.t)}</span><span class="rv-a">${fmtDate(m.at)}に保存</span></summary><div class="rv-body">${qBody(m.q, null, { reveal: true, lock: true, id: "m" + m.id })}<div class="row"><button class="btn sm" data-act="unmark" data-id="${m.id}">ブックマークを外す</button></div></div></details>`).join("")}</div>`
  : `<p class="card">ブックマークした問題はありません。模擬試験・ドリル・結果画面で、問題の右上にある「☆ ブックマーク」を押すと、ここに保存されます。</p>`}
</div>`;
}

// ---------- 苦手分析 ----------
function weak() {
  const u = S.wk.u, U = UNITS[u], an = analysis(u);
  const pct = x => Math.round(x * 100);
  const topics = an.topics.filter(x => x.a >= 2).sort((x, y) => x.acc - y.acc).slice(0, 8);
  return `<div class="drill u-${u}">
  ${topBar(u, "vunit")}
  <div class="dr-head"><h1 class="dr-title">苦手分野の分析</h1></div>
  ${an.a ? `<section class="score-card">
    <p class="rs-title">これまでの正答率(${U.name})</p>
    <p class="score"><b>${pct(an.avg)}</b><span>%</span></p>
    <p class="meta">解いた問題 ${an.a}問(模擬試験・ドリル・復習の合計)</p>
    <div class="row"><button class="btn primary" data-act="focus" data-unit="${u}">苦手分野を重点練習</button></div>
  </section>
  <section class="breakdown"><h2>分野別の正答率</h2>
    ${an.parts.map(x => `<div class="bd"><span class="bd-n">${esc(U.parts[x.p])}${an.weak.includes(x.p) ? `<span class="tag">苦手</span>` : ""}</span><span class="bd-bar" aria-hidden="true"><i style="width:${x.a ? x.c / x.a * 100 : 0}%"></i></span><span class="bd-v">${x.a ? pct(x.c / x.a) + "%" : "—"}<small>${x.a ? `${x.c}/${x.a}` : "未解答"}</small></span></div>`).join("")}
  </section>
  <section class="breakdown"><h2>特に苦手なテーマ</h2>
    ${topics.length ? topics.map(x => `<div class="bd"><span class="bd-n"><small class="pn">${esc(shortPart(U, x.p))}</small>${esc(x.t)}</span><span class="bd-bar" aria-hidden="true"><i style="width:${x.c / x.a * 100}%"></i></span><span class="bd-v">${pct(x.c / x.a)}%<small>${x.c}/${x.a}</small></span></div>`).join("") : `<p class="small">2回以上解いたテーマがまだありません。もう少し解くと表示されます。</p>`}
  </section>
  <p class="small">苦手の判定は、解いた数が少ないテーマほど控えめに評価しています。重点練習では、ここで正答率の低いテーマや、まだ解いていないテーマが多めに出ます。</p>
  <div class="row"><button class="btn ghost" data-act="wreset">${S.wk.arm ? "もう一度押すと分析の記録をリセットします" : "分析の記録をリセット"}</button></div>`
  : `<p class="card">まだデータがありません。模擬試験やドリルを解くと、ここに分野別の正答率と苦手なテーマが表示されます。</p>
  <div class="row"><button class="btn primary" data-act="focus" data-unit="${u}">重点練習を始める</button></div>`}
</div>`;
}

// ---------- 描画とイベント ----------
function render(top) {
  const open = top ? [] : [...document.querySelectorAll("details[data-k][open]")].map(x => x.dataset.k);
  $app.innerHTML = S.view === "exam" ? exam() : S.view === "result" ? result() : S.view === "drill" ? drill()
    : S.view === "marks" ? marks() : S.view === "weak" ? weak() : home();
  open.forEach(k => { const el = $app.querySelector(`details[data-k="${k}"]`); if (el) el.open = true; });
  if (top) window.scrollTo(0, 0);
}
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "close" && e.target !== b) return; // 背景クリックのみで閉じる
  const ex = S.ex;
  switch (act) {
    case "start": startExam(b.dataset.unit, b.dataset.set); break;
    case "drill": startDrill(b.dataset.unit, "drill"); break;
    case "review": startDrill(b.dataset.unit, "review"); break;
    case "focus": startDrill(b.dataset.unit, "focus"); break;
    case "mpractice": startDrill(b.dataset.unit, "marks"); break;
    case "marks": clearInterval(tick); S = { view: "marks", mk: { u: b.dataset.unit } }; render(true); break;
    case "weak": clearInterval(tick); S = { view: "weak", wk: { u: b.dataset.unit, arm: false } }; render(true); break;
    case "vunit": if (S.view === "marks") S.mk.u = b.dataset.unit; else { S.wk.u = b.dataset.unit; S.wk.arm = false; } render(); break;
    case "wreset": if (S.wk.arm) { const d = sGet(); sUnit(d, S.wk.u).stats = {}; sSet(d); S.wk.arm = false; } else S.wk.arm = true; render(); break;
    case "mark": {
      const src = b.dataset.src;
      const u = src === "exam" ? S.ex.u : src === "rs" ? S.rs.u : S.dr.u;
      const q = src === "exam" ? S.ex.qs[S.ex.cur] : src === "rs" ? S.rs.qs[+b.dataset.i] : S.dr.q;
      toggleMark(u, q); render(); break;
    }
    case "unmark": removeMark(S.mk.u, b.dataset.id); render(); break;
    case "home": clearInterval(tick); S = { view: "home" }; render(true); break;
    case "pick": ex.a[ex.cur] = +b.dataset.i; render(); break;
    case "prev": if (ex.cur > 0) { ex.cur--; render(true); } break;
    case "next": if (ex.cur < ex.qs.length - 1) { ex.cur++; render(true); } break;
    case "flag": ex.fl[ex.cur] = !ex.fl[ex.cur]; render(); break;
    case "sheet": ex.sheet = b.dataset.s; ex.quitArm = false; render(); break;
    case "close": ex.sheet = null; ex.quitArm = false; render(); break;
    case "jump": ex.cur = +b.dataset.i; ex.sheet = null; render(true); break;
    case "finish": finish(false); break;
    case "quit": if (ex.quitArm) { clearInterval(tick); S = { view: "home" }; render(true); } else { ex.quitArm = true; render(); } break;
    case "dpick": {
      const d = S.dr; if (d.done) break;
      d.sel = +b.dataset.i; d.done = true; d.n++;
      const ok = d.sel === d.q.ans; if (ok) d.c++;
      recordMany(d.u, [{ q: d.q, ok }]);
      if (d.mode === "review" && ok) { clearWrong(d.u, qid(d.q)); d.cleared++; }
      render(); break;
    }
    case "dnext": nextDrill(); render(true); break;
    case "dunit": if (b.dataset.unit !== S.dr.u) startDrill(b.dataset.unit, S.dr.mode); break;
    case "dpart": { const d = S.dr, p = b.dataset.p; d.parts = d.parts.includes(p) ? d.parts.filter(x => x !== p) : [...d.parts, p]; nextDrill(); render(); break; }
  }
});
$app.addEventListener("change", e => {
  if (e.target.id === "onlywrong") { S.rs.onlyWrong = e.target.checked; render(); }
});
document.addEventListener("keydown", e => {
  if (S.view !== "exam" || e.altKey || e.ctrlKey || e.metaKey) return;
  const ex = S.ex;
  if (e.key === "Escape" && ex.sheet) { ex.sheet = null; render(); return; }
  if (ex.sheet) return;
  if (e.key === "ArrowRight" && ex.cur < ex.qs.length - 1) { ex.cur++; render(true); }
  else if (e.key === "ArrowLeft" && ex.cur > 0) { ex.cur--; render(true); }
  else {
    const q = ex.qs[ex.cur], cnt = q.kind === "stmt" && q.f !== "combo" ? q.stmts.length : 4;
    const i = "12345".indexOf(e.key) >= 0 ? "12345".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
    if (i >= 0 && i < cnt) { ex.a[ex.cur] = i; render(); }
  }
});
render();

</script>
</body>
</html>

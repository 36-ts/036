<script>
const KISO = [
// ---------- 計算(A問題) ----------
{k:"calc",a:1,t:"点電荷の電界・電位",g:"pointE"},
{k:"calc",a:1,t:"クーロンの法則",g:"coulomb"},
{k:"calc",a:1,t:"平行平板コンデンサ",g:"plateC"},
{k:"calc",a:1,t:"コンデンサの直列接続",g:"capDivide"},
{k:"calc",a:1,t:"静電・電磁エネルギー",g:"energy"},
{k:"calc",a:2,t:"直線電流による磁界",g:"wireH"},
{k:"calc",a:2,t:"円形コイルの磁界",g:"loopH"},
{k:"calc",a:2,t:"環状鉄心の磁束密度",g:"toroidB"},
{k:"calc",a:2,t:"磁気回路",g:"magCircuit"},
{k:"calc",a:2,t:"運動する導体の起電力",g:"emf"},
{k:"calc",a:2,t:"相互インダクタンス",g:"mutualM"},
{k:"calc",a:2,t:"磁界中の電子の運動",g:"electronR"},
{k:"calc",a:3,t:"直列共振回路",g:"resonance"},
{k:"calc",a:3,t:"RLC直列回路",g:"rlcI"},

{k:"stmt",a:1,t:"静電界と電磁気の基本法則",s:[
["真空中の2つの点電荷間に働く静電力は、両電荷の積に比例し、距離の2乗に反比例する。",1,"正しい(クーロンの法則)。"],
["静電界中に置かれた導体の内部の電界は0であり、電荷は導体の表面にのみ分布する。",1,"正しい。"],
["電気力線は負電荷から出て正電荷に入り、電気力線どうしは交差することがある。",0,"誤り。電気力線は正電荷から出て負電荷に入り、互いに交差しない。"],
["磁界中で電流が流れる導体が受ける力の向きは、フレミングの左手の法則で求められる。",1,"正しい。"],
["誘導起電力は、その起電力による電流が作る磁束がもとの磁束の変化を妨げる向きに生じる。",1,"正しい(レンツの法則)。"],
["導体に高周波電流を流すと、周波数が高いほど電流が導体の中心部に集中する。",0,"誤り。電流は導体の表面近くに集中する(表皮効果)。"],
["うず電流損は、周波数の2乗及び磁束密度の最大値の2乗に比例する。",1,"正しい。積層鉄心などで低減する。"],
["ヒステリシス損は、周波数に反比例する。",0,"誤り。ヒステリシス損は周波数に比例する。"]
]},
{k:"stmt",a:4,t:"半導体素子",s:[
["シリコンに5価のリンなどを加えたN形半導体の多数キャリアは電子である。",1,"正しい。"],
["シリコンに3価のホウ素などを加えたP形半導体の多数キャリアは電子である。",0,"誤り。P形半導体の多数キャリアは正孔である。"],
["真性半導体の抵抗率は、温度が上昇すると小さくなる。",1,"正しい。金属は温度上昇で抵抗率が大きくなる。"],
["ツェナーダイオードは、逆方向電圧を加えたときの降伏現象を利用して定電圧を得る素子である。",1,"正しい。"],
["可変容量ダイオードは、加える逆方向電圧を大きくすると接合容量が大きくなる。",0,"誤り。逆方向電圧を大きくすると空乏層が広がり、接合容量は小さくなる。"],
["フォトダイオードは、通常、逆方向電圧を加えて使用し、光の強さに応じた電流が流れる。",1,"正しい。"],
["発光ダイオード(LED)は、順方向電流を流したときに発光する。",1,"正しい。"],
["サイリスタは、いったんターンオンすると、ゲート電流を0にしてもオンの状態を保つ。",1,"正しい。オフにするには主電流を保持電流以下にする必要がある。"]
]},
{k:"stmt",a:4,t:"マイクロ波用の素子・電子管",s:[
["ガンダイオードは、GaAs などのバルク結晶に生じる負性抵抗を利用したマイクロ波の発振素子である。",1,"正しい(ガン効果)。"],
["インパットダイオードは、なだれ降伏とキャリアの走行時間効果を利用した発振素子である。",1,"正しい。"],
["進行波管は、らせん形などの遅波回路を用いて電子流と電磁波を相互作用させる広帯域の増幅管である。",1,"正しい。"],
["マグネトロンは、直交する電界と磁界の中での電子の運動を利用する発振管で、レーダーの送信管などに用いられる。",1,"正しい。"],
["クライストロンは、電子流を密度変調して増幅・発振する電子管で、速度変調は用いない。",0,"誤り。クライストロンは電子流を速度変調し、それにより生じる密度変調(集群)を利用する。"],
["PINダイオードは、順方向電流により高周波抵抗が変化する性質を利用して、マイクロ波のスイッチや可変減衰器に用いられる。",1,"正しい。"],
["トンネルダイオードは、逆方向特性に負性抵抗領域を持つ。",0,"誤り。トンネルダイオードは順方向特性に負性抵抗領域を持つ。"]
]},
{k:"stmt",a:5,t:"トランジスタ増幅回路の接地方式",s:[
["エミッタ接地増幅回路は、入力と出力の位相が逆相である。",1,"正しい。"],
["ベース接地増幅回路の電流増幅率はほぼ1(1より小さい)である。",1,"正しい。"],
["コレクタ接地増幅回路(エミッタホロワ)の電圧増幅度はほぼ1で、入力インピーダンスが高く出力インピーダンスが低い。",1,"正しい。インピーダンス変換(バッファ)に用いられる。"],
["コレクタ接地増幅回路は、入力インピーダンスが低く、出力インピーダンスが高い。",0,"誤り。入力インピーダンスが高く、出力インピーダンスが低い。"],
["FETは入力(ゲート)インピーダンスが高く、電圧で出力電流を制御する素子である。",1,"正しい。"],
["接合形FETでは、通常、ゲートとチャネル間のPN接合に順方向電圧を加えて使用する。",0,"誤り。逆方向電圧を加えて使用する。"],
["ミラー効果により、エミッタ接地増幅回路のコレクタ・ベース間の容量は、入力側からは約(1+電圧増幅度)倍に見え、高域特性が劣化する。",1,"正しい。カスコード接続などで低減できる。"]
]},
{k:"stmt",a:5,t:"負帰還と電力増幅",s:[
["負帰還をかけると、増幅度は低下するが、周波数帯域は広くなる。",1,"正しい。"],
["負帰還をかけると、非直線ひずみや雑音(増幅器内部で発生するもの)が減少する。",1,"正しい。"],
["負帰還をかけると、増幅度の安定度が低下する。",0,"誤り。素子のばらつきや電源変動に対する増幅度の安定度は向上する。"],
["A級電力増幅器の電力効率の理論上の最大値は50%である。",1,"正しい(変成器結合などの場合)。"],
["B級プッシュプル電力増幅器の電力効率の理論上の最大値は約78.5%である。",1,"正しい(π/4)。"],
["B級プッシュプル電力増幅器では、入力信号の小さな部分でクロスオーバひずみが生じやすい。",1,"正しい。"],
["C級電力増幅器は、効率は低いがひずみが少ないため、低周波の電力増幅に多く用いられる。",0,"誤り。C級は効率が高いがひずみが大きく、高周波の電力増幅(同調負荷)に用いられる。"]
]},
{k:"stmt",a:5,t:"演算増幅器",s:[
["理想的な演算増幅器は、入力インピーダンスが無限大、出力インピーダンスが0、電圧増幅度が無限大である。",1,"正しい。"],
["負帰還をかけた理想的な演算増幅器では、2つの入力端子間の電圧はほぼ0とみなせる(仮想短絡)。",1,"正しい。"],
["反転増幅回路の電圧増幅度は、入力抵抗を R₁、帰還抵抗を R₂ として −R₂/R₁ である。",1,"正しい。"],
["非反転増幅回路の電圧増幅度は、R₂/R₁ である。",0,"誤り。非反転増幅回路の電圧増幅度は 1 + R₂/R₁ である。"],
["ボルテージホロワは電圧増幅度が1で、インピーダンス変換に用いられる。",1,"正しい。"],
["帰還路にコンデンサ、入力に抵抗を接続した反転形の回路は、微分回路として動作する。",0,"誤り。帰還路にコンデンサを接続したものは積分回路である。"]
]},
{k:"stmt",a:5,t:"発振回路",s:[
["帰還形発振回路が発振を持続する条件は、ループ利得(Aβ)の大きさが1以上で、位相が同相(0°)であることである。",1,"正しい(バルクハウゼンの条件)。"],
["コルピッツ発振回路は、共振回路の帰還にコンデンサの分割を用いる。",1,"正しい。"],
["ハートレー発振回路は、共振回路の帰還にコンデンサの分割を用いる。",0,"誤り。ハートレー発振回路はコイル(インダクタンス)の分割を用いる。"],
["水晶発振回路は、水晶振動子の Q が非常に高いため、周波数安定度が高い。",1,"正しい。"],
["ウィーンブリッジ形CR発振回路の発振周波数は 1/(2πCR) で、増幅器には3倍以上の増幅度が必要である。",1,"正しい。"],
["3段のCR回路を用いる移相形発振回路では、増幅器の増幅度は3倍以上あれば発振する。",0,"誤り。29倍以上の増幅度が必要である。"]
]},
{k:"stmt",a:5,t:"論理回路",s:[
["NAND回路だけを組み合わせて、すべての論理回路を構成することができる。",1,"正しい。NORも同様。"],
["ド・モルガンの定理により、A·B の否定は Ā + B̄ に等しい。",1,"正しい。"],
["論理式 A + A·B は A に等しい。",1,"正しい(吸収則)。"],
["排他的論理和(XOR)は、2つの入力が等しいときに出力が1となる。",0,"誤り。入力が異なるときに出力が1となる。"],
["JKフリップフロップで J = K = 1 のとき、クロックが入るたびに出力が反転する。",1,"正しい(トグル動作)。"],
["2進数 1011 を10進数で表すと 13 である。",0,"誤り。1011₂ = 8 + 2 + 1 = 11 である。"]
]},
{k:"stmt",a:6,t:"指示電気計器",s:[
["可動コイル形計器は直流専用で、指示は電流の平均値に比例し、目盛は平等目盛である。",1,"正しい。"],
["可動鉄片形計器は交直両用で、実効値を指示し、目盛は2乗目盛に近い。",1,"正しい。"],
["整流形計器は交流の平均値に応答するが、正弦波の実効値で目盛られているため、ひずみ波では誤差を生じる。",1,"正しい。"],
["熱電対形計器は、高周波電流の実効値の測定に適している。",1,"正しい。"],
["電流力計形計器は、交流専用で、直流の電力は測定できない。",0,"誤り。電流力計形計器は交直両用で、電力計として用いられる。"],
["静電形計器は、高電圧の測定に適し、直流・交流の両方に使用できる。",1,"正しい。"],
["誘導形計器は直流専用で、電力量計には使用されない。",0,"誤り。誘導形計器は交流専用で、電力量計に用いられる。"]
]},
{k:"stmt",a:6,t:"測定器と測定法",s:[
["オシロスコープの10:1プローブは、方形波を観測しながら位相補正用のトリマコンデンサを調整する。",1,"正しい。"],
["リサジュー図形では、図形と水平線・垂直線の交点の数の比から、2つの信号の周波数比を求めることができる。",1,"正しい。"],
["シェーリングブリッジは、コンデンサの静電容量と損失角(誘電正接)の測定に用いられる。",1,"正しい。"],
["ケルビンダブルブリッジは、高抵抗の測定に適している。",0,"誤り。ケルビンダブルブリッジは低抵抗の測定に適している。"],
["Qメータは、共振回路の共振時にコンデンサに生じる電圧と加えた電圧の比からQを求める。",1,"正しい。"],
["スペクトラムアナライザは、信号の周波数成分(スペクトル)を表示する測定器である。",1,"正しい。"],
["電圧計の内部抵抗は小さいほど、測定回路への影響が小さい。",0,"誤り。電圧計の内部抵抗は大きいほど影響が小さい。電流計は小さいほどよい。"]
]},
{k:"stmt",a:6,t:"国際単位系(SI)",s:[
["SIの基本単位は、メートル、キログラム、秒、アンペア、ケルビン、モル、カンデラの7つである。",1,"正しい。"],
["磁束の単位ウェーバ[Wb]は、[V·s]で表すことができる。",1,"正しい。"],
["磁束密度の単位テスラ[T]は、[Wb/m²]で表すことができる。",1,"正しい。"],
["インダクタンスの単位ヘンリー[H]は、[Wb/A]で表すことができる。",1,"正しい。"],
["誘電率の単位は[H/m]、透磁率の単位は[F/m]である。",0,"誤り。誘電率は[F/m]、透磁率は[H/m]である。"],
["ボルト[V]はSIの基本単位の一つである。",0,"誤り。ボルトは組立単位である(電流の基本単位はアンペア)。"]
]},

{k:"combo",a:3,t:"RLC直列回路の共振",q:"抵抗R、自己インダクタンスL、静電容量Cの直列回路に加える交流電圧の周波数を変化させると、共振時に回路のインピーダンスは［A］となり、回路に流れる電流は［B］となる。このときの共振周波数は［C］で表される。",slots:[["最小(Rに等しい)","最大"],["最大","最小"],["1/(2π√(LC))","2π√(LC)"]],e:"直列共振では XL = XC となりリアクタンスが打ち消し合うため、インピーダンスは R だけ(最小)で、電流は最大になる。"},
{k:"combo",a:3,t:"LC並列共振回路",q:"損失の小さいコイルとコンデンサの並列共振回路では、共振時に回路のインピーダンスは［A］となり、電源から流れ込む電流は［B］となる。共振回路のQが大きいほど、周波数選択度は［C］なる。",slots:[["最大","最小"],["最小","最大"],["高く","低く"]],e:"並列共振では、L と C を循環する電流に比べ電源からの電流が最小になり、インピーダンスは最大となる。"},
{k:"combo",a:5,t:"エミッタホロワ",q:"コレクタ接地増幅回路(エミッタホロワ)は、電圧増幅度が［A］で、入力インピーダンスが［B］、出力インピーダンスが［C］ため、インピーダンス変換回路として用いられる。",slots:[["ほぼ1","非常に大きい"],["高く","低く"],["低い","高い"]],e:"エミッタホロワは電圧利得ほぼ1、入力インピーダンス高、出力インピーダンス低。"},
{k:"combo",a:5,t:"負帰還増幅回路",q:"増幅回路に負帰還をかけると、増幅度は［A］が、周波数帯域は［B］なり、非直線ひずみは［C］する。",slots:[["低下する","増加する"],["広く","狭く"],["減少","増加"]],e:"負帰還は利得と引き換えに、帯域・ひずみ・安定度を改善する。"},
{k:"combo",a:4,t:"半導体",q:"N形半導体は、真性半導体に［A］の不純物を加えたもので、多数キャリアは［B］である。PN接合に［C］の電圧を加えると電流が流れやすい。",slots:[["5価","3価"],["電子","正孔"],["順方向","逆方向"]],e:"5価(リン・ヒ素など)→N形・多数キャリアは電子。3価(ホウ素など)→P形・多数キャリアは正孔。"},
{k:"combo",a:2,t:"電磁誘導",q:"コイルを貫く磁束が変化すると、その変化を［A］向きに誘導起電力が生じる。これを［B］の法則という。また、誘導起電力の大きさは磁束の時間的変化の割合に［C］する。",slots:[["妨げる","助ける"],["レンツ","アンペア"],["比例","反比例"]],e:"向きはレンツの法則、大きさはファラデーの電磁誘導の法則(e = −N dΦ/dt)。"},
{k:"combo",a:6,t:"指示電気計器",q:"可動コイル形計器は［A］の測定に用いられ、指示は電流の［B］に比例する。熱電対形計器は［C］電流の実効値の測定に適している。",slots:[["直流","交流"],["平均値","最大値"],["高周波","直流"]],e:"可動コイル形は直流・平均値・平等目盛。熱電対形は高周波でも実効値を指示できる。"},

{k:"fill",a:3,t:"RLC直列共振回路の性質",q:"RLC直列回路の共振角周波数 ω₀ は（ア）で表され、このとき回路のインピーダンスは（イ）に等しい。尖鋭度 Q は Q =（ウ）で表され、共振時にコイルの両端に現れる電圧の大きさは電源電圧の（エ）倍となる。また、共振曲線の半値幅 B は、共振周波数 f₀ を用いて B =（オ）で表される。",ans:["1/√(LC)","R","ω₀L/R","Q","f₀/Q"],dis:["√(LC)","0","R/(ω₀L)","1/Q","Q·f₀","ω₀CR","2π√(LC)"],e:"共振時は ωL = 1/(ωC)。Q = ω₀L/R = 1/(ω₀CR)。L・C の電圧は電源電圧の Q 倍。半値幅 = f₀/Q。"},
{k:"fill",a:6,t:"指示電気計器",q:"可動コイル形計器は（ア）の測定に用い、目盛は（イ）である。整流形計器は交流の平均値に応答するが、正弦波の平均値に（ウ）を乗じた値で目盛られているため、ひずみ波を測定すると誤差を生じる。熱電対形計器は（エ）の電流の測定に適し、（オ）を指示する。",ans:["直流","平等目盛","1.11（波形率）","高周波","実効値"],dis:["交流","2乗目盛","1.41（波高率）","平均値","低周波","対数目盛","最大値"],e:"整流形は平均値応答・正弦波実効値目盛(平均値×1.11)。"},
{k:"fill",a:5,t:"負帰還増幅器",q:"帰還をかけない増幅度を A、帰還率を β として負帰還をかけた増幅器の増幅度 Af は Af =（ア）となる。|Aβ| ≫ 1 のときは Af ≒（イ）となり、増幅度は増幅素子のばらつきの影響を（ウ）。また、負帰還により周波数帯域は（エ）、非直線ひずみは（オ）。",ans:["A/(1+Aβ)","1/β","受けにくくなる","広くなる","減少する"],dis:["A/(1−Aβ)","β","受けやすくなる","狭くなる","増加する","Aβ","1+Aβ"],e:"Af = A/(1+Aβ)。|Aβ|≫1 なら帰還回路だけで増幅度が決まる。"},

{k:"fill",a:4,t:"無線局の運用(目的外使用の禁止等)",q:"①無線局は、免許状に記載された目的等の範囲を超えて運用してはならない。ただし、（ア）、緊急通信、安全通信、（イ）などについては、この限りでない。②無線局を運用する場合の空中線電力は、免許状に記載されたものの（ウ）であり、かつ、通信を行うため（エ）のものでなければならない。③無線局は、免許状に記載された（オ）内でなければ、運用してはならない。",ans:["遭難通信","非常通信","範囲内","必要最小","運用許容時間"],dis:["一般通信","業務通信","範囲外","必要最大","免許の有効期間","工事落成の期限"],e:"電波法第52条・第54条・第55条。"},
{k:"fill",a:2,t:"空中線電力と利得の定義",q:"①「（ア）」とは、通常の動作状態において、変調包絡線の最高尖頭における無線周波数1サイクルの間に送信機から空中線系の給電線に供給される平均の電力をいう。②「（イ）」とは、変調のない状態における無線周波数1サイクルの間に送信機から空中線系の給電線に供給される平均の電力をいう。③空中線の（ウ）とは、基準空中線が空間に孤立している等方性空中線であるときの利得をいい、（エ）とは、基準空中線が半波無損失ダイポールであるときの利得をいう。④「（オ）」とは、空中線に供給される電力に、与えられた方向における空中線の絶対利得を乗じたものをいう。",ans:["尖頭電力","搬送波電力","絶対利得","相対利得","等価等方輻射電力"],dis:["平均電力","規格電力","指向性利得","実効輻射電力","最大電力","合成利得"],e:"電波法施行規則第2条。実効輻射電力は相対利得を乗じたもの。"},
{k:"fill",a:3,t:"主任無線従事者の職務",q:"主任無線従事者の職務は次のとおりである。①その監督を受けて無線設備の操作を行う者に対する（ア）（実習を含む。）の計画を立案し、実施すること。②無線設備の機器の（イ）を行い、又はその監督を行うこと。③無線業務日誌その他の書類を作成し、又はその作成を監督すること。④主任無線従事者の職務を遂行するために必要な事項に関し（ウ）に対して意見を述べること。また、主任無線従事者は選任の日から（エ）以内に講習を受け、その後は講習を受けた日から（オ）以内に講習を受けなければならない。",ans:["訓練","点検若しくは保守","免許人等","6箇月","5年"],dis:["試験","製造","総務大臣","1年","3年","10年"],e:"電波法施行規則第34条の5・第34条の7。"},
{k:"fill",a:2,t:"スプリアス発射等の定義",q:"「（ア）」とは、必要周波数帯外における一又は二以上の周波数の電波の発射であって、そのレベルを情報の伝送に影響を与えないで低減することができるものをいい、高調波発射、低調波発射、（イ）及び相互変調積を含み、（ウ）を含まないものとする。「（ウ）」とは、必要周波数帯に近接する周波数の電波の発射で情報の伝送のための変調の過程において生ずるものをいう。スプリアス発射及び帯域外発射を総称して「（エ）」という。また、占有周波数帯幅の定義では、上限・下限の外側の平均電力はそれぞれ全平均電力の（オ）に等しいとされる。",ans:["スプリアス発射","寄生発射","帯域外発射","不要発射","0.5パーセント"],dis:["不要輻射","副次的に発する電波","高調波","5パーセント","1パーセント","スプリアス領域"],e:"電波法施行規則第2条。"},
{k:"fill",a:4,t:"無線通信の原則",q:"①（ア）無線通信は、これを行ってはならない。②無線通信に使用する用語は、できる限り（イ）でなければならない。③無線通信を行うときは、自局の（ウ）を付して、その出所を明らかにしなければならない。④無線通信は、（エ）に行うものとし、通信上の誤りを知ったときは、（オ）訂正しなければならない。",ans:["必要のない","簡潔","識別信号","正確","直ちに"],dis:["緊急でない","丁寧","免許番号","迅速","通信終了後に","明瞭"],e:"無線局運用規則第10条。"},
{k:"fill",a:5,t:"電波の発射の停止と無線局の処分",q:"①総務大臣は、無線局の発射する（ア）が総務省令で定めるものに適合していないと認めるときは、当該無線局に対して（イ）電波の発射の停止を命ずることができる。②この命令を受けた無線局から適合するに至った旨の申出を受けたときは、その無線局に電波を（ウ）に発射させなければならない。③免許人が電波法等に違反したときは、（エ）以内の期間を定めて無線局の運用の停止を命ずることができる。④正当な理由がないのに無線局の運用を引き続き（オ）以上休止したときは、免許を取り消すことができる。",ans:["電波の質","臨時に","試験的","3箇月","6箇月"],dis:["空中線電力","直ちに","継続的","1箇月","1年","2週間"],e:"電波法第72条・第76条。"}

{k:"stmt",a:3,t:"送信機とPLLシンセサイザ",s:[

["C級電力増幅器は効率が高いが、ひずみが大きいため、同調回路を負荷にして高周波の電力増幅に用いる。",1,"正しい。"],
["送信機の終段増幅器の寄生振動は、スプリアス発射の原因となる。",1,"正しい。"],

{k:"stmt",a:4,t:"OFDMと地上デジタル放送",s:[
["OFDMは、互いに直交する多数のサブキャリアに情報を分散して伝送する方式である。",1,"正しい。"],
["OFDMは、シンボル長が長く、ガードインターバルを付加することで、マルチパスによる符号間干渉の影響を受けにくい。",1,"正しい。"],
["OFDM信号はピーク電力対平均電力比が小さいため、送信増幅器の線形性はあまり要求されない。",0,"誤り。ピーク電力対平均電力比が大きいため、線形性の高い増幅器が必要である。"],
["我が国の地上デジタルテレビ放送(ISDB-T)は、6MHzの帯域を13のセグメントに分割している。",1,"正しい。中央の1セグメントは携帯端末向け(ワンセグ)に用いられる。"],
["ISDB-Tでは、周波数インターリーブや時間インターリーブにより、フェージングやインパルス性雑音への耐性を高めている。",1,"正しい。"],
["OFDMでは、同一周波数で複数の送信所から同じ番組を放送する単一周波数ネットワーク(SFN)を構成できる。",1,"正しい。遅延がガードインターバル内であれば妨害とならない。"],
["ガードインターバル長を長くすると、伝送容量は増加する。",0,"誤り。ガードインターバルは情報を運ばないため、長くすると伝送効率(伝送容量)は低下する。"]
]},
{k:"stmt",a:4,t:"移動通信・無線LAN・ダイバーシティ",s:[
["LTEの下りリンクではOFDMA、上りリンクではSC-FDMAが用いられている。",1,"正しい。SC-FDMAは端末のピーク電力を抑えられる。"],
["無線LANでは、送信前にチャネルの使用状況を確認して衝突を避けるCSMA/CA方式が用いられる。",1,"正しい。"],
["MIMOは、複数の送受信アンテナを用いて空間多重を行い、伝送容量を増加させる技術である。",1,"正しい。"],
["ダイバーシティの合成方式のうち、最大比合成は、各ブランチのS/Nに応じて重み付けして合成するため、最も高い改善効果が得られる。",1,"正しい。"],
["直接拡散(DS)方式のスペクトル拡散通信では、拡散後の帯域幅と情報信号の帯域幅の比が処理利得となる。",1,"正しい。"],
["スペクトル拡散方式は、狭帯域の妨害波に対して弱いという欠点がある。",0,"誤り。逆拡散によって妨害波が拡散されるため、狭帯域の妨害に強い。"],
["空間ダイバーシティは、偏波の異なる2つのアンテナで受信する方式である。",0,"誤り。空間ダイバーシティは、離して設置した複数のアンテナで受信する方式。記述は偏波ダイバーシティ。"]
]},
{k:"stmt",a:5,t:"衛星通信",s:[
["静止衛星の高度は約36,000 kmで、地球局→衛星→地球局の伝搬遅延時間は約0.25秒である。",1,"正しい。"],
["静止衛星が地球の影に入る食は、春分及び秋分の前後に発生し、その間は蓄電池で電力を供給する。",1,"正しい。食の最大継続時間は約70分。"],
["春分及び秋分の前後には、太陽が地球局アンテナのビーム内に入り、受信雑音が増加する太陽雑音妨害(サンインタフェアランス)が生じることがある。",1,"正しい。"],
["衛星通信では、一般に下り回線(衛星→地球局)に上り回線より高い周波数が用いられる。",0,"誤り。一般に上り回線の方が高い周波数(例:6/4GHz帯、14/12GHz帯)である。"],
["SCPC方式は、1つの通話路(チャネル)ごとに1つの搬送波を割り当てる方式である。",1,"正しい。"],
["TDMA方式では、各地球局が時間を分割して同一の周波数を共用するため、衛星中継器を飽和領域付近で効率よく動作させられる。",1,"正しい。"],
["FDMA方式で衛星中継器を飽和点付近で動作させても、相互変調積は発生しない。",0,"誤り。複数の搬送波を同時に増幅するため相互変調積が生じる。そのため入力バックオフをとる。"]
]},
{k:"stmt",a:5,t:"レーダーと航法システム",s:[

["GPSで3次元の位置を求めるには、受信機の時計誤差を含めて、通常4機以上の衛星の電波を受信する必要がある。",1,"正しい。"],
["ILSのローカライザは滑走路の中心線(水平方向)の誘導を、グライドパスは降下角(垂直方向)の誘導を行う。",1,"正しい。"],
["DMEは、航空機からの質問パルスに対する地上局の応答パルスの往復時間から距離を求める装置である。",1,"正しい。"],

{k:"stmt",a:6,t:"電源装置と電池",s:[

["ニッケル・水素蓄電池は、浅い充放電を繰り返すと見かけの容量が減るメモリ効果がある。",1,"正しい。"],
["鉛蓄電池の公称電圧は1セル当たり約2Vで、負荷と並列に接続して常時充電する浮動充電方式で使用されることがある。",1,"正しい。"],
["常時インバータ給電方式のUPSは、停電時に切替えのための瞬断が生じる。",0,"誤り。常時インバータから給電するので、停電時も瞬断なく給電できる。"],
["シリコン太陽電池の開放電圧は、温度が上昇すると高くなる。",0,"誤り。温度が上昇すると開放電圧は低下し、出力も低下する。"],
["スイッチング方式の直流電源は、シリーズレギュレータ方式に比べて効率が高いが、スイッチングに伴う雑音が発生しやすい。",1,"正しい。"]
]},

{k:"combo",a:1,t:"FMのエンファシス",q:"FM送信機では、変調信号の高い周波数成分を強調する［A］を行い、受信機では［B］によって元の周波数特性に戻す。これにより、復調出力の高域における［C］が改善される。",slots:[["プリエンファシス","ディエンファシス"],["ディエンファシス","プリエンファシス"],["S/N","ひずみ率"]],e:"FM の復調後の雑音は高域ほど大きい(三角雑音)ため、エンファシスで改善する。"},

{k:"combo",a:2,t:"PCMと誤り訂正",q:"標本化周波数は、信号の最高周波数の［A］倍以上必要である。直線量子化で量子化ビット数を1ビット増やすと、信号対量子化雑音比は約［B］dB改善する。誤り訂正符号のうち、バースト誤りに強いのは［C］符号である。",slots:[["2","1.5"],["6","3"],["リード・ソロモン","パリティ"]],e:"標本化定理、S/Nq ≒ 6n + 1.8 dB、RS符号はバイト単位で訂正しバースト誤りに強い。"},

{k:"fill",a:1,t:"FM変調",q:"FM波の変調指数 mf は、最大周波数偏移 Δf と変調信号の周波数 fm を用いて mf =（ア）で表される。カーソン則による占有周波数帯幅は B ≒（イ）である。FM受信機では、受信C/Nがある値以下になると出力S/Nが急激に劣化する（ウ）現象がある。送信側で高域を強調する（エ）と、受信側で元に戻す（オ）を組み合わせてS/Nを改善する。",ans:["Δf/fm","2(Δf+fm)","スレッショルド","プリエンファシス","ディエンファシス"],dis:["fm/Δf","2Δf","キャプチャ","スケルチ","AGC","Δf+fm","飽和"],e:"カーソン則 B ≒ 2(Δf + fm)。"},
{k:"fill",a:3,t:"PLL周波数シンセサイザ",q:"PLL周波数シンセサイザは、基準発振器、（ア）、ループフィルタ、（イ）及び可変分周器で構成される。基準周波数を fr、分周比を N とすると、出力周波数は（ウ）となる。ループがロックすると、可変分周器の出力の位相は基準信号に（エ）し、出力周波数の安定度は（オ）の安定度で決まる。",ans:["位相比較器","VCO","N·fr","同期","基準発振器"],dis:["周波数弁別器","混合器","fr/N","逆相","ループフィルタ","局部発振器"],e:"分周比 N を変えることで、基準周波数の整数倍の周波数を安定に得られる。"},

function mcNum(r, correct, cands, fmt, nOpt) {
  nOpt = nOpt || 5;
  const vals = [correct], seen = new Set([fmt(correct)]);
  const push = c => { if (vals.length >= nOpt || c == null || !isFinite(c) || c === 0) return; const s = fmt(c); if (seen.has(s)) return; seen.add(s); vals.push(c); };

  for (const [p, q] of fr) if (Math.abs(x - p / q) < 1e-9) return q === 1 ? `${p}倍` : `${p}/${q}倍`;
  return `${sig(x, 3)}倍`;
};

// ===== 計算問題(無線工学の基礎) =====
const K9 = 9e9, EPS0 = 8.85e-12;
const CALC = {
  pointE(r) {
    const q = pick(r, [1, 2, 3, 4, 5, 6, 8]), d = pick(r, [0.1, 0.2, 0.3, 0.5, 1, 2, 3]), Q = q * 1e-9;
    const E = K9 * Q / (d * d), V = K9 * Q / d;
    if (r() < 0.5) {
      const m = mcNum(r, E, [V, E * 2, E / 2, E * 4], v => U(v, "V/m"));
      return { q: `真空中に置かれた ${q}×10⁻⁹ [C] の点電荷から ${d} [m] 離れた点の電界の強さの値として、最も近いものを下の番号から選べ。ただし、1/(4πε₀) = 9×10⁹ とする。`, ...m,
        e: `E = Q/(4πε₀r²) = 9×10⁹ × ${q}×10⁻⁹ ÷ ${d}² = ${U(E, "V/m")}。距離の2乗に反比例することに注意(1乗で割ると電位になる)。` };
    }
    const m = mcNum(r, V, [E, V * 2, V / 2, V * d * d], v => U(v, "V"));
    return { q: `真空中に置かれた ${q}×10⁻⁹ [C] の点電荷から ${d} [m] 離れた点の電位の値として、最も近いものを下の番号から選べ。ただし、無限遠点の電位を0とし、1/(4πε₀) = 9×10⁹ とする。`, ...m,
      e: `V = Q/(4πε₀r) = 9×10⁹ × ${q}×10⁻⁹ ÷ ${d} = ${U(V, "V")}。電位は距離に反比例する。` };
  },
  coulomb(r) {
    const q1 = pick(r, [1, 2, 3, 4, 5]), q2 = pick(r, [1, 2, 3, 4, 6]), d = pick(r, [0.1, 0.2, 0.3, 0.5, 1]);
    const F = K9 * q1 * q2 * 1e-12 / (d * d);
    const m = mcNum(r, F, [F * d, F * 2, F / 2, F * 10], v => U(v, "N"));
    return { q: `真空中で ${q1} [μC] と ${q2} [μC] の点電荷が ${d} [m] 離れて置かれているとき、両電荷間に働く静電力の大きさとして、最も近いものを下の番号から選べ。ただし、1/(4πε₀) = 9×10⁹ とする。`, ...m,
      e: `F = Q₁Q₂/(4πε₀r²) = 9×10⁹ × ${q1}×10⁻⁶ × ${q2}×10⁻⁶ ÷ ${d}² = ${U(F, "N")}(クーロンの法則)。` };
  },
  plateC(r) {
    const er = pick(r, [1, 2, 3, 4, 5]), S = pick(r, [100, 200, 250, 400, 500]), d = pick(r, [0.5, 1, 2, 4]);
    const C = EPS0 * er * S * 1e-4 / (d * 1e-3), pF = C * 1e12;
    if (r() < 0.6) {
      const m = mcNum(r, pF, [pF / er, pF * 10, pF / 10, pF * 100], v => U(v, "pF"));
      return { q: `面積 ${S} [cm²] の2枚の平行平板電極を ${d} [mm] の間隔で置き、間を比誘電率 ${er} の誘電体で満たしたコンデンサの静電容量として、最も近いものを下の番号から選べ。ただし、真空の誘電率 ε₀ = 8.85×10⁻¹² [F/m] とし、端効果は無視する。`, ...m,
        e: `C = ε₀εᵣS/d = 8.85×10⁻¹² × ${er} × ${S}×10⁻⁴ ÷ (${d}×10⁻³) ≒ ${U(pF, "pF")}。面積は[m²]、間隔は[m]に直して計算する。` };
    }
    const k = pick(r, [2, 3, 4]), how = pick(r, ["d", "S", "er"]);
    const ratio = how === "d" ? 1 / k : k;
    const txt = how === "d" ? `電極間隔を ${k} 倍` : how === "S" ? `電極の面積を ${k} 倍` : `誘電体の比誘電率が ${k} 倍のものに替え`;
    const m = mcStr(r, ratioStr(ratio), [ratioStr(1 / ratio), ratioStr(ratio * ratio), ratioStr(1 / (ratio * ratio)), "1倍", ratioStr(ratio * 2)]);
    return { q: `平行平板コンデンサにおいて、${txt}たとき、静電容量は元の何倍になるか。正しいものを下の番号から選べ。ただし、端効果は無視する。`, ...m,
      e: `C = ε₀εᵣS/d より、C は面積と比誘電率に比例し、電極間隔に反比例する。よって ${ratioStr(ratio)}。` };
  },
  capDivide(r) {
    let c1 = pick(r, [1, 2, 3, 4, 6]), c2 = pick(r, [1, 2, 3, 4, 6]); if (c1 === c2) c2 = c1 === 6 ? 3 : 6;
    const V = pick(r, [12, 24, 30, 60, 90, 120]), V1 = V * c2 / (c1 + c2);
    const m = mcNum(r, V1, [V * c1 / (c1 + c2), V / 2, V * c1 / c2, V], v => U(v, "V"));
    return { q: `静電容量 C₁ = ${c1} [μF] と C₂ = ${c2} [μF] のコンデンサを直列に接続し、両端に ${V} [V] の直流電圧を加えた。C₁ の両端の電圧として、正しいものを下の番号から選べ。ただし、各コンデンサの初期電荷は0とする。`, ...m,
      e: `直列接続では各コンデンサの電荷 Q が等しく、電圧は静電容量に反比例して分配される。V₁ = V × C₂/(C₁+C₂) = ${V} × ${c2}/${c1 + c2} = ${U(V1, "V")}。` };
  },
  wireH(r) {
    const I = pick(r, [2, 3, 4, 5, 6, 8, 10]), d = pick(r, [0.05, 0.1, 0.2, 0.25, 0.5]), H = I / (2 * Math.PI * d);
    const m = mcNum(r, H, [I / (Math.PI * d), I / (2 * d), I / (4 * Math.PI * d), I / (2 * Math.PI * d * d)], v => U(v, "A/m"));
    return { q: `真空中に置かれた無限長の直線導体に ${I} [A] の直流電流を流したとき、導体から ${d} [m] 離れた点の磁界の強さとして、最も近いものを下の番号から選べ。`, ...m,
      e: `アンペアの周回積分の法則より H × 2πr = I、H = I/(2πr) = ${I} ÷ (2π × ${d}) ≒ ${U(H, "A/m")}。` };
  },
  loopH(r) {
    const N = pick(r, [10, 20, 50, 100]), I = pick(r, [0.5, 1, 2]), a = pick(r, [0.05, 0.1, 0.2, 0.25]), H = N * I / (2 * a);
    const m = mcNum(r, H, [N * I / (2 * Math.PI * a), N * I / a, N * I / (4 * a), I / (2 * a)], v => U(v, "A/m"));
    return { q: `半径 ${a} [m]、巻数 ${N} の円形コイルに ${I} [A] の直流電流を流したとき、コイルの中心の磁界の強さとして、最も近いものを下の番号から選べ。ただし、コイルの導線の太さは無視する。`, ...m,
      e: `円形コイルの中心の磁界は H = NI/(2a) = ${N} × ${I} ÷ (2 × ${a}) = ${U(H, "A/m")}。直線導体の式 I/(2πr) と混同しないこと。` };
  },
  toroidB(r) {
    const N = pick(r, [200, 500, 1000]), I = pick(r, [0.5, 1, 2]), a = pick(r, [0.1, 0.2, 0.25]), mr = pick(r, [100, 500, 1000]);
    const B = 2e-7 * mr * N * I / a;
    const m = mcNum(r, B, [B / mr, B * 2, B / 2, B * Math.PI], v => U(v, "T"));
    return { q: `比透磁率 ${mr} の環状鉄心(平均半径 ${a} [m])に巻数 ${N} のコイルを一様に巻き、${I} [A] の電流を流したとき、鉄心内の平均磁束密度の大きさとして、最も近いものを下の番号から選べ。ただし、真空の透磁率 μ₀ = 4π×10⁻⁷ [H/m] とし、漏れ磁束はないものとする。`, ...m,
      e: `H = NI/(2πa)、B = μ₀μᵣH = 4π×10⁻⁷ × ${mr} × ${N} × ${I} ÷ (2π × ${a}) = 2×10⁻⁷ × ${mr} × ${N} × ${I} ÷ ${a} ≒ ${U(B, "T")}。` };
  },
  magCircuit(r) {
    const N = pick(r, [200, 500, 1000]), I = pick(r, [0.5, 1, 2]), mu = pick(r, [1, 2, 4]), S = pick(r, [4, 5, 8, 10]), l = pick(r, [0.2, 0.4, 0.5]);
    const Rm = l / (mu * 1e-3 * S * 1e-4);
    if (r() < 0.5) {
      const Phi = N * I / Rm;
      const m = mcNum(r, Phi, [Phi * 2, Phi / 2, Phi * 10, N * I * Rm * 1e-10], v => U(v, "Wb"));
      return { q: `透磁率 μ = ${mu}×10⁻³ [H/m]、断面積 ${S} [cm²]、磁路の平均の長さ ${l} [m] の環状鉄心に、巻数 ${N} のコイルを巻いて ${I} [A] の電流を流した。鉄心中の磁束の値として、最も近いものを下の番号から選べ。ただし、漏れ磁束はないものとする。`, ...m,
        e: `磁気抵抗 Rm = l/(μS) = ${l} ÷ (${mu}×10⁻³ × ${S}×10⁻⁴) ≒ ${fmtN(Rm)} [H⁻¹]。Φ = NI/Rm = ${N * I} ÷ ${fmtN(Rm)} ≒ ${U(Phi, "Wb")}(磁気回路のオームの法則)。` };
    }
    const L = N * N / Rm;
    const m = mcNum(r, L, [N / Rm, L * 2, L / 2, L * N], v => U(v, "H"));
    return { q: `透磁率 μ = ${mu}×10⁻³ [H/m]、断面積 ${S} [cm²]、磁路の平均の長さ ${l} [m] の環状鉄心に、巻数 ${N} のコイルを巻いた。このコイルの自己インダクタンスとして、最も近いものを下の番号から選べ。ただし、漏れ磁束はないものとする。`, ...m,
      e: `L = N²/Rm = μSN²/l = ${mu}×10⁻³ × ${S}×10⁻⁴ × ${N}² ÷ ${l} ≒ ${U(L, "H")}。巻数の2乗に比例する。` };
  },
  emf(r) {
    const B = pick(r, [0.2, 0.4, 0.5, 0.8, 1]), l = pick(r, [0.1, 0.2, 0.3, 0.5]), v = pick(r, [2, 5, 10, 20]), th = pick(r, [90, 30, 60]);
    const s = { 90: 1, 30: 0.5, 60: Math.sqrt(3) / 2 }[th], c = { 90: 0, 30: Math.sqrt(3) / 2, 60: 0.5 }[th];
    const e = B * l * v * s;
    const m = mcNum(r, e, [B * l * v * (c || 2), B * l * v, e * 2, e / 2], x => U(x, "V"));
    return { q: `磁束密度 ${B} [T] の一様な磁界中に、磁界と直角に置かれた長さ ${l} [m] の直線導体を、磁界の方向と ${th}° の角度をなす方向に速度 ${v} [m/s] で動かしたとき、導体に誘起される起電力の大きさとして、最も近いものを下の番号から選べ。`, ...m,
      e: `e = Blv sinθ = ${B} × ${l} × ${v} × sin${th}° ≒ ${U(e, "V")}(フレミングの右手の法則で向きを判断する)。` };
  },
  mutualM(r) {
    const L1 = pick(r, [20, 30, 40, 50]), L2 = pick(r, [20, 40, 60, 80]), M = pick(r, [5, 10, 15]);
    const La = L1 + L2 + 2 * M, Lb = L1 + L2 - 2 * M;
    const m = mcNum(r, M, [(La - Lb) / 2, La - Lb, (La + Lb) / 4, (La - Lb) / 8], v => U(v, "mH"));
    return { q: `2つのコイルを直列に接続したとき、和動接続の合成インダクタンスが ${La} [mH]、差動接続の合成インダクタンスが ${Lb} [mH] であった。2つのコイル間の相互インダクタンス M の値として、正しいものを下の番号から選べ。`, ...m,
      e: `和動 La = L₁+L₂+2M、差動 Lb = L₁+L₂−2M。差をとると La−Lb = 4M より、M = (${La}−${Lb})/4 = ${U(M, "mH")}。` };
  },
  electronR(r) {
    const a = pick(r, [2, 3, 0.5]), b = pick(r, [2, 4, 0.5]);
    if (r() < 0.6) {
      const ratio = a / b;
      const m = mcStr(r, ratioStr(ratio), [ratioStr(b / a), ratioStr(a * b), ratioStr(ratio * ratio), "1倍", ratioStr(1 / (a * b))]);
      return { q: `一様な磁界中に、磁界と直角に入射した電子は円運動をする。電子の速度を ${ratioStr(a)}、磁束密度を ${ratioStr(b)} にすると、円運動の半径は元の何倍になるか。正しいものを下の番号から選べ。`, ...m,
        e: `ローレンツ力 evB が向心力 mv²/r と等しいので r = mv/(eB)。半径は速度に比例し、磁束密度に反比例する。よって ${ratioStr(a)} ÷ ${ratioStr(b).replace("倍", "")} = ${ratioStr(ratio)}。` };
    }
    const ratio = 1 / b;
    const m = mcStr(r, ratioStr(ratio), [ratioStr(b), ratioStr(a / b), ratioStr(a), "1倍", ratioStr(1 / (b * b))]);
    return { q: `一様な磁界中に、磁界と直角に入射した電子は円運動をする。電子の速度を ${ratioStr(a)}、磁束密度を ${ratioStr(b)} にすると、円運動の周期は元の何倍になるか。正しいものを下の番号から選べ。`, ...m,
      e: `周期 T = 2πr/v = 2πm/(eB) となり、速度には無関係で磁束密度に反比例する。よって ${ratioStr(ratio)}。` };
  },
  resonance(r) {
    const L = pick(r, [10, 20, 50, 100, 200]), C = pick(r, [100, 200, 250, 500, 1000]), R = pick(r, [5, 10, 20]);
    const f0 = 1 / (2 * Math.PI * Math.sqrt(L * 1e-6 * C * 1e-12)), Q = 2 * Math.PI * f0 * L * 1e-6 / R;
    const mode = pick(r, ["f", "Q", "B"]);
    if (mode === "f") {
      const m = mcNum(r, f0 / 1e6, [f0 * 2 * Math.PI / 1e6, f0 / 1e6 / 2, f0 / 1e6 * Math.sqrt(10), f0 / 1e6 / Math.sqrt(10)], v => U(v, "MHz"));
      return { q: `自己インダクタンス ${L} [μH] のコイルと静電容量 ${C} [pF] のコンデンサからなる直列共振回路の共振周波数として、最も近いものを下の番号から選べ。`, ...m,
        e: `f₀ = 1/(2π√(LC)) = 1/(2π√(${L}×10⁻⁶ × ${C}×10⁻¹²)) ≒ ${U(f0 / 1e6, "MHz")}。` };
    }
    if (mode === "Q") {
      const m = mcNum(r, Q, [1 / Q, Q * 2, Q / 2, Q * 2 * Math.PI], v => fmtN(v));
      return { q: `抵抗 ${R} [Ω]、自己インダクタンス ${L} [μH]、静電容量 ${C} [pF] の RLC 直列共振回路の尖鋭度(Q)の値として、最も近いものを下の番号から選べ。`, ...m,
        e: `共振周波数 f₀ = 1/(2π√(LC)) ≒ ${U(f0 / 1e6, "MHz")}。Q = ω₀L/R = (1/R)√(L/C) = (1/${R})√(${L}×10⁻⁶ ÷ ${C}×10⁻¹²) ≒ ${fmtN(Q)}。` };
    }
    const BW = f0 / Q;
    const m = mcNum(r, BW / 1e3, [f0 * Q / 1e3 / 1e3, BW / 1e3 * 2, BW / 1e3 / 2, BW / 1e3 * 2 * Math.PI], v => U(v, "kHz"));
    return { q: `抵抗 ${R} [Ω]、自己インダクタンス ${L} [μH]、静電容量 ${C} [pF] の RLC 直列共振回路の半値幅(電流が共振時の 1/√2 になる周波数の幅)として、最も近いものを下の番号から選べ。`, ...m,
      e: `Q = (1/R)√(L/C) ≒ ${fmtN(Q)}、f₀ ≒ ${U(f0 / 1e6, "MHz")}。半値幅 B = f₀/Q = R/(2πL) ≒ ${U(BW / 1e3, "kHz")}。` };
  },
  rlcI(r) {
    const [a, b, c] = pick(r, [[3, 4, 5], [4, 3, 5], [5, 12, 13], [8, 6, 10], [8, 15, 17]]), k = pick(r, [2, 5, 10, 20]);
    const R = a * k, X = b * k, Z = c * k, XC = pick(r, [20, 30, 50, 60, 100]), XL = X + XC;

    if (mode === "I") {

    }
    if (mode === "P") {
      const P = I * I * R;
      const m = mcNum(r, P, [V * I, I * I * Z, (V / R) * (V / R) * R, I * I * X], v => U(v, "W"));
      return { q: `${ctx}回路で消費される電力(有効電力)として、最も近いものを下の番号から選べ。`, ...m, e: `Z = √(${R}² + ${X}²) = ${Z} [Ω]、I = ${fmtN(I)} [A]。電力を消費するのは抵抗だけなので P = I²R = ${fmtN(I)}² × ${R} = ${U(P, "W")}。` };

  },
  maxPower(r) {
    const E = pick(r, [6, 9, 10, 12, 20, 24]), ri = pick(r, [1, 2, 3, 4, 5, 6]);
    if (r() < 0.55) {

      return { q: `起電力 ${E} [V]、内部抵抗 ${ri} [Ω] の電池に負荷抵抗を接続する。負荷抵抗の値を変化させたとき、負荷で消費される電力の最大値として、正しいものを下の番号から選べ。`, ...m,
        e: `負荷抵抗が内部抵抗に等しい(RL = r)とき最大となる(最大電力供給の定理)。Pmax = E²/(4r) = ${E}² ÷ (4 × ${ri}) = ${U(P, "W")}。` };

    const m = mcNum(r, P, [E * E / RL, E * E / (4 * ri), E * E * RL / (ri * ri + RL * RL), E * E / (ri + RL)], v => U(v, "W"));
    return { q: `起電力 ${E} [V]、内部抵抗 ${ri} [Ω] の電池に ${RL} [Ω] の負荷抵抗を接続したとき、負荷で消費される電力として、最も近いものを下の番号から選べ。`, ...m,
      e: `I = E/(r+RL) = ${E} ÷ ${ri + RL} [A]、P = I²RL = ${E}² × ${RL} ÷ ${ri + RL}² ≒ ${U(P, "W")}。` };

  thevenin(r) {
    const E = pick(r, [12, 18, 24, 30, 36, 60]), R1 = pick(r, [2, 3, 4, 6]), R2 = pick(r, [2, 3, 6, 12]), RL = pick(r, [1, 2, 3, 4]);

  reflect(r) {

      e: `入射角を θ とすると secθ = √(1 + (d/2h)²) = √(1 + (${p[0]}/600)²) = ${p[2]}。MUF = fc·secθ = ${fc} × ${p[2]} = ${U(M, "MHz")}(正割法則)。` };
  },
  critical(r) {
    const p = pick(r, [[2.5e11, 4.5], [3.6e11, 5.4], [6.4e11, 7.2], [1e12, 9], [1.44e12, 10.8], [2.25e12, 13.5], [4e12, 18]]);
    const mm = mcNum(r, p[1], [p[1] * 9, p[1] / 9, p[1] * 2, p[1] / 3], v => U(v, "MHz"));
    return { q: `電離層の最大電子密度が ${fmtN(p[0])} [個/m³] のとき、垂直入射に対する臨界周波数として最も近いものを下の番号から選べ。`, ...mm,
      e: `fc ≒ 9√N [Hz] = 9 × √(${fmtN(p[0])}) ≒ ${U(p[1], "MHz")}。臨界周波数は電子密度の平方根に比例する。` };
  },
  dbiDbd(r) {
    const g = pick(r, [3, 6, 10, 12, 15]);
    if (r() < 0.5) {
      const mm = mcNum(r, g + 2.15, [g - 2.15, g + 1.76, g * 1.64, g + 3], v => `${fmtN(v, 4)} [dBi]`);
      return { q: `相対利得が ${g} [dB] のアンテナの絶対利得として、最も近いものを下の番号から選べ。`, ...mm, e: `半波長ダイポールの絶対利得は約 2.15 [dBi](真数1.64)なので、絶対利得 = 相対利得 + 2.15 = ${fmtN(g + 2.15, 4)} [dBi]。` };
    }
    const mm = mcNum(r, g - 2.15, [g + 2.15, g - 1.76, g / 1.64, g - 3], v => `${fmtN(v, 4)} [dB]`);
    return { q: `絶対利得が ${g} [dBi] のアンテナの相対利得(半波長ダイポール基準)として、最も近いものを下の番号から選べ。`, ...mm, e: `相対利得 = 絶対利得 − 2.15 = ${fmtN(g - 2.15, 4)} [dB]。` };
  },
  lineLoss(r) {
    const Pt = pick(r, [10, 20, 50, 100]), L = pick(r, [[3, 0.5], [6, 0.25], [10, 0.1], [2, 0.631]]), a = pick(r, [0.05, 0.1, 0.2]), len = L[0] / a, P = Pt * L[1];
    const mm = mcNum(r, P, [Pt - L[0], Pt * (1 - L[1]), Pt * L[1] * 2, Pt / L[0]], v => U(v, "W"));
    return { q: `送信機出力 ${Pt} [W] を、損失 ${a} [dB/m] の給電線 ${fmtN(len)} [m] でアンテナに供給するとき、アンテナに供給される電力として最も近いものを下の番号から選べ。ただし、整合はとれているものとする。`, ...mm,
      e: `給電線損失 = ${a} × ${fmtN(len)} = ${L[0]} [dB]、真数で ${L[1]} 倍。P = ${Pt} × ${L[1]} ≒ ${U(P, "W")}。` };
  }
});

// ===== 図の描画ヘルパー(SVG) =====
const SVG = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" class="figsvg" role="img" aria-label="${label || "問題の図"}" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
const Ln = (x1, y1, x2, y2, ex) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${ex || ""}/>`;
const Tx = (x, y, s, a, sz) => `<text x="${x}" y="${y}" text-anchor="${a || "middle"}" font-size="${sz || 13}" fill="currentColor" stroke="none">${s}</text>`;
const Wr = (...p) => `<polyline points="${p.join(" ")}"/>`;
const Dot = (x, y) => `<circle cx="${x}" cy="${y}" r="2.6" fill="currentColor"/>`;
const Rh = (cx, cy, lb) => `<rect class="bg" x="${cx - 18}" y="${cy - 7}" width="36" height="14"/>` + (lb ? Tx(cx, cy - 12, lb) : "");
const Rv = (cx, cy, lb) => `<rect class="bg" x="${cx - 7}" y="${cy - 18}" width="14" height="36"/>` + (lb ? Tx(cx + 13, cy + 5, lb, "start") : "");
const Cv = (cx, cy, lb) => `<rect class="bg nost" x="${cx - 14}" y="${cy - 4}" width="28" height="8"/>` + Ln(cx - 13, cy - 4, cx + 13, cy - 4) + Ln(cx - 13, cy + 4, cx + 13, cy + 4) + (lb ? Tx(cx + 17, cy + 5, lb, "start") : "");
const Ch = (cx, cy, lb) => `<rect class="bg nost" x="${cx - 4}" y="${cy - 14}" width="8" height="28"/>` + Ln(cx - 4, cy - 13, cx - 4, cy + 13) + Ln(cx + 4, cy - 13, cx + 4, cy + 13) + (lb ? Tx(cx, cy - 18, lb) : "");
const Bat = (cx, cy, lb) => `<rect class="bg nost" x="${cx - 14}" y="${cy - 5}" width="28" height="10"/>` + Ln(cx - 13, cy - 5, cx + 13, cy - 5) + Ln(cx - 6, cy + 5, cx + 6, cy + 5, ' stroke-width="3.2"') + (lb ? Tx(cx + 18, cy + 5, lb, "start") : "");
const Src = (cx, cy, lb) => `<circle class="bg" cx="${cx}" cy="${cy}" r="13"/><path d="M${cx - 7} ${cy} q3.5 -7 7 0 t7 0"/>` + (lb ? Tx(cx - 18, cy + 5, lb, "end") : "");
const Met = (cx, cy, ch) => `<circle class="bg" cx="${cx}" cy="${cy}" r="11"/>` + Tx(cx, cy + 5, ch, "middle", 12);
const Gnd = (x, y) => Ln(x - 10, y, x + 10, y) + Ln(x - 6, y + 4, x + 6, y + 4) + Ln(x - 2, y + 8, x + 2, y + 8);
const RotR = (x1, y1, x2, y2) => { const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; return `<rect class="bg" x="${cx - 18}" y="${cy - 7}" width="36" height="14" transform="rotate(${ang.toFixed(1)} ${cx} ${cy})"/>`; };
const Box = (x, y, w, h, s, sz) => `<rect class="bg" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>` + Tx(x + w / 2, y + h / 2 + 4.5, s, "middle", sz || 12);
const Arw = (x1, y1, x2, y2) => { const a = Math.atan2(y2 - y1, x2 - x1), l = 7; return Ln(x1, y1, x2, y2) + `<path d="M${x2} ${y2} L${(x2 - l * Math.cos(a - 0.4)).toFixed(1)} ${(y2 - l * Math.sin(a - 0.4)).toFixed(1)} L${(x2 - l * Math.cos(a + 0.4)).toFixed(1)} ${(y2 - l * Math.sin(a + 0.4)).toFixed(1)} Z" fill="currentColor"/>`; };
const Dim = (x1, y1, x2, y2, lb, off) => { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2; return Arw(mx, my, x1, y1) + Arw(mx, my, x2, y2) + Tx(mx + (off ? off[0] : 0), my + (off ? off[1] : 0), lb); };
// 論理ゲート(左上 x,y、幅40・高さ40、入力は y+10 と y+30、出力は y+20)
function Gate(type, x, y) {
  const neg = /NAND|NOR|NOT/.test(type), base = type.replace("N", "").replace("XO", "XO");
  let s = "";
  if (type === "NOT") s = `<path class="bg" d="M${x} ${y + 5} L${x} ${y + 35} L${x + 32} ${y + 20} Z"/>`;
  else if (/AND/.test(type)) s = `<path class="bg" d="M${x} ${y} H${x + 20} A20 20 0 0 1 ${x + 20} ${y + 40} H${x} Z"/>`;
  else { s = `<path class="bg" d="M${x} ${y} Q${x + 28} ${y} ${x + 40} ${y + 20} Q${x + 28} ${y + 40} ${x} ${y + 40} Q${x + 12} ${y + 20} ${x} ${y} Z"/>`; if (type === "XOR") s += `<path d="M${x - 6} ${y} Q${x + 6} ${y + 20} ${x - 6} ${y + 40}"/>`; }
  const ox = type === "NOT" ? x + 32 : x + 40;
  if (neg) s += `<circle class="bg" cx="${ox + 4}" cy="${y + 20}" r="4"/>`;
  return { svg: s, out: neg ? ox + 8 : ox };
}
const GATEF = { AND: (a, b) => a & b, OR: (a, b) => a | b, NAND: (a, b) => 1 - (a & b), NOR: (a, b) => 1 - (a | b), XOR: (a, b) => a ^ b };

function mcRows(r, correct, alts, n) {

function solveRab(n, edges, a, b) {
  const G = Array.from({ length: n }, () => Array(n).fill(0));
  edges.forEach(([i, j, R]) => { const g = 1 / R; G[i][i] += g; G[j][j] += g; G[i][j] -= g; G[j][i] -= g; });

    let p = c; for (let i = c + 1; i < m; i++) if (Math.abs(M[i][c]) > Math.abs(M[p][c])) p = i;
    [M[c], M[p]] = [M[p], M[c]]; [v[c], v[p]] = [v[p], v[c]];
    for (let i = c + 1; i < m; i++) { const f = M[i][c] / M[c][c]; for (let j = c; j < m; j++) M[i][j] -= f * M[c][j]; v[i] -= f * v[c]; }

      e: half ? `半波整流電流の平均値は Im/π(Im = Vm/R)。目盛は平均値の 1.11 = π/(2√2) 倍なので、指示値 = π/(2√2) × Vm/(πR) = Vm/(2√2·R)。` : `全波整流電流の平均値は 2Im/π。指示値 = π/(2√2) × 2Vm/(πR) = Vm/(√2·R)(正弦波の実効値と同じ)。` };
  },
  pmmcPower(r) {
    const I = pick(r, [1, 2, 4]), V = pick(r, [8, 16, 24, 32]), k = I * V / 8;
    const fk = x => `${fmtN(x)}π² [W]`;
    const m = mcStr(r, fk(k), [fk(k * 2), fk(k / 2), fk(k * 4), `${I * V} [W]`, fk(k * 3)]);
    let s = Wr(30, 40, 150, 40, 150, 130, 30, 130) + Met(80, 40, "A") + Rv(150, 85, "R") + Wr(150, 50, 200, 50, 200, 120, 150, 120) + Met(200, 85, "V") + Dot(150, 50) + Dot(150, 120);
    return { q: `正弦波交流を全波整流した電流が流れている抵抗 R の消費電力を求めるため、図のように永久磁石可動コイル形の電流計 A 及び電圧計 V を接続したところ、指示値はそれぞれ ${I} [A] 及び ${V} [V] であった。R で消費される電力として正しいものを下の番号から選べ。ただし、計器の内部抵抗の影響は無視する。`, fig: SVG(230, 150, s, "計器の接続"), ...m,
      e: `可動コイル形は平均値を指示する。全波整流波の平均値は最大値の 2/π 倍なので Im = π×${I}/2、Vm = π×${V}/2。電力 P = ImVm/2 = π²×${I}×${V}/8 = ${fk(k)}。` };
  },
  fourTerm(r) {
    const R1 = pick(r, [100, 200, 300]), R2 = pick(r, [100, 200, 300]), R3 = pick(r, [100, 200, 400]);
    const A = (R1 + R3) / R3, B = R1 + R2 + R1 * R2 / R3;
    const fa = x => fmtN(x), fb = x => `${fmtN(x)} [Ω]`, fc = x => `1/${x} [S]`;
    const mm = mcRows(r, [fa(A), fb(B), fc(R3)], [[fa((R2 + R3) / R3), fa(R1 / R3), fa(A + 1)], [fb(R1 + R2), fb(R1 * R2 / R3), fb(B + R3)], [fc(R1), fc(R2), fc(R1 + R3)]]);
    let s = Wr(30, 40, 300, 40) + Wr(30, 140, 300, 140) + Rh(100, 40, `R₁=${R1}Ω`) + Rh(230, 40, `R₂=${R2}Ω`) + Wr(165, 40, 165, 140) + Rv(165, 90, `R₃=${R3}Ω`) + Dot(165, 40) + Dot(165, 140) + Term(30, 40, "") + Term(30, 140, "") + Term(300, 40, "") + Term(300, 140, "") + Tx(22, 95, "V₁", "end", 11) + Tx(308, 95, "V₂", "start", 11);
    return comboQ(`図に示す T 形回路の入出力の関係を V₁ = AV₂ + BI₂、I₁ = CV₂ + DI₂ で表すとき、四端子定数 A、B、C の値の正しい組合せを下の番号から選べ。`, ["A", "B", "C"], mm, {
      fig: SVG(330, 160, s, "T形回路"), e: `出力開放(I₂=0)で A = V₁/V₂ = (R₁+R₃)/R₃ = ${fa(A)}、C = I₁/V₂ = 1/R₃。出力短絡(V₂=0)で B = V₁/I₂ = R₁ + R₂ + R₁R₂/R₃ = ${fb(B)}。D = (R₂+R₃)/R₃。` });
  },

  // ===== 工学Aの過去問パターン =====
  fmSNI(r) {
    const mf = pick(r, [2, 3, 4, 5]), B = pick(r, [10, 15, 20, 30]), fp = pick(r, [3, 5]), X = 3 * mf * mf * B / (2 * fp), I = 10 * LOG(X);
    const m = mcNum(r, I, [10 * LOG(3 * mf * mf), 10 * LOG(3 * mf * mf * B / fp), 20 * LOG(X), I - 6], v => fdb(v, "dB"));
    return { q: `単一通信路における FM 波の S/N 改善係数 I [dB] の値として、最も近いものを下の番号から選べ。ただし、最大周波数偏移を fd、最高変調周波数を fp、等価雑音帯域幅を B とすると I = 10log₁₀{3fd²B/(2fp³)} で表せるものとし、変調指数を ${mf}、B を ${B} [kHz]、fp を ${fp} [kHz] とする。`, ...m,
      e: `fd = ${mf}fp を代入すると 3fd²B/(2fp³) = 3×${mf}²×${B}/(2×${fp}) = ${fmtN(X)}。I = 10log₁₀${fmtN(X)} ≒ ${fdb(I, "dB")}。` };
  },
  rxPower(r) {
    const G = pick(r, [30, 35, 40]), Lf = pick(r, [2, 3, 4]), L = pick(r, [130, 140, 150]), NF = pick(r, [3, 4, 6]), Bw = pick(r, [[1, 60], [10, 70]]), CN = pick(r, [50, 60, 65]);
    const N = -174 + Bw[1] + NF, C = N + CN, Pt = C + L + 2 * Lf - 2 * G;
    const m = mcNum(r, Pt, [Pt - 2 * Lf, Pt - NF, Pt - 30, Pt + 10, Pt - 10], v => fdb(v, "dBm"));
    return { q: `送受信アンテナの絶対利得が共に ${G} [dBi]、送受信の給電線損失が共に ${Lf} [dB]、伝搬路の損失が ${L} [dB] の通信回線で、受信機入力に換算した C/N を ${CN} [dB] とするために必要な送信電力として、最も近いものを下の番号から選べ。ただし、ボルツマン定数を −228.6 [dB(W/Hz/K)]、周囲温度を 290 [K](24.6 [dB(K)])、受信機の雑音指数を ${NF} [dB]、等価雑音帯域幅を ${Bw[0]} [MHz] とする。`, ...m,
      e: `受信機入力換算の雑音電力 N = −228.6 + 24.6 + ${Bw[1]} + ${NF} = ${N - 30} [dBW] = ${N} [dBm]。必要な受信電力 C = N + C/N = ${C} [dBm]。送信電力 P = C + ${L} + 2×${Lf} − 2×${G} = ${fdb(Pt, "dBm")}。` };
  },
  riseTime(r) {
    const p = pick(r, [[5, 4, 3], [10, 8, 6], [10, 6, 8], [13, 12, 5], [13, 5, 12], [25, 24, 7], [15, 12, 9], [20, 16, 12]]);
    const m = mcNum(r, p[2], [p[0] - p[1], p[0] + p[1] > 40 ? null : p[0], Math.sqrt(p[0] * p[0] + p[1] * p[1]), p[2] + 2], v => U(v, "ns"));
    return { q: `オシロスコープで、真の立上がり時間 ${p[1]} [ns] のパルス波形を観測したところ、立上がり時間は ${p[0]} [ns] と測定された。このオシロスコープ自体の立上がり時間として、最も近いものを下の番号から選べ。`, ...m,
      e: `測定値 Tm² ≒ 真値 Tr² + オシロスコープ To² の関係があるので To = √(${p[0]}² − ${p[1]}²) = ${U(p[2], "ns")}。` };
  },
  fmcw(r) {
    const fm = pick(r, [50, 100, 200]), dF = pick(r, [50, 100, 200]), h = pick(r, [60, 75, 90, 120, 150, 300]), df = 4 * fm * dF * 1e6 * h / 3e8;
    const m = mcNum(r, h, [h * 2, h / 2, h * 1.5, h * 4], v => U(v, "m"));
    return { q: `航空機の FM-CW 電波高度計で、送信波と反射波の周波数差が ${fmtN(df / 1000)} [kHz] であった。送信波は ${fm} [Hz] の三角波で変調され、${dF} [MHz] の幅で周波数が直線的に変化するとき、対地高度として最も近いものを下の番号から選べ。ただし、電波の速度は 3×10⁸ [m/s] とする。`, ...m,
      e: `周波数の変化率は ΔF ÷ (1/(2fm)) = 2fm·ΔF。往復時間 τ = 2h/c の間の周波数差は Δf = 2fm·ΔF·2h/c。h = cΔf/(4fm·ΔF) = 3×10⁸ × ${fmtN(df)} ÷ (4 × ${fm} × ${dF}×10⁶) = ${U(h, "m")}。` };
  },
  radarEq(r) {
    const f = pick(r, [3, 10]), lam = 0.3 / f, R = pick(r, [10, 20, 40]) * 1000, A = pick(r, [0.8, 1.6, 3.2]), Pt = 4 * 1e-11 * lam * lam * Math.pow(R, 4) / (A * A);
    const m = mcNum(r, R / 1000, [R / 2000, R / 1000 * 2, R / 1000 * 1.5, R / 1000 + 10], v => U(v, "km"));
    return { q: `パルスレーダーの送信尖頭出力を ${fmtN(Pt / 1000)} [kW]、物標の有効反射断面積を π [m²]、アンテナの実効面積を ${A} [m²]、送信周波数を ${f} [GHz] とし、受信電力が −80 [dBm] 以上のとき物標を探知できるとき、レーダー方程式から求めた最大探知距離として最も近いものを下の番号から選べ。ただし、送受信アンテナは同一で、利得 G と実効面積 A には G = 4πA/λ² の関係がある。`, ...m,
      e: `Pr = PtG²λ²σ/((4π)³R⁴) に G = 4πA/λ² を代入すると Pr = PtA²σ/(4πλ²R⁴)。σ = π、Pr = 10⁻¹¹ [W] として R⁴ = PtA²/(4λ²×10⁻¹¹)、R ≒ ${U(R / 1000, "km")}。` };
  },
  ofdmRate(r) {
    const N = pick(r, [48, 50, 100, 200]), M = pick(r, [[2, "QPSK"], [4, "16QAM"], [6, "64QAM"]]), Ts = pick(r, [4, 8, 2]), gi = pick(r, [[1 / 4, "1/4"], [1 / 8, "1/8"]]), cr = pick(r, [[1 / 2, "1/2"], [3 / 4, "3/4"]]);
    const R = N * M[0] * cr[0] / (Ts * (1 + gi[0]));
    const m = mcNum(r, R, [N * M[0] / (Ts * (1 + gi[0])), N * M[0] * cr[0] / Ts, N * M[0] * cr[0] / (Ts * gi[0]) / 10, R * 2], v => U(v, "Mbps"));
    return { q: `OFDM において原理的に伝送可能な情報の伝送速度の最大値として、最も近いものを下の番号から選べ。ただし、情報を伝送するサブキャリアを ${N} 個、変調方式を ${M[1]}、有効シンボル期間長を ${Ts} [μs]、ガードインターバル比を ${gi[1]}、誤り訂正の符号化率を ${cr[1]} とする。`, ...m,
      e: `1シンボル期間 = ${Ts} × (1 + ${gi[1]}) [μs]。伝送速度 = ${N} × ${M[0]} [bit] × ${cr[1]} ÷ ${fmtN(Ts * (1 + gi[0]))} [μs] = ${U(R, "Mbps")}。` };
  },
  amTwoTone(r) {
    const mp = pick(r, [[0.6, 0.8], [0.4, 0.6], [0.3, 0.4], [0.5, 0.5], [0.2, 0.4]]), Pc = pick(r, [10, 20, 22.5, 40, 50]), P = Pc * (1 + (mp[0] ** 2 + mp[1] ** 2) / 2);
    const m = mcNum(r, Pc, [P / (1 + mp[0] ** 2 + mp[1] ** 2), P / (1 + (mp[0] + mp[1]) ** 2 / 2), P / (1 + (mp[0] ** 2 + mp[1] ** 2) / 4), P], v => U(v, "kW"));
    return { q: `AM(A3E)送信機において、搬送波を二つの単一正弦波で同時に振幅変調したときの被変調波の電力が ${fmtN(P, 4)} [kW] であった。それぞれの変調度を ${pct100(mp[0])} [%] 及び ${pct100(mp[1])} [%] とするとき、搬送波電力として最も近いものを下の番号から選べ。`, ...m,
      e: `P = Pc{1 + (m₁² + m₂²)/2} より Pc = ${fmtN(P, 4)} ÷ (1 + (${mp[0]}² + ${mp[1]}²)/2) = ${U(Pc, "kW")}。` };
  },
  dopplerAngle(r) {
    const th = pick(r, [30, 60]), f = pick(r, [3, 10]), v = pick(r, [36, 72, 108, 144]), c = th === 30 ? Math.sqrt(3) / 2 : 0.5, fd = 2 * (v / 3.6) * f * 1e9 * c / 3e8;
    const m = mcNum(r, v, [v * 2, v / 2, th === 30 ? v * Math.sqrt(3) / 2 : v * 2 / Math.sqrt(3), v * 1.5], x => U(x, "km/h"));
    return { q: `周波数 ${f} [GHz] のドプラレーダーで、レーダーに近づく移動体を進行方向から ${th}° ずれた方向から測定したとき、ドプラ周波数が ${fmtN(fd)} [Hz] であった。移動体の速度として最も近いものを下の番号から選べ。ただし、電波の速度は 3×10⁸ [m/s] とする。`, ...m,
      e: `fd = 2v·f·cosθ/c より v = fd·c/(2f·cos${th}°) = ${fmtN(v / 3.6)} [m/s] = ${U(v, "km/h")}。` };
  }
});

  {k:"combo",a:5,t:"トランジスタの遮断周波数",q:"ベース接地電流増幅率 α の遮断周波数を fα、低周波での値を α₀ とすると、エミッタ接地電流増幅率 β の大きさが低周波の値の 1/√2 になる周波数 fβ は、fβ =［A］で表される。β = α/(1 − α) の関係から、f/fβ の値が［B］になるとき β は 1/√2 倍になる。したがって fβ は fα より［C］。",slots:[["fα(1 − α₀)","fα(1 + α₀)"],["1","√2"],["かなり低い","かなり高い"]],e:"α₀ ≒ 1 なので fβ は fα の (1 − α₀) 倍と非常に低い。"},
  {k:"fill",a:5,t:"ウィーンブリッジ形(ターマン)発振回路",figFn:"wien",q:"図の発振回路で、帰還回路の C と R の直列インピーダンスを Żs、並列インピーダンスを Żp とすると、帰還率は β =（ア）である。C と R を代入して整理すると β = 1/{3 + j(ωCR − 1/(ωCR))} となり、発振状態では β が実数になるので、発振周波数は f =（イ）となる。このとき β =（ウ）なので、増幅回路に必要な増幅度は（エ）である。この回路は主に（オ）の発振に適している。",ans:["Żp/(Żs+Żp)","1/(2πCR)","1/3","3","低周波"],dis:["Żs/(Żs+Żp)","1/(2π√2·CR)","1/29","29","高周波(数百MHz以上)","1"],e:"ωCR = 1 のとき β = 1/3 で位相差0。"},
  {k:"fill",a:2,t:"直交する円形コイルの合成磁界",q:"半径 r の円形コイル A 及び B を面が直交するように置き、それぞれに直流電流 I を流す。A による中心 O の磁界の強さは H_A =（ア）で、その方向は A の面に垂直である。B による磁界 H_B の方向は H_A と（イ）[rad] 異なるので、合成磁界の強さは H₀ =（ウ）となる。また、H_A と H₀ の方向は（エ）[rad] 異なる。H_A の向きは、電流の向きに右ねじを回したときにねじが（オ）向きである。",ans:["I/(2r)","π/2","I/(√2·r)","π/4","進む"],dis:["I/(2πr)","π","√2·I/(πr)","π/3","戻る","I/r"],e:"大きさの等しい直交ベクトルの合成は √2 倍、向きは 45°。"},
  {k:"fill",a:6,t:"電圧計・電流計による抵抗測定",q:"未知抵抗の両端に電圧計を接続し、その外側に電流計を接続する方法では、電流計に電圧計の電流も流れるので、V/I として求めた値は真値より（ア）なる。電圧計の内部抵抗を Rv とすると真値は Rs = V/(I −（イ）)である。電流計を未知抵抗と直列にし、その外側に電圧計を接続する方法では、真値は Rs = V/I −（ウ）(Ra:電流計の内部抵抗)となる。一般に未知抵抗が高抵抗のときは（エ）の方法が使われる。これらの方法は（オ）と呼ばれる。",ans:["小さく","V/Rv","Ra","電流計を外側に置かない(後者)","電圧降下法"],dis:["大きく","V·Rv","V/Ra","電圧計を内側に置く(前者)","置換法","Ra/V"],e:"高抵抗では電圧計の分流の影響が大きいので、電流計を抵抗と直列にする方法がよい。"},
  {k:"fill",a:3,t:"RL直列回路の過渡現象",q:"直流電圧 V の電源に、スイッチ SW を通して抵抗 R と自己インダクタンス L を直列に接続する。SW を入れた瞬間(t=0)の電流は（ア）で、十分時間が経過したときの電流は（イ）である。t 秒後の電流は i =（イ）×（ウ）で表され、t = L/R のときの電流は（イ）×（エ）となる。L/R を回路の（オ）という。",ans:["0","V/R","(1 − e^(−Rt/L))","(1 − 1/e)","時定数"],dis:["V/(2R)","e^(−Rt/L)","1/e","位相定数","V/L","e^(Lt/R)"],e:"コイルは電流の急変を妨げるので初期電流は0。"},
  {k:"fill",a:4,t:"進行波管(TWT)",q:"電子銃からの電子流はコイルで（ア）され、らせんの中心を通ってコレクタに達する。入力されたマイクロ波はらせん上を進み、らせんの（イ）に軸方向の進行波電界を作る。らせんの直径を D、ピッチを P とすると、マイクロ波の軸方向の位相速度は光速の約（ウ）倍になる。電子の速度を位相速度より少し（エ）と、マイクロ波は進むにつれて増幅される。空洞共振器などの同調回路がないので（オ）信号の増幅ができる。",ans:["集束","内部","P/(πD)","速くする","広帯域の"],dis:["発散","外部","πD/P","遅くする","狭帯域の","D/P"],e:"電波はらせん線に沿ってほぼ光速で進むので、軸方向には P/(πD) 倍に遅くなる。"},
  {k:"fill",a:6,t:"多範囲の直流電流・電圧計",q:"最大目盛 1 [mA]、内部抵抗 90 [Ω] の直流電流計に分流器 R₁ を並列にして 10 [mA] の電流計にするには R₁ =（ア）[Ω] とする。このときの電流計としての内部抵抗は（イ）[Ω] である。さらに直列に R₂ を接続して 5 [V] の電圧計とするには R₂ =（ウ）[Ω]、続けて R₃ を接続して 50 [V] の電圧計とするには R₃ =（エ）[kΩ] とする。50 [V] の電圧計の内部抵抗は（オ）[kΩ] である。",ans:["10","9","491","4.5","5"],dis:["1","81","500","5.5","50","100"],e:"R₁ = 90×1/(10−1) = 10。内部抵抗 90∥10 = 9。5V/10mA = 500 → R₂ = 491。50V/10mA = 5kΩ → R₃ = 4.5kΩ。"},
  {k:"fill",a:1,t:"誘電体を半分入れた平行平板コンデンサ",q:"電極間の半分(厚さ d)が誘電率 εr の誘電体、残り半分(厚さ d)が誘電率 ε₀ の空気である平行平板コンデンサで、電束密度を D とすると誘電体中の電界は Er =（ア）である。誘電体の層の電圧は Vr =（イ）× Er で、電極の面積を S とすると電荷は Q =（ウ）となる。したがって静電容量は C =（エ）となり、これは誘電体と空気の二つのコンデンサの（オ）接続の合成静電容量に等しい。",ans:["D/εr","d","DS","Sεrε₀/{d(εr+ε₀)}","直列"],dis:["Dεr","2d","D/S","d(εr+ε₀)/S","並列","S/D"],e:"電束密度が共通なので直列接続と同じ。"}

  {k:"fill",a:3,t:"フラクショナルN形PLLシンセサイザ",q:"整数分周形の PLL では、出力周波数のステップは（ア）に等しく、細かいステップを得るには（ア）を低くする必要があるが、ループの応答が（イ）なる。フラクショナル N 形では、分周比を N と（ウ）に周期的に切り替え、平均として小数の分周比を実現する。切替えによって生じる（エ）を抑えるため、ΔΣ 変調器などで切替えパターンを制御する。これにより、基準周波数を（オ）保ったまま細かい周波数ステップが得られる。",ans:["基準周波数","遅く","N+1","スプリアス","高く"],dis:["出力周波数","速く","2N","高調波","低く","N−1"],e:"基準周波数を高くできるのでロック時間が短く、位相雑音も抑えられる。"},

Object.assign(CALC, {
  radResLen(r) {

    const m = mcNum(r, R, [80 * Math.PI * Math.pow(he / lam, 2), 80 * Math.PI * Math.PI * he / lam, 36.5, 73.1, R * 4], v => U(v, "Ω"));
    return { q: `実効長 ${he} [m] の直線状アンテナを周波数 ${f} [MHz] で用いたとき、このアンテナの放射抵抗の値として、最も近いものを下の番号から選べ。ただし、微小ダイポールの放射電力は、長さを l [m]、波長を λ [m]、電流を I [A] とすると P = 80(πIl/λ)² [W] で表されるものとする。`, ...m,

    ["TEM 波には遮断周波数があり、それより低い周波数では伝搬しない。",0,"誤り。TEM 波には遮断周波数がない(直流から伝送できる)。"],
    ["マイクロストリップ線路の伝送モードは、ほぼ TEM 波(準 TEM 波)として扱われる。",1,"正しい。"]]},
  {k:"stmt",a:2,t:"マジックT・方向性結合器などの立体回路",s:[
    ["マジック T は、E 分岐と H 分岐を組み合わせた構造の立体回路である。",1,"正しい。"],
    ["各開口が整合しているマジック T では、E 分岐の開口からの入力は H 分岐の開口には出力されない。",1,"正しい。"],
    ["E 分岐の開口からの入力は、両側の主導波管の開口に逆相で等分に出力される。",1,"正しい。"],
    ["H 分岐の開口からの入力は、両側の主導波管の開口に逆相で出力される。",0,"誤り。H 分岐からの入力は両側に同相で出力される。"],
    ["方向性結合器は、主線路を進む進行波と反射波を分離して取り出せるので、VSWR や電力の測定に用いられる。",1,"正しい。"],
    ["サーキュレータは、フェライトを用いた非可逆素子で、送受信機でアンテナを共用する場合などに用いられる。",1,"正しい。"]]},
  {k:"stmt",a:4,t:"地上と衛星間の伝搬における対流圏・電離圏の影響",s:[
    ["電離圏を通過する電波は、ファラデー回転により偏波面が回転し、その回転角は周波数の2乗に反比例する。",1,"正しい。"],
    ["電離圏による伝搬遅延は、周波数が高いほど小さい。",1,"正しい。周波数の2乗に反比例する。"],
    ["ファラデー回転の影響は、周波数が高いほど大きくなる。",0,"誤り。周波数が低いほど大きい。"],
    ["降雨による減衰は、おおむね 10 [GHz] 以上の周波数で顕著になる。",1,"正しい。"],
    ["大気の屈折により、低仰角の電波は見かけの仰角が実際の仰角より高くなる。",1,"正しい。"],
    ["電離圏の電子密度の不規則性によるシンチレーションは、周波数が低いほど影響が大きい。",1,"正しい。"]]},
  {k:"stmt",a:5,t:"電波吸収体",s:[
    ["λ/4 形電波吸収体は、金属板から λ/4 離して抵抗皮膜を置いたもので、特定の周波数で吸収特性が良い。",1,"正しい。"],
    ["λ/4 形電波吸収体は、非常に広い周波数帯域にわたって良好な吸収特性をもつ。",0,"誤り。狭帯域である。"],
    ["フェライトなどの磁性材料を用いた電波吸収体は、比較的低い周波数で用いられる。",1,"正しい。"],
    ["誘電率の異なる材料を重ねた多層形の電波吸収体は、広帯域化に有効である。",1,"正しい。"],
    ["カーボンを含ませた発泡材料などをピラミッド形にした電波吸収体は、電波暗室の壁面に用いられる。",1,"正しい。"],
    ["電波吸収体は、入射した電波をなるべく反射させずに吸収して熱に変換する。",1,"正しい。"]]},
  {k:"stmt",a:4,t:"中波(MF)帯・短波(HF)帯の伝搬",s:[
    ["中波帯では、昼間は D 層の吸収が大きいため、主に地表波によって伝搬する。",1,"正しい。"],
    ["中波帯では、夜間は E 層で反射する空間波により遠距離まで伝搬し、地表波との干渉でフェージングを生じることがある。",1,"正しい。"],
    ["短波帯では、主に F 層での反射により遠距離通信が行われる。",1,"正しい。"],
    ["短波帯では、送信点からある距離までは地表波も空間波も届かない跳躍帯が生じることがある。",1,"正しい。"],
    ["短波帯の最高使用可能周波数(MUF)は、一般に夜間の方が昼間より高い。",0,"誤り。電子密度が高い昼間の方が MUF は高い。"],
    ["中波帯の地表波は、大地の導電率が大きいほど減衰が少ない。",1,"正しい(海上伝搬で減衰が少ない)。"]]},
  {k:"stmt",a:3,t:"平面反射板(無給電アンテナ)",s:[
    ["平面反射板は、マイクロ波中継回線で見通しのない区間の伝搬路を変えるために用いられる。",1,"正しい。"],
    ["平面反射板の実効的な面積は、反射板への入射角が大きくなるほど小さくなる。",1,"正しい(cosθ 倍)。"],
    ["反射板の大きさが同じであれば、周波数が高いほど反射板の利得は大きい。",1,"正しい。利得は面積/λ² に比例する。"],
    ["反射板の大きさが同じであれば、周波数が低いほど反射板の利得は大きい。",0,"誤り。周波数が低いほど利得は小さい。"],
    ["送受信点が反射板の遠方領域にあるときは、反射板を受信アンテナと送信アンテナの組合せとして扱い、利得を2回考慮する。",1,"正しい。"]]},
  {k:"combo",a:2,t:"方形導波管",q:"長辺 a、短辺 b の方形導波管で、TEmn モードの遮断波長は［A］である。最も遮断波長の長い TE₁₀ モードの遮断波長は［B］で、自由空間波長を λ とすると管内波長は λ/√(1 − (λ/2a)²) となる。管内を伝搬する電波の群速度は位相速度より［C］。",slots:[["2/√{(m/a)²+(n/b)²}","√{(2a/m)²+(2b/n)²}"],["2a","a"],["遅い","速い"]],e:"群速度×位相速度 = c²。群速度は c より遅く、位相速度は c より速い。"},
  {k:"combo",a:2,t:"マイクロストリップ線路",q:"マイクロストリップ線路は開放線路の一種で放射損があるため、放射損を少なくするには比誘電率の［A］誘電体基板を用いる。伝送モードは、ほぼ［B］モードとして扱うことができる。基板の比誘電率や厚さが同じとき、ストリップ導体の幅 W を広くすると特性インピーダンスは［C］なる。",slots:[["大きい","小さい"],["TEM","TE₁₀"],["小さく","大きく"]],e:"幅を広くすると単位長さ当たりの静電容量が増え、特性インピーダンスは小さくなる。"},
  {k:"combo",a:3,t:"ASR(空港監視レーダー)のアンテナ",q:"ASR のアンテナは、遠距離から近距離まで受信電力がほぼ一定になるよう、垂直面内の指向性を［A］特性としている。また、雨や雪などからの反射の影響を軽減するため、［B］が用いられることがある。水平面内のビーム幅は［C］。",slots:[["コセカント2乗","コサイン2乗"],["円偏波","水平偏波"],["鋭い","広い"]],e:"円偏波は球形の雨滴で反射すると回転方向が逆になり、受信されにくい。"},
  {k:"combo",a:1,t:"電波の偏波",q:"電波の進行方向に垂直な面内で、互いに直交する電界成分の位相差が 0 又は［A］[rad] の電波は直線偏波である。位相差が［B］[rad] で振幅が等しい電波は円偏波であり、振幅が異なると楕円偏波となる。楕円偏波の長軸と短軸の比を［C］という。",slots:[["π","π/2"],["π/2","π"],["軸比","偏波面"]],e:"直線偏波:位相差0またはπ。円偏波:位相差π/2・振幅が等しい。"},
  {k:"combo",a:3,t:"誘電体レンズ",q:"誘電体レンズでは、誘電体中の電波の位相速度が自由空間より［A］ことを利用して、球面波を平面波に変換する。波源側から見て［B］レンズの形となる。重量や誘電損を減らすため、厚さを帯状に削るゾーニングを行い、その厚さは誘電体の屈折率を n として［C］とする。",slots:[["遅い","速い"],["凸","凹"],["λ/(n−1)","λ/n"]],e:"中心部(厚い部分)を通る電波を遅らせて波面をそろえる。"},
  {k:"combo",a:3,t:"フェーズドアレーアンテナ",q:"素子間隔 d の位相走査形フェーズドアレーアンテナで、ビームを正面から角度 θ だけ傾けるには、隣り合う素子の励振位相差を［A］とする。デジタル移相器を用いると量子化位相誤差が生じ、サイドローブが［B］。また、素子間隔が波長に比べて大きすぎると［C］が発生しやすい。",slots:[["2πd·sinθ/λ","2πd·cosθ/λ"],["増加する","減少する"],["グレーティングローブ","バックローブ"]],e:"量子化位相誤差は周期的な誤差となり、不要なローブを生じる。"},
  {k:"combo",a:4,t:"太陽フレアの影響",q:"太陽フレアが発生すると、放射される［A］により［B］層の電子密度が急増し、太陽に照らされた地域で短波通信が突然途絶するデリンジャ現象が起こる。また、フレアに伴う高エネルギー粒子によって、極地方で電波が吸収される［C］が生じることがある。",slots:[["X線","赤外線"],["D","F"],["極冠じょう乱(PCA)","スポラジックE層"]],e:"デリンジャ現象は数十分〜数時間、PCA は数日続くことがある。"},
  {k:"combo",a:5,t:"ハイトパターンの測定",q:"送信条件と距離を一定にして受信アンテナの高さを変えると、直接波と大地反射波の干渉により電界強度は極大と極小を繰り返す。大地の反射係数を −1 とすると、送信アンテナの高さを h₁、距離を d とすれば極大点の間隔は［A］となる。受信アンテナの高さが 0 に近いとき電界強度は［B］となる。このパターンは［C］の周波数で利用される。",slots:[["λd/(2h₁)","λd/h₁"],["極小","極大"],["超短波(VHF)以上","中波"]],e:"E ∝ |sin(2πh₁h₂/(λd))| より h₂ が λd/(2h₁) 変わるごとに極大。"},
  {k:"combo",a:5,t:"開口面アンテナの放射電磁界の領域",q:"開口面アンテナの周囲の空間は、アンテナに近い順にリアクティブ近傍界領域、放射近傍界領域(［A］領域)、放射遠方界領域(［B］領域)に分けられる。開口径を D とすると、遠方界領域は一般に距離［C］以上とされる。",slots:[["フレネル","フラウンホーファ"],["フラウンホーファ","フレネル"],["2D²/λ","D²/λ"]],e:"遠方界では指向性パターンが距離によらず一定になる。"},
  {k:"fill",a:1,t:"マクスウェルの方程式",q:"電流の周りの磁界に関する（ア）の法則を拡張し、伝導電流に（イ）電流を加えたものが、rot H = J + ∂D/∂t である。電磁誘導の法則は rot E = −（ウ）で表される。これらから電磁波の存在が導かれ、自由空間の固有インピーダンスは √(μ₀/ε₀) ≒（エ）[Ω]、伝搬速度は（オ）で表される。",ans:["アンペア","変位","∂B/∂t","120π","1/√(εμ)"],dis:["ファラデー","伝導","∂D/∂t","60π","√(εμ)","ガウス"],e:"変位電流の導入により、電界の変化が磁界を生じることが示される。"},
  {k:"fill",a:5,t:"定在波測定による給電点インピーダンス",q:"無損失給電線上の電圧定在波は（ア）ごとに同じ分布を繰り返す。電圧波節点から負荷側を見たインピーダンスは（イ）の（ウ）である(Z₀:特性インピーダンス、S:電圧定在波比)。電圧波腹点では（エ）となる。負荷から最初の電圧波節点までの距離と S を測定すれば、（オ）を求めることができる。",ans:["λ/2","Z₀/S","純抵抗","Z₀·S","負荷インピーダンス"],dis:["λ/4","Z₀·S²","純リアクタンス","Z₀/S²","反射電力","λ"],e:"波節・波腹点では電圧と電流が同相となり、インピーダンスは純抵抗になる。"},
  {k:"fill",a:4,t:"SHF帯・EHF帯の伝搬",q:"おおむね 10 [GHz] 以上では（ア）による減衰が大きくなる。雨滴は扁平な形をしているため、（イ）偏波の方が減衰が大きい。また、22 [GHz] 付近には（ウ）による吸収が、60 [GHz] 付近には（エ）による吸収がある。大気による吸収の少ない周波数帯を（オ）という。",ans:["降雨","水平","水蒸気","酸素","電波の窓"],dis:["霧","垂直","窒素","二酸化炭素","ダクト","臨界周波数"],e:"降雨減衰は周波数が高いほど、降雨強度が大きいほど大きい。"},
  {k:"fill",a:5,t:"電磁界の遮へい(シールド)",q:"静電界を遮へいするには、（ア）した導体で囲む。低い周波数の磁界の遮へいには（イ）の材料を用い、磁束を遮へい材の中に通して迂回させる。高い周波数の電磁界の遮へいには導電率の高い材料を用い、（ウ）による反射と吸収を利用する。導体内の電磁界は（エ）によって減衰するので、（オ）が表皮厚さより十分大きいほど遮へい効果が大きい。",ans:["接地","高透磁率","うず電流","表皮効果","板厚"],dis:["絶縁","低透磁率","変位電流","ホール効果","面積","誘電損"],e:"表皮厚さは周波数の平方根に反比例する。"}
);

  {k:"combo",a:1,t:"総務大臣の登録を受けて開設する無線局",q:"電波を発射しようとする場合に同じ周波数の電波を受信して一定時間自己の電波を発射しない機能をもつ無線局その他［A］を同じくする他の無線局の運用を阻害するような混信を与えないように運用できる無線局のうち総務省令で定めるものであって、適合表示無線設備のみを使用するものを、総務省令で定める［B］開設しようとする者は、総務大臣の登録を受けなければならない。登録の申請書には、氏名又は名称及び住所、無線設備の規格、［C］、周波数及び空中線電力を記載する。",slots:[["無線設備の規格(総務省令で定めるものに限る。)","使用する電波の型式"],["区域内に","期間内に"],["無線設備の設置場所","運用開始の予定期日"]],e:"電波法第27条の21。登録局は免許を要しない。"},
  {k:"combo",a:1,t:"無線局に関する情報の提供",q:"総務大臣は、自己の無線局の開設又は周波数の変更をする場合などに必要とされる［A］に関する調査又は特定基地局の開設指針に規定する［B］を行おうとする者の求めに応じ、必要な限度において、無線局の［C］その他の無線局に関する事項に係る情報であって総務省令で定めるものを提供することができる。",slots:[["混信若しくはふくそう","電波の利用状況"],["終了促進措置","特定周波数終了対策業務"],["無線設備の工事設計","免許の有効期間"]],e:"電波法第25条第2項。"},
  {k:"combo",a:2,t:"人工衛星局の位置の維持",q:"対地静止衛星に開設する人工衛星局(［A］を除く。)であって、［B］の無線通信の中継を行うものは、公称されている位置から経度の(±)0.1度以内にその位置を維持できなければならない。一般公衆によって直接受信されるための無線電話、テレビジョン、［C］又はファクシミリによる無線通信業務を行う人工衛星局は、緯度及び経度のそれぞれ(±)0.1度以内に維持できなければならない。これら以外の人工衛星局は、公称されている位置から［D］以内に維持できなければならない。",slots:[["実験試験局","実用化試験局"],["固定地点の地球局相互間","固定地点の地球局と移動する地球局の間"],["データ伝送","データ放送"],["経度の(±)0.5度","緯度の(±)0.5度"]],e:"電波法施行規則第32条の4。"},
  {k:"combo",a:2,t:"電波の強度に対する安全施設",q:"無線設備には、発射される電波の強度が基準値を超える場所(人が通常、集合し、通行し、その他出入りする場所に限る。)に［A］のほか容易に出入りできないように施設をしなければならない。ただし、平均電力が［B］の無線局、［C］、非常の事態の発生時などに［D］無線局などの無線設備については、この限りでない。",slots:[["取扱者","無線従事者"],["20ミリワット以下","30ミリワット以下"],["移動する無線局","移動業務の無線局"],["臨時に開設する","総務大臣の認定を受けた"]],e:"電波法施行規則第21条の3。"},

function qid(q) {
  const str = [q.q, q.body || "", (q.stmts || []).map(x => x.t).join("|"), (q.items || []).map(x => x.t).join("|"), (q.choices || []).join("|"), (q.rows || []).map(r => r.join("/")).join("|"), (q.options || []).join("|"), JSON.stringify(q.ans)].join("#");
  let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
const tkey = q => q.p + "|" + q.t;
function recordMany(s, list) {
  const d = jget(SKEY), su = sUnit(d, s), now = Date.now();
  for (const { q, score } of list) {
    const st = su.stats[tkey(q)] || (su.stats[tkey(q)] = { a: 0, c: 0 }); st.a++; st.c += score / 5; st.at = now;
    if (score < 5) { const id = qid(q); su.wrong = su.wrong.filter(w => w.id !== id); su.wrong.push({ id, q, at: now }); }
  }
  if (su.wrong.length > 300) su.wrong = su.wrong.slice(-300);
  jset(SKEY, d);
}
function clearWrong(s, id) { const d = jget(SKEY), su = sUnit(d, s); su.wrong = su.wrong.filter(w => w.id !== id); jset(SKEY, d); }
const isMarked = (s, q) => { const id = qid(q); return sUnit(jget(SKEY), s).marks.some(m => m.id === id); };
function toggleMark(s, q) { const d = jget(SKEY), su = sUnit(d, s), id = qid(q), i = su.marks.findIndex(m => m.id === id); if (i >= 0) su.marks.splice(i, 1); else su.marks.push({ id, q, at: Date.now() }); jset(SKEY, d); }
function removeMark(s, id) { const d = jget(SKEY), su = sUnit(d, s); su.marks = su.marks.filter(m => m.id !== id); jset(SKEY, d); }
function analysis(s) {
  const Sb = SUBJ[s], su = sUnit(jget(SKEY), s);
  const topics = Sb.pool().map(it => { const st = su.stats[it.a + "|" + it.t] || { a: 0, c: 0 }; return { p: String(it.a), t: it.t, a: st.a, c: st.c, acc: (st.c + 1) / (st.a + 2), item: it }; });
  const parts = Object.keys(Sb.areas).map(p => { const ts = topics.filter(x => x.p === p); const a = ts.reduce((t, x) => t + x.a, 0), c = ts.reduce((t, x) => t + x.c, 0); return { p, a, c, rate: a ? c / a : null }; });
  const a = parts.reduce((t, x) => t + x.a, 0), c = parts.reduce((t, x) => t + x.c, 0), avg = a ? c / a : 0;

  return { topics, parts, a, c, avg, weak: rated.filter(x => x.rate < avg).slice(0, 2).map(x => x.p), weakest: rated.length ? rated[0].p : null };
}

// ---------- 試験 ----------

// ---------- ドリル・復習・ブックマーク・苦手 ----------
const DTITLE = { drill: "分野別ドリル", focus: "苦手分野の重点練習", review: "間違えた問題の復習", marks: "ブックマークの問題" };
function startDrill(s, mode) { S = { view: "drill", dr: { s, mode: mode || "drill", parts: Object.keys(SUBJ[s].areas), q: null, sel: null, done: false, c: 0, n: 0, last: null, queue: [], lastId: null, cleared: 0 } }; nextDrill(); render(true); }
function wpick(items, ws) { const tot = ws.reduce((a, b) => a + b, 0); let x = Math.random() * tot; for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; } return items[items.length - 1]; }
function nextDrill() {
  const d = S.dr, Sb = SUBJ[d.s], seed = () => rngFrom(Math.floor(Math.random() * 2147483647));
  d.done = false;
  if (d.mode === "review" || d.mode === "marks") {
    const su = sUnit(jget(SKEY), d.s), list = d.mode === "review" ? su.wrong : su.marks;
    if (!list.length) { d.q = null; return; }
    d.queue = d.queue.filter(id => list.some(x => x.id === id));
    if (!d.queue.length) d.queue = shuffle(seed(), list.map(x => x.id));
    let id = d.queue.shift(); if (id === d.lastId && d.queue.length) { d.queue.push(id); id = d.queue.shift(); }
    d.lastId = id; d.q = list.find(x => x.id === id).q;

    else { const pool = Sb.pool().filter(x => d.parts.includes(String(x.a))); if (!pool.length) { d.q = null; return; } let g = 0; do { it = pool[Math.floor(Math.random() * pool.length)]; g++; } while (pool.length > 1 && it === d.last && g < 10); }
    d.last = it; d.q = buildOne(it, seed(), d.s);
  }
  d.sel = d.q && d.q.kind === "B" ? [null, null, null, null, null] : null;
}
function topBar(s, act) {

    <div class="seg" role="group" aria-label="科目">${SUBJ_ORDER.filter(x => SUBJ[x].ready).map(x => `<button class="segbtn" data-act="${act}" data-s="${x}" aria-pressed="${x === s}">${SUBJ[x].short}</button>`).join("")}</div></div>`;
}

}

  ${an.a ? `<section class="score-card"><p class="rs-title">これまでの得点率(${Sb.name})</p><p class="score"><b>${pct(an.avg)}</b><span>%</span></p><p class="meta">解いた問題 ${an.a}問(模擬試験・ドリル・復習の合計。B問題は部分点を反映)</p>
    <div class="row"><button class="btn primary" data-act="focus" data-s="${s}">苦手分野を重点練習</button></div></section>
  <section class="breakdown"><h2>分野別の得点率</h2>${an.parts.map(x => `<div class="bd"><span class="bd-n">${esc(Sb.areas[x.p])}${an.weak.includes(x.p) ? `<span class="tag">苦手</span>` : ""}</span><span class="bd-bar" aria-hidden="true"><i style="width:${x.a ? x.c / x.a * 100 : 0}%"></i></span><span class="bd-v">${x.a ? pct(x.c / x.a) + "%" : "—"}<small>${x.a ? `${x.a}問` : "未解答"}</small></span></div>`).join("")}</section>
  <section class="breakdown"><h2>特に苦手なテーマ</h2>${topics.length ? topics.map(x => `<div class="bd"><span class="bd-n"><small class="pn">${esc(Sb.areas[x.p])}</small>${esc(x.t)}</span><span class="bd-bar" aria-hidden="true"><i style="width:${x.c / x.a * 100}%"></i></span><span class="bd-v">${pct(x.c / x.a)}%<small>${x.a}回</small></span></div>`).join("") : `<p class="small">2回以上解いたテーマがまだありません。もう少し解くと表示されます。</p>`}</section>
  <p class="small">解いた数が少ないテーマは控えめに評価しています。重点練習では、得点率の低いテーマと、まだ解いていないテーマが多めに出ます。</p>
  <div class="row"><button class="btn ghost" data-act="wreset">${S.wk.arm ? "もう一度押すと分析の記録をリセットします" : "分析の記録をリセット"}</button></div>`
  : `<p class="card">まだデータがありません。模擬試験やドリルを解くと、分野別の得点率と苦手なテーマが表示されます。</p><div class="row"><button class="btn primary" data-act="focus" data-s="${s}">重点練習を始める</button></div>`}
</div>`;
}

// ---------- 描画・イベント ----------
function render(top) {
  const open = top ? [] : [...document.querySelectorAll("details[data-k][open]")].map(x => x.dataset.k);
  const v = S.view;
  $app.innerHTML = v === "exam" ? exam() : v === "result" ? result() : v === "drill" ? drill() : v === "marks" ? marks() : v === "weak" ? weak() : v === "subj" ? subj() : home();
  open.forEach(k => { const el = $app.querySelector(`details[data-k="${k}"]`); if (el) el.open = true; });
  if (top) window.scrollTo(0, 0);
}
function setB(arr, j, i) { const a = (arr || [null, null, null, null, null]).slice(); a[j] = i; return a; }
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act; if (act === "close" && e.target !== b) return;
  const ex = S.ex, d = S.dr;
  switch (act) {
    case "home": clearInterval(tick); S = { view: "home" }; render(true); break;
    case "subj": clearInterval(tick); S = { view: "subj", sb: { s: b.dataset.s } }; render(true); break;
    case "soon": break;
    case "start": startExam(b.dataset.s, b.dataset.set); break;
    case "drill": startDrill(b.dataset.s, "drill"); break;
    case "review": startDrill(b.dataset.s, "review"); break;
    case "focus": startDrill(b.dataset.s, "focus"); break;
    case "mpractice": startDrill(b.dataset.s, "marks"); break;
    case "marks": S = { view: "marks", mk: { s: b.dataset.s } }; render(true); break;
    case "weak": S = { view: "weak", wk: { s: b.dataset.s, arm: false } }; render(true); break;
    case "vunit": if (S.view === "marks") S.mk.s = b.dataset.s; else { S.wk.s = b.dataset.s; S.wk.arm = false; } render(); break;
    case "wreset": if (S.wk.arm) { const dd = jget(SKEY); sUnit(dd, S.wk.s).stats = {}; jset(SKEY, dd); S.wk.arm = false; } else S.wk.arm = true; render(); break;
    case "pick": ex.a[ex.cur] = +b.dataset.i; render(); break;
    case "bpick": ex.a[ex.cur] = setB(ex.a[ex.cur], +b.dataset.j, +b.dataset.i); render(); break;
    case "prev": if (ex.cur > 0) { ex.cur--; render(true); } break;
    case "next": if (ex.cur < ex.qs.length - 1) { ex.cur++; render(true); } break;
    case "flag": ex.fl[ex.cur] = !ex.fl[ex.cur]; render(); break;
    case "sheet": ex.sheet = b.dataset.v; ex.quitArm = false; render(); break;
    case "close": ex.sheet = null; ex.quitArm = false; render(); break;
    case "jump": ex.cur = +b.dataset.i; ex.sheet = null; render(true); break;
    case "finish": finish(false); break;
    case "quit": if (ex.quitArm) { const s = ex.s; clearInterval(tick); S = { view: "subj", sb: { s } }; render(true); } else { ex.quitArm = true; render(); } break;
    case "mark": { const src = b.dataset.src; const s = src === "exam" ? ex.s : src === "rs" ? S.rs.s : d.s; const q = src === "exam" ? ex.qs[ex.cur] : src === "rs" ? S.rs.qs[+b.dataset.i] : d.q; toggleMark(s, q); render(); break; }
    case "unmark": removeMark(S.mk.s, b.dataset.id); render(); break;
    case "dpick": if (d.done) break; d.sel = +b.dataset.i; gradeDrill(); render(); break;
    case "dbpick": if (d.done) break; d.sel = setB(d.sel, +b.dataset.j, +b.dataset.i); render(); break;
    case "dcheck": if (!d.done) { gradeDrill(); render(); } break;
    case "dnext": nextDrill(); render(true); break;
    case "dunit": if (b.dataset.s !== d.s) startDrill(b.dataset.s, d.mode); break;
    case "dpart": { const p = b.dataset.p; d.parts = d.parts.includes(p) ? d.parts.filter(x => x !== p) : [...d.parts, p]; nextDrill(); render(); break; }
  }
});
$app.addEventListener("change", e => { if (e.target.id === "onlywrong") { S.rs.onlyWrong = e.target.checked; render(); } });
document.addEventListener("keydown", e => {
  if (S.view !== "exam" || e.altKey || e.ctrlKey || e.metaKey) return;
  const ex = S.ex;
  if (e.key === "Escape" && ex.sheet) { ex.sheet = null; render(); return; }
  if (ex.sheet) return;
  if (e.key === "ArrowRight" && ex.cur < ex.qs.length - 1) { ex.cur++; render(true); }
  else if (e.key === "ArrowLeft" && ex.cur > 0) { ex.cur--; render(true); }
  else { const q = ex.qs[ex.cur], i = "12345".indexOf(e.key); if (q.kind === "A" && i >= 0 && i < SUBJ[ex.s].opt) { ex.a[ex.cur] = i; render(); } }
});
render();

</script>

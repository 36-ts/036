<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>共通テスト模試</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF0F4;--paper:#FFFFFF;--ink:#1D2129;--muted:#5B6270;--line:#CED3DC;
  --sheet:#B0306A;--sheet-soft:#F7E6EE;--lead:#2E3138;--math:#34418F;--ok:#1F6E52;--ng:#B42318}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14161B;--paper:#1C1F26;--ink:#E6E8EC;--muted:#A2A9B5;--line:#343A45;--sheet:#E07FAA;--sheet-soft:#3A2230;--lead:#E6E8EC;--math:#9FA9EA;--ok:#7FD1AE;--ng:#F2A39A}}
:root[data-theme="dark"]{--bg:#14161B;--paper:#1C1F26;--ink:#E6E8EC;--muted:#A2A9B5;--line:#343A45;--sheet:#E07FAA;--sheet-soft:#3A2230;--lead:#E6E8EC;--math:#9FA9EA;--ok:#7FD1AE;--ng:#F2A39A}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0} button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--math);outline-offset:2px}
.btn{appearance:none;font-weight:700;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:.5em 1.1em;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--math)} .btn.primary{background:var(--math);border-color:var(--math);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#14161B}}
.btn.sm{min-height:38px;padding:.3em .8em;font-size:.9rem} .btn.ghost{background:transparent;color:var(--muted);border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px} .small{font-size:.85rem;color:var(--muted);margin-top:8px}
/* home */
.home,.page{max-width:920px;margin:0 auto;padding:28px 18px 56px}
.mast{padding:26px 22px;background:var(--paper);border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;right:-18px;top:18px;width:140px;height:120px;background:radial-gradient(ellipse 9px 13px at center,var(--sheet) 96%,transparent 100%) 0 0/28px 34px;opacity:.13;pointer-events:none}
.mast-sub{color:var(--muted);font-weight:700;font-size:.92rem}
.mast h1{font-family:"BIZ UDPMincho",serif;font-size:clamp(2rem,6vw,2.8rem);letter-spacing:.08em;margin:.1em 0 .4em;font-weight:700}
.lead{max-width:38em;color:var(--muted)}
.subjects{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
@media (min-width:640px){.subjects{grid-template-columns:1fr 1fr}}
.scard{appearance:none;text-align:left;display:grid;gap:2px;padding:14px 18px;background:var(--paper);border:1px solid var(--line);border-radius:8px;cursor:pointer;min-height:96px}
.scard:hover{border-color:var(--math)} .scard.soon{cursor:default;opacity:.6}
.sc-name{font-size:1.3rem;font-weight:700} .sc-spec{font-size:.86rem;color:var(--muted)} .sc-stat{font-size:.9rem;font-weight:700;color:var(--math);margin-top:4px}
.note{margin-top:26px;font-size:.85rem;color:var(--muted)}
.shead{margin:14px 0;padding:18px 20px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.shead h1{font-family:"BIZ UDPMincho",serif;font-size:1.9rem;letter-spacing:.06em} .shead p{color:var(--muted);font-size:.9rem;margin-top:6px}
.panel{margin-top:12px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:8px} .ph{font-weight:700;margin-bottom:10px}
.sets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px} @media (min-width:520px){.sets{grid-template-columns:repeat(10,1fr)}}
.set{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:6px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-variant-numeric:tabular-nums}
.set .n{font-weight:700} .set .b{font-size:.7rem;color:var(--muted);min-height:1.2em} .set.tried{border:2px solid var(--math)} .set:hover{border-color:var(--math)}
/* exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px}
.chip{font-weight:700;background:var(--math);color:#fff;padding:.1em .6em;border-radius:4px;font-size:.9rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{color:#14161B}}
.timer{margin-left:auto;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums} .timer.low{color:var(--ng)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.tab{appearance:none;flex:1 1 11%;min-width:40px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:.2em 0;font-weight:700;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tab.opt{border-style:dashed} .tab.picked small{color:var(--math);font-weight:700}
.pickbar{font-family:"BIZ UDPGothic",sans-serif;border:1.5px dashed var(--line);border-radius:6px;padding:10px 12px;margin:0 0 12px;display:grid;gap:8px;font-size:.92rem} .pickbar.on{border:1.5px solid var(--math)} .pickbar .warn{color:var(--ng);font-weight:700}
.bd-r.skip{color:var(--muted)}
.tab small{font-weight:400;color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums} .tab.cur{border:2px solid var(--math);color:var(--math)}
.booklet{max-width:44rem;margin:0 auto;padding:18px 16px 60px;font-family:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif}
.booklet.in{padding:6px 2px 10px}
.dm-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:6px}
.dm-head h2{font-size:1.35rem;letter-spacing:.08em} .dm-pts{color:var(--muted);font-family:"BIZ UDPGothic",sans-serif;font-size:.9rem}
.part{margin-top:18px} .part-h{font-size:1.05rem;margin-bottom:4px}
.q{line-height:2.05;margin:.6em 0;text-indent:1em}
.bx{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:1.7em;height:1.75em;border:1.5px solid var(--ink);margin:0 1px;vertical-align:-.45em;position:relative;font-family:"BIZ UDPGothic",sans-serif;line-height:1;text-indent:0;background:var(--paper)}
.bx i{font-style:normal;font-size:.8em} .bx b{display:none}
.bx.on i,.bx.ok i,.bx.ng i{position:absolute;top:-1.15em;font-size:.62em;color:var(--muted)} .bx.on b,.bx.ok b,.bx.ng b{display:block;font-size:.95em}
.bx.on{border-color:var(--lead);background:var(--sheet-soft)} .bx.ok{border-color:var(--ok);color:var(--ok)} .bx.ng{border-color:var(--ng);color:var(--ng)} .bx.plain{vertical-align:-.3em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;text-indent:0;line-height:1.5}
.fr .nu{border-bottom:1.2px solid currentColor;padding:0 .2em .1em} .fr .de{padding:.1em .2em 0}
.rt{white-space:nowrap} .rt .ov{border-top:1.2px solid currentColor;padding:0 .1em;margin-left:.05em}
.tbl{overflow-x:auto;margin:.6em 0} .tbl table{border-collapse:collapse;font-family:"BIZ UDPGothic",sans-serif;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 9px;text-align:center;white-space:nowrap} .tbl thead th{background:var(--bg)} .tbl tbody th{background:var(--bg);font-weight:700}
.choices{margin:.4em 0 .8em 1em;padding:.5em .8em;border:1px solid var(--line);border-radius:4px}
.ch-h{font-family:"BIZ UDPGothic",sans-serif;font-size:.9rem;margin-bottom:4px} .choices ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.choices li{display:grid;grid-template-columns:1.6em 1fr} .cn{font-family:"BIZ UDPGothic",sans-serif}
/* マークシート */
.sheet-strip{margin:12px -6px 4px;padding:8px 6px 6px;border:1.5px solid var(--sheet);border-radius:6px;background:var(--paper);font-family:"BIZ UDPGothic",sans-serif}
.mrow{display:grid;grid-template-columns:1.6em 1fr;align-items:center;gap:4px;padding:3px 0;border-bottom:1px dashed color-mix(in srgb,var(--sheet) 35%,transparent)}
.mrow:last-child{border-bottom:0}
.msym{font-weight:700;color:var(--sheet);text-align:center}
.marks{display:flex;gap:2px;flex-wrap:wrap}
.mk{appearance:none;border:0;background:none;padding:0;width:23px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mk span{display:flex;align-items:center;justify-content:center;width:19px;height:29px;border:1.4px solid var(--sheet);border-radius:50%;color:var(--sheet);font-size:.78rem;font-weight:700;transition:background .12s}
.mk:hover span{background:var(--sheet-soft)}
.mk.on span{background:var(--lead);border-color:var(--lead);color:var(--paper)}
.mk.right span{outline:2px solid var(--ok);outline-offset:1px} .mk.right.on span{background:var(--ok);border-color:var(--ok)}
.mk.miss span{background:var(--ng);border-color:var(--ng);color:#fff} .mk:disabled{cursor:default}
.nav{justify-content:space-between;font-family:"BIZ UDPGothic",sans-serif}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,18,24,.55);display:flex;align-items:flex-end;justify-content:center}
.dialog{background:var(--paper);width:100%;max-width:34rem;border-radius:10px 10px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
@media (min-width:640px){.overlay{align-items:center}.dialog{border-radius:10px}} .dialog h2{font-size:1.1rem}
/* 結果 */
.result{max-width:46rem;margin:0 auto;padding:22px 16px 56px}
.score-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px}
.rs-t{color:var(--muted);font-weight:700} .score b{font-size:3.6rem;font-family:"BIZ UDPMincho",serif;line-height:1.1} .score span{color:var(--muted)}
.gifu{font-weight:700} .gifu b{color:var(--math);font-size:1.3rem} .meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.bd{margin-top:12px} .bd-r{display:grid;grid-template-columns:4.5em 1fr 4.5em;gap:10px;align-items:center;padding:4px 0;font-size:.92rem;font-variant-numeric:tabular-nums} .bd-r span:last-child{text-align:right;font-weight:700}
.bar-o{height:8px;background:var(--line);border-radius:4px;overflow:hidden} .bar-o i{display:block;height:100%;background:var(--math)}
.review{margin-top:24px} .review h2{font-size:1.1rem;margin-bottom:8px}
.rv{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin:8px 0}
.rv summary{padding:12px 14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px} .rv summary span{color:var(--math);white-space:nowrap}
.rv[open] summary{border-bottom:1px solid var(--line)} .rv .booklet{padding:6px 14px 14px}
.expl{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:6px;font-family:"BIZ UDPGothic",sans-serif;font-size:.92rem;display:grid;gap:6px}
.ex-score{font-weight:700}
table.ans{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums} table.ans th,table.ans td{border:1px solid var(--line);padding:2px 8px;text-align:center}
table.ans tr.ok td{color:var(--ok)} table.ans tr.ng td{color:var(--ng)}
.code{font-family:"BIZ UDPGothic",ui-monospace,monospace;font-size:.88rem;line-height:2.1;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.code .bx{vertical-align:-.5em}
.figw{margin:.6em 0;text-align:center} .figw .fig{width:100%;max-width:360px;height:auto;color:var(--ink)}
.booklet.en{font-family:Georgia,"Times New Roman","BIZ UDPMincho",serif}
.booklet.en .q{text-indent:0;line-height:1.85}
.doc{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:.8em 0;background:var(--paper);line-height:1.75}
.doc h4{margin:0 0 .4em;font-size:1.02rem} .doc p{margin:.35em 0}
.booklet.en .choices li{grid-template-columns:1.8em 1fr}
.audio{margin:.5em 0 .8em;font-family:"BIZ UDPGothic",sans-serif}
.audio .btn{min-height:42px} .script{margin-top:6px;font-size:.9rem;background:var(--bg);border-radius:6px;padding:6px 10px} .script p{margin:.2em 0}
u.bs{text-decoration-thickness:1.5px;text-underline-offset:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<script>
// ===== 共通ユーティリティ =====
function rngFrom(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
const randInt = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
function shuffle(r, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => a / gcd(a, b) * b;
// 有理数 [分子, 分母]
const F = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; };
const Fadd = (a, b) => F(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
const Fsub = (a, b) => F(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
const Fmul = (a, b) => F(a[0] * b[0], a[1] * b[1]);
const Fdiv = (a, b) => F(a[0] * b[1], a[1] * b[0]);
const Fstr = f => f[1] === 1 ? `${f[0]}` : `${f[0]}/${f[1]}`;
// 平方因子の分離 n = k²·m
function sqf(n) { let k = 1, m = n; for (let i = 2; i * i <= m; i++) while (m % (i * i) === 0) { m /= i * i; k *= i; } return [k, m]; }
// (num/den)·√root を p√q/d に正規化
function rad(num, den, root) { const [k, m] = sqf(root); let p = num * k, d = den; const g = gcd(p, d); p /= g; d /= g; if (d < 0) { p = -p; d = -d; } return { p, q: m, d }; }
const radStr = v => `${v.q === 1 ? v.p : (v.p === 1 ? "" : v.p === -1 ? "−" : v.p) + "√" + v.q}${v.d === 1 ? "" : "/" + v.d}`.replace("-", "−");
const mstr = s => String(s).replace(/-/g, "−");
const fixSign = s => String(s).replace(/＋ [-−](\d)/g, "− $1").replace(/− [-−](\d)/g, "＋ $1").replace(/·-(\d+)/g, "·(−$1)").replace(/(^|[^\w\[])-(\d)/g, "$1−$2");

// ===== 大問の組み立て =====
const SYMS = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワ";
const PUA = Array.from({ length: 120 }, (_, i) => String.fromCharCode(0xE001 + i)).join("");
const SL = s => { const c = s.charCodeAt(0); return c >= 0xE000 && c < 0xF000 ? String(c - 0xE000) : s; };
class Daimon {
  constructor(no, pts, start, sy) { this.no = no; this.pts = pts; this.i = start || 0; this.SY = sy || SYMS; this.blocks = []; this.groups = []; this.parts = []; this.pending = []; }
  _box(v, acc) { const c = mstr(v).split(""); const s = this.SY.slice(this.i, this.i + c.length); this.i += c.length; acc.syms += s; acc.ans.push(...c); return `［${s}］`; }
  _push(acc, pts, kind, opts) { this.groups.push({ syms: acc.syms, ans: acc.ans, pts, kind, opts, part: this.parts.length - 1 }); }
  part(label, title, pts) { this.parts.push({ label, title, pts, ex: [] }); this.blocks.push({ t: "h", label, title, part: this.parts.length - 1 }); }
  p(s) { this.blocks.push({ t: "p", s: fixSign(s), part: this.parts.length - 1 }); this.blocks.push(...this.pending); this.pending = []; }
  table(head, rows) { this.blocks.push({ t: "tb", head, rows, part: this.parts.length - 1 }); }
  ex(s) { this.parts[this.parts.length - 1].ex.push(fixSign(s)); }
  // 数値(複数可)を一つの採点グループにする
  num(vals, pts) { const acc = { syms: "", ans: [] }; const out = [].concat(vals).map(v => this._box(v, acc)); this._push(acc, pts, "num"); return out.length === 1 ? out[0] : out; }
  // p√q/d または 分数 n/d
  rv(v, pts) { const acc = { syms: "", ans: [] }; let num; if (v.q === 1) num = this._box(v.p, acc); else num = (v.p === 1 ? "" : v.p === -1 ? "−" : this._box(v.p, acc)) + `√{${this._box(v.q, acc)}}`; const out = v.d === 1 ? num : `{{${num}|${this._box(v.d, acc)}}}`; this._push(acc, pts, "num"); return out; }
  fr(f, pts) { return this.rv({ p: f[0], q: 1, d: f[1] }, pts); }
  ratio(a, b, pts) { const g = gcd(a, b); const acc = { syms: "", ans: [] }; const s = `${this._box(a / g, acc)}：${this._box(b / g, acc)}`; this._push(acc, pts, "num"); return s; }
  ch(idx, opts, pts) { const acc = { syms: "", ans: [String(idx)] }; const s = this.SY[this.i]; this.i++; acc.syms = s; this._push(acc, pts, "ch", opts); this.pending.push({ t: "ch", sym: s, opts, part: this.parts.length - 1 }); return `［${s}］`; }
}
const NS = ["必要条件であるが，十分条件ではない", "十分条件であるが，必要条件ではない", "必要十分条件である", "必要条件でも十分条件でもない"];

// ===== 第1問〔1〕 数と式・集合と命題・整数 (10点) =====
function g1_rad(r, D) {
  const k = pick(r, [2, 3, 4]); let d; do { d = pick(r, [2, 3, 5, 6, 7]); } while (Number.isInteger(Math.sqrt(k * k + d)));
  const n = k * k + d, X = (Math.sqrt(n) + k) / d, a = Math.floor(X);
  D.part("〔1〕", "無理数の有理化と整数部分", 10);
  D.p(`k，n は n ＞ k² を満たす自然数とする。実数 X ＝ {{1|√{n} − k}} の整数部分を a で表す。`);
  const [bn, bk, bd] = D.num([n, k, d], 3);
  D.p(`(1) k ＝ ${k}，n ＝ ${n} の場合を考える。X の分母を有理化すると X ＝ {{√{${bn}} ＋ ${bk}|${bd}}} となる。したがって，a ＝ ${D.num(a, 3)} である。`);
  D.p(`(2) n ＝ k² ＋ 1 の場合を考える。このとき a ＝ ${D.ch(2, ["k", "k ＋ 1", "2k", "2k ＋ 1", "k²", "k² ＋ 1"], 4)} である。`);
  D.ex(`(1) 分母・分子に √${n} ＋ ${k} を掛けると，分母は ${n} − ${k * k} ＝ ${d} になる。√${n} ≒ ${Math.sqrt(n).toFixed(3)} なので X ≒ ${X.toFixed(3)}、整数部分は ${a}。`);
  D.ex(`(2) X ＝ √(k²＋1) ＋ k。k ＜ √(k²＋1) ＜ k ＋ 1 より 2k ＜ X ＜ 2k ＋ 1 なので a ＝ 2k。`);
}
function g1_set(r, D) {
  const N = pick(r, [30, 40, 50, 60]); const a = pick(r, [2, 3, 4, 5, 6]); let b; do { b = pick(r, [3, 4, 5, 6, 8, 9, 10]); } while (b === a || b % a === 0 || a % b === 0);

  D.part("", "複素数の極形式とド・モアブルの定理", 16);
  D.p(`複素数 z ＝ ${c.z} を考える。ただし，偏角 θ は 0 ≦ θ ＜ 2π とする。`);
  D.p(`|z| ＝ ${D.rv(c.R, 4)}，arg z ＝ ${D.ch(c.a, A, 4)} である。`);
  D.p(`ド・モアブルの定理より z${SUP[c.n]} ＝ ${D.num(c.val, 4)}${c.im ? "i" : ""} である。また，zⁿ が正の実数となる最小の自然数 n は ${D.num(c.first, 4)} である。`);
  D.ex(`|z| ＝ ${radStr(c.R)}、z ＝ ${radStr(c.R)}(cos ${A[c.a]} ＋ i sin ${A[c.a]})。`);
  D.ex(`zⁿ ＝ ${radStr(c.R)}ⁿ(cos n·${A[c.a]} ＋ i sin n·${A[c.a]})。n ＝ ${c.n} で ${c.val}${c.im ? "i" : ""}、n·${A[c.a]} が 2π の倍数になる最小の n は ${c.first}。`);
}
function k7_rot(r, D) {
  const a = [randInt(r, -2, 3), randInt(r, -2, 3)], dv = [randInt(r, 1, 4), randInt(r, -3, 3)], b = [a[0] + dv[0], a[1] + dv[1]], sg = pick(r, [1, -1]);
  const rot = sg === 1 ? [-dv[1], dv[0]] : [dv[1], -dv[0]], g = [a[0] + rot[0], a[1] + rot[1]];
  const cs = (x, y) => `${x}${y < 0 ? " − " : " ＋ "}${Math.abs(y)}i`;
  D.part("", "複素数平面上の回転", 16);
  D.p(`複素数平面上に 2 点 A(α)，B(β) があり，α ＝ ${cs(a[0], a[1])}，β ＝ ${cs(b[0], b[1])} である。点 B を点 A を中心として ${sg === 1 ? "π/2" : "−π/2"} だけ回転した点を C(γ) とする。`);
  const [d1, d2] = D.num(dv, 4), [g1, g2] = D.num(g, 4);
  D.p(`β − α ＝ ${d1} ＋ (${d2})i であり，γ ＝ ${g1} ＋ (${g2})i である。`);
  D.p(`|γ − α| ＝ ${D.rv(rad(1, 1, dv[0] ** 2 + dv[1] ** 2), 4)} であり，△ABC は ${D.ch(2, ["正三角形", "AB ＝ BC の二等辺三角形", "∠A ＝ π/2 の直角二等辺三角形", "∠B ＝ π/2 の直角三角形"], 4)} である。`);
  D.ex(`β − α ＝ ${cs(dv[0], dv[1])}。${sg === 1 ? "π/2 回転は i を掛ける" : "−π/2 回転は −i を掛ける"}ので γ − α ＝ ${cs(rot[0], rot[1])}、γ ＝ ${cs(g[0], g[1])}。`);
  D.ex(`|γ − α| ＝ |β − α| ＝ √${dv[0] ** 2 + dv[1] ** 2}。AB ＝ AC かつ ∠BAC ＝ π/2 なので直角二等辺三角形。`);
}
function k7_ellipse(r, D) {
  const [a, c] = pick(r, [[5, 3], [5, 4], [13, 12], [10, 6], [10, 8], [17, 15]]), b2 = a * a - c * c, b = Math.sqrt(b2);
  D.part("", "楕円(複素数平面と2次曲線)", 16);
  D.p(`複素数平面上で，方程式 |z − ${c}| ＋ |z ＋ ${c}| ＝ ${2 * a} を満たす点 z 全体が表す図形を考える。z ＝ x ＋ yi(x，y は実数)とする。`);
  D.p(`この方程式は，点 z から 2 点 ${c}，−${c} までの距離の和が一定であることを表すので，図形は ${D.ch(1, ["円", "楕円", "双曲線", "放物線"], 4)} である。`);
  const [A2, B2] = D.num([a * a, b2], 4);
  D.p(`x，y の方程式で表すと {{x²|${A2}}} ＋ {{y²|${B2}}} ＝ 1 であり，長軸の長さは ${D.num(2 * a, 4)}，短軸の長さは ${D.num(2 * b, 4)} である。`);
  D.ex(`2 点(焦点)からの距離の和が一定 ${2 * a} の点の軌跡は楕円。長軸の長さ ＝ 距離の和 ＝ ${2 * a}、a ＝ ${a}。`);
  D.ex(`焦点が ±${c} なので b² ＝ a² − c² ＝ ${a * a} − ${c * c} ＝ ${b2}、短軸の長さ 2b ＝ ${2 * b}。`);
}

// 選択肢を並べ替えて1問作る(stem中の［］に解答番号が入る)
function EQ(D, r, stem, correct, wrongs, pts) { const opts = shuffle(r, [correct, ...wrongs]); D.p(stem.replace("［］", D.ch(opts.indexOf(correct), opts, pts))); }
function orderQ(D, r, stem, labels, correct, pts) { const perm = a => a.join(" → "), set = new Set([perm(correct)]); while (set.size < 4) set.add(perm(shuffle(r, labels))); const opts = shuffle(r, [...set]); D.p(stem.replace("［］", D.ch(opts.indexOf(perm(correct)), opts, pts))); }

function e6_piano(r, D) {
  D.part("", "Story: The Station Piano", 12);
  D.p("In English class, you are preparing an outline of the following story for a presentation.");
  D.doc("The Station Piano", ["Every morning, Aoi passed the old piano in the station on her way to school. The city had placed it there so that anyone could play it. Aoi had taken piano lessons for eight years, but she had stopped after failing an important competition in junior high school. Since then, she had not touched a piano.", "One rainy day in June, her train was delayed. While she was waiting, an elderly man sat down at the piano and began to play a simple song very slowly. He made many mistakes, but he was smiling. When he finished, a few people clapped. He turned to Aoi and said, \"I started learning last year, at seventy-five. It's never too late, is it?\"", "Aoi felt something warm in her chest. She remembered how much she had enjoyed playing before she started worrying about winning.", "The next morning, she arrived at the station ten minutes early. Her hands were shaking as she sat down. She played a piece her grandmother had loved. A small girl stood beside her and listened until the end. \"Can you teach me?\" the girl asked.", "Now Aoi plays at the station once a week, and sometimes she teaches children a few notes. She has decided that music is not something to win; it is something to share."]);
  D.p("(A) An elderly man played the piano.　(B) Aoi stopped playing the piano.　(C) A girl asked Aoi to teach her.　(D) Aoi arrived early and played the piano.");
  orderQ(D, r, "問1 Put the events in the order they happened. ［］", ["A", "B", "C", "D"], ["B", "A", "D", "C"], 3);
  EQ(D, r, "問2 Aoi's feelings changed from ［］.", "being afraid to play to enjoying sharing music", ["being excited to being bored", "being proud to being jealous", "being lonely to being angry"], 3);
  EQ(D, r, "問3 Why did the elderly man's words affect Aoi? ［］", "They reminded her that age and mistakes did not matter when enjoying music.", ["He offered to give her free lessons.", "He was a friend of her grandmother.", "He told her to enter another competition."], 3);
  EQ(D, r, "問4 Which is the best message of the story? ［］", "Music is something to share, not only something to win.", ["Practice makes perfect.", "Trains are often late on rainy days.", "Children learn faster than adults."], 3);
  D.ex("問1：中学で演奏をやめる → 老人が演奏 → 翌朝早く来て演奏 → 少女に頼まれる。問2：怖くて弾けなかった → 分かち合う楽しさへ。問3：間違えても笑顔で弾く75歳の姿と言葉。問4：最後の文が主題。");
}
function e6_garden(r, D) {
  D.part("", "Story: The Garden Next Door", 12);

  D.doc("The Garden Next Door", ["When Daichi's family moved to a new town, he didn't know anyone. Next door lived Mrs. Kato, an old woman who spent every afternoon in her vegetable garden. At first, Daichi thought she was strict because she often told him not to kick his soccer ball near her plants.", "One day in July, Daichi's ball flew over the fence and broke some tomato plants. He was too scared to tell her, so he went home without saying anything. That night, he couldn't sleep.", "The next morning, he knocked on her door and apologized. To his surprise, Mrs. Kato smiled. \"Thank you for being honest,\" she said. \"Why don't you help me plant new ones?\" For the rest of the summer, Daichi visited her garden every weekend, and she taught him how to grow tomatoes, cucumbers, and beans.", "In September, Mrs. Kato hurt her leg and couldn't go into the garden. This time, Daichi took care of the plants by himself and brought her vegetables every day. When she tasted the first tomato he had grown, she said, \"This is the best tomato I've had in years.\"", "Daichi still plays soccer, but now he kicks the ball in the park."]);

  orderQ(D, r, "問1 Put the events in the order they happened. ［］", ["A", "B", "C", "D"], ["A", "B", "D", "C"], 3);
  EQ(D, r, "問2 Daichi's feelings toward Mrs. Kato changed from ［］.", "feeling nervous around her to feeling close to her", ["feeling close to her to feeling angry", "feeling bored to feeling excited", "feeling proud to feeling sorry"], 3);
  EQ(D, r, "問3 Why did Mrs. Kato smile when Daichi apologized? ［］", "She appreciated that he was honest.", ["She wanted him to pay for the plants.", "She had not noticed the broken plants.", "She liked soccer very much."], 3);
  EQ(D, r, "問4 What does the last sentence of the story show? ［］", "Daichi now cares about Mrs. Kato's garden.", ["Daichi has stopped playing soccer.", "Mrs. Kato has moved to a new town.", "The park is closer than the garden."], 3);
  D.ex("問1：ボールでトマトを折る → 謝る → 夏の間に野菜作りを習う → 9月に加藤さんがけが。問2：厳しい人だと思って緊張 → 親しくなる。問3：Thank you for being honest。問4：今は公園でボールを蹴る＝庭を大切にしている。");

function e7_zebra(r, D) {
  D.part("", "Article and presentation slides", 16);
  D.p("You are preparing a presentation for science class using the following article.");
  D.doc("Why Do Zebras Have Stripes?", ["For a long time, scientists have wondered why zebras have black and white stripes. One popular idea was that stripes help zebras hide from lions in tall grass. However, lions are mostly active at dusk and at night, when stripes are hard to see from a distance, so this idea has become less popular.", "Another idea is that stripes help zebras stay cool. Black stripes absorb more heat than white ones, which may cause small air movements over the skin. Some studies found that zebras living in hotter areas have clearer stripes, but other experiments showed little difference in body temperature.", "The idea with the strongest evidence today is that stripes protect zebras from biting flies. In one experiment, researchers put striped coats on horses and watched flies approach. The flies flew toward the horses as usual, but far fewer of them landed on the striped coats. The researchers believe that stripes confuse the flies' vision as they slow down to land. This matters because some flies carry diseases that can be dangerous for zebras.", "Of course, stripes may have more than one function. Zebras also seem to use their unique stripe patterns to recognize each other, just as humans recognize faces."]);
  EQ(D, r, "Slide 1: The hiding idea became less popular because ［］.", "lions hunt mainly when stripes are hard to see", ["zebras do not live in tall grass", "lions cannot see black and white", "stripes make zebras easier to find"], 4);
  EQ(D, r, "Slide 2: The evidence for the cooling idea is ［］.", "mixed: some studies support it, but others do not", ["strong: all experiments support it", "missing: no studies have been done", "clear: zebras in cold areas have no stripes"], 4);
  EQ(D, r, "Slide 3: In the experiment with horses, the flies ［］.", "approached the horses but landed less often on striped coats", ["avoided the horses completely", "landed more often on striped coats", "carried more diseases to the horses"], 4);
  EQ(D, r, "Slide 4: Another possible function of stripes is ［］.", "helping zebras recognize each other", ["helping zebras run faster", "attracting lions", "keeping zebras warm at night"], 4);
  D.ex("Slide1：ライオンは縞の見えにくい夕暮れ・夜に活動。Slide2：支持する研究もあれば差がない実験もある(mixed)。Slide3：近づくが着地は少ない。Slide4：個体の識別。");
}
function e7_nap(r, D) {

function e8_phone(r, D) {
  D.part("", "Essay: Smartphones in class", 17);

  EQ(D, r, "問2 Who supports using phones as a learning tool? ［］", "Ben", ["Aya", "Chika", "Daniel"], 3);
  D.p("Step 2: Your position — Smartphones should not be used freely during lessons.");
  D.doc("Step 3: Sources", ["Source A: In a survey of 1,000 students at schools that allow phones in class, 62% said they check messages during lessons at least once a day.", "Source B: Average test scores at five schools before and after they banned phones in class rose from 64 points to 70 points."]);

  JQ(D, r, "　(a) 途方に暮れた ［］", "どうしたらよいかわからなくなった", ["長い時間をむだに過ごした", "日が暮れるまで働き続けた", "ひどく腹を立てた", "遠くまで歩いて疲れ果てた"], 3);
  JQ(D, r, "　(b) 顔をほころばせて ［］", "うれしそうな表情になって", ["顔を赤くして恥ずかしがって", "涙をこらえるような顔で", "不満そうに顔をしかめて", "驚いて目を見開いて"], 3);
  JQ(D, r, "　(c) 几帳面な ［］", "細かいところまできちんとした", ["大きくて力強い", "急いで書いたような", "古くて読みにくい", "飾りが多くて華やかな"], 3);
  JQ(D, r, "問2 祖母が「今日はね，ちょうどその値段なの」と言ったのはなぜか。［］", "入院中の祖母に手紙を書きたいという男の子の思いを大切にし，足りない分を気づかれないように補ってやりたかったから。", ["売れ残っていた便箋を早く処分したかったから。", "男の子が硬貨を数え間違えていると思ったから。", "閉店が近いので，すべての商品を値下げしていたから。", "美咲に，客を困らせてはいけないと教えたかったから。"], 9);
  JQ(D, r, "問3 傍線部A「初日に自分が思ったことを，急に恥ずかしく感じた」のはなぜか。［］", "古い商品を価値のないものと決めつけていたが，祖母の店が人の思いを伝える手助けをしてきたことに気づいたから。", ["祖母に古い商品の値段を聞かずに，勝手に棚を片づけてしまったから。", "男の子の前で困った顔を見せてしまい，店番として未熟だと感じたから。", "祖母の店がもうけを出していないことを知り，申し訳なく思ったから。", "初日から店番を手伝わなかったことを，祖母に責められたから。"], 9);
  JQ(D, r, "問4 傍線部B「ゆっくりとうなずいた」ときの祖母の心情として最も適当なものはどれか。［］", "美咲が店に込めてきた思いを受け継ごうとしていることに驚きつつ，喜んでノートを託そうとしている。", ["大切なノートを手放すことが惜しく，しぶしぶ美咲の頼みを受け入れている。", "美咲がノートの内容を理解できるか不安で，返事に迷っている。", "閉店の疲れから，美咲の言葉を聞き流している。", "美咲が店を再開してくれると考え，安心している。"], 9);
  JQ(D, r, "問5 この文章の表現の特徴として最も適当なものはどれか。［］", "最後の夕焼けの描写が，店の終わりと，受け継がれていくものへの温かな思いを印象づけている。", ["登場人物の心情はすべて会話文だけで表され，地の文では説明されていない。", "美咲の視点と祖母の視点が交互に入れ替わり，二人の内面が詳しく描かれている。", "季節の移り変わりを細かく描くことで，長い年月の経過を表している。", "短い文を多用して，緊迫した場面の連続を描いている。"], 9);
  D.ex("問1：(a)方法がわからず困る、(b)笑顔になる、(c)細かい点まできちんとしている。問2：手紙を書きたい気持ちに「手を貸す」という祖母の考え。問3：「今どき誰が買うのだろう」と思っていたことを反省。問4：少し驚いた顔→ゆっくりうなずく＝驚きと受け入れ。問5：閉じたシャッターをやわらかく照らす夕焼けの余韻。");
}

function j3_report(r, D) {
  D.part("", "資料を読んでレポートを作る", 20);
  D.p("図書委員のKさんは，「学校図書館の利用を増やすには」というテーマでレポートを書いている。次の【資料】と【レポートの下書き】を読んで，後の問い(問1〜4)に答えよ。");
  D.p("【資料1】月別の貸出冊数");
  D.table(["月", "4月", "5月", "6月", "7月"], [["貸出冊数", "320", "280", "240", "410"]]);
  D.p("【資料2】図書館を利用しない理由(全校アンケート，複数回答不可)");
  D.table(["理由", "時間がない", "読みたい本がない", "場所が遠い", "その他"], [["割合", "42％", "28％", "18％", "12％"]]);
  D.doc("【レポートの下書き】", ["　本校の図書館の貸出冊数は，4月から6月にかけて減少していたが，7月には大きく増えた。これは夏休み前に本を借りる生徒が多いためだと考えられる。", "　図書館を利用しない理由で最も多いのは「時間がない」であった。そこで私は，図書館の利用を増やすための提案をしたい。(X)", "　以上のことから，図書館の利用を増やすことができると考える。"]);
  JQ(D, r, "問1 【資料1】から読み取れることとして最も適当なものはどれか。［］", "7月の貸出冊数は，6月の約1.7倍である。", ["4月から7月まで，貸出冊数は毎月減り続けている。", "5月の貸出冊数は，4月の半分以下である。", "6月の貸出冊数は，7月より多い。", "4か月の貸出冊数の合計は1000冊未満である。"], 5);
  JQ(D, r, "問2 (X)に入れる提案として，【資料2】の結果を最も効果的にふまえたものはどれか。［］", "昼休みの短い時間でも読み切れる本を集めた特設コーナーを，教室に近い廊下に設ける。", ["新しい本を大量に購入し，読みたい本がないという声にこたえる。", "図書館の開館時間を短くして，利用者を集中させる。", "図書館の場所を移転するよう，学校に要望する。", "「その他」と答えた生徒に，詳しい理由を書いてもらう。"], 5);
  JQ(D, r, "問3 レポートの構成を改善する方法として最も適当なものはどれか。［］", "結論の前に，提案によってどのような効果が期待できるかを，根拠とともに示す。", ["資料の数値をすべて削除し，自分の感想だけを述べる。", "結論を最初の段落に移し，資料の説明は省略する。", "提案を三つ以上に増やし，それぞれを一文ずつ並べる。", "「時間がない」という理由には触れずに，別の話題を加える。"], 5);
  JQ(D, r, "問4 レポートに資料を引用する際の注意として最も適当なものはどれか。［］", "資料の出典や調査の時期・対象を明記する。", ["自分の主張に合わない数値は書き換えてよい。", "資料はすべて自分で作成したものとして示す。", "割合は四捨五入せず，必ず小数第3位まで示す。", "グラフや表は使わず，文章だけで示す。"], 5);
  D.ex("問1：410 ÷ 240 ≒ 1.71。問2：最も多い「時間がない」に対応し、短時間で利用できる工夫。問3：提案と結論の間に根拠・効果の説明がない。問4：出典・時期・対象を明らかにするのが引用の基本。");
}

function j4_kinobori(r, D) {
  D.part("", "古文『徒然草』第百九段", 45);
  D.p("次の文章は『徒然草』の一節である。これを読んで，後の問い(問1〜5)に答えよ。");
  D.doc("", ["　高名の木登りといひし男，人を掟てて，高き木に登せて梢を切らせしに，(ア)__いと危ふく見えしほど__は言ふこともなくて，降るる時に，軒長ばかりになりて，「あやまちすな。(イ)__心して降りよ__」と言葉をかけ侍りしを，「かばかりになりては，飛び降るるとも降り(X)__なん__。如何にかく言ふぞ」と申し侍りしかば，「その事に候ふ。目くるめき，枝危ふきほどは，己れが恐れ侍れば，申さず。あやまちは，安き所に成りて，必ず仕る事に候ふ」と言ふ。", "　(ウ)__あやしき下臈__なれども，聖人の戒めにかなへり。鞠も，難き所を蹴出して後，安く思へば必ず落つと侍るやらん。"]);
  D.p("問1 傍線部(ア)〜(ウ)の解釈として最も適当なものを，それぞれ一つずつ選べ。");
  JQ(D, r, "　(ア) いと危ふく見えしほど ［］", "たいそう危なく見えた間", ["少しも危なくは見えなかったとき", "危ないことをしたがっていた様子", "危ないと人に言われたあと", "危ないところを見せたかったとき"], 5);
  JQ(D, r, "　(イ) 心して降りよ ［］", "注意して降りよ", ["思い切って飛び降りよ", "心を落ち着けてから降りるな", "急いで降りてこい", "気がすんだら降りよ"], 5);
  JQ(D, r, "　(ウ) あやしき下臈 ［］", "身分の低い者", ["不思議な力をもつ者", "怪しい行いをする者", "年老いた僧", "高い位の役人"], 5);
  JQ(D, r, "問2 波線部(X)「なん」の文法的な説明として最も適当なものはどれか。［］", "強意の助動詞「ぬ」の未然形と，推量の助動詞「む」の終止形", ["断定の助動詞「なり」の連用形と，推量の助動詞「む」の終止形", "願望の終助詞「なむ」", "ナ行変格活用動詞の活用語尾と，推量の助動詞「む」", "打消の助動詞「ず」の連用形と，推量の助動詞「む」"], 6);
  JQ(D, r, "問3 木登りの名人が，男が軒の高さまで降りてきてから声をかけたのはなぜか。［］", "人は危険な所では自分で用心するが，安全だと思って気をゆるめた所でこそ失敗するものだから。", ["高い所では声が届かず，低い所まで来なければ話ができなかったから。", "男が飛び降りようとしているのに気づき，止めなければならなかったから。", "梢を切る仕事が終わるまでは，話しかけてはいけない決まりだったから。", "低い所では枝が折れやすく，最も危険な場所だったから。"], 8);
  JQ(D, r, "問4 「聖人の戒めにかなへり」とはどういうことか。［］", "身分の低い者の言葉ではあるが，立派な人の教えと一致しているということ。", ["身分の低い者が，聖人の教えに背いているということ。", "木登りの名人は，聖人の教えを学んだことがあるということ。", "聖人は，木登りの技術を戒めとして用いたということ。", "身分の低い者は，聖人の教えを知るべきではないということ。"], 8);
  JQ(D, r, "問5 筆者が最後に鞠の例を挙げたのは，どのようなことを示すためか。［］", "難しい所を乗り越えたあとの油断が失敗を招くという点で，木登りの話と共通することを示すため。", ["鞠を蹴るのは木登りよりも難しいことを示すため。", "鞠の名人も木登りの名人も，同じ人物であることを示すため。", "難しい技に挑むことこそが，上達の近道であることを示すため。", "遊びの中にも，身分の上下があることを示すため。"], 8);
  D.ex("(ア)「いと」＝たいそう、「ほど」＝間。(イ)「心す」＝注意する。(ウ)「あやし」＝身分が低い、「下臈」＝身分の低い者。問2：「な(ぬ・未然)＋ん(む)」で「きっと降りられるだろう」。");
  D.ex("問3：「あやまちは，安き所に成りて，必ず仕る事に候ふ」。問4：「かなふ」＝一致する。問5：鞠も難しい所の後に安心すると必ず落ちる、という同じ教訓。");
}
function j4_ninnaji(r, D) {
  D.part("", "古文『徒然草』第五十二段", 45);
  D.p("次の文章は『徒然草』の一節である。これを読んで，後の問い(問1〜5)に答えよ。");
  D.doc("", ["　仁和寺にある法師，年寄るまで石清水を拝まざりければ，(ア)__心うく覚えて__，ある時思ひ立ちて，ただひとり，徒歩よりまうでけり。極楽寺・高良などを拝みて，(イ)__かばかりと心得て__帰りにけり。", "　さて，かたへの人にあひて，「年ごろ思ひつること，果たし侍りぬ。聞きしにも過ぎて尊く(X)__こそおはしけれ__。そも，参りたる人ごとに山へ登りしは，何事かありけん，(ウ)__ゆかしかりしかど__，神へ参るこそ本意なれと思ひて，山までは見ず」とぞ言ひける。", "　少しのことにも，先達はあらまほしき事なり。"]);
  D.p("問1 傍線部(ア)〜(ウ)の解釈として最も適当なものを，それぞれ一つずつ選べ。");
  JQ(D, r, "　(ア) 心うく覚えて ［］", "残念に思って", ["うれしく思って", "心配に思って", "うらやましく思って", "恐ろしく思って"], 5);
  JQ(D, r, "　(イ) かばかりと心得て ［］", "これだけだと思いこんで", ["これほど尊いとは思わずに", "どれほどかわからずに", "これで終わりではないと考えて", "ここまでは来られないと思って"], 5);
  JQ(D, r, "　(ウ) ゆかしかりしかど ［］", "知りたかったけれど", ["なつかしかったけれど", "恐ろしかったけれど", "退屈だったけれど", "上品だったけれど"], 5);
  JQ(D, r, "問2 波線部(X)「こそおはしけれ」についての説明として最も適当なものはどれか。［］", "係助詞「こそ」を受けて，文末が過去の助動詞「けり」の已然形で結ばれている。", ["係助詞「こそ」を受けて，文末が連体形で結ばれている。", "「けれ」は過去の助動詞「けり」の命令形である。", "「おはし」は話し手自身への敬意を表している。", "「こそ」は強調ではなく疑問を表している。"], 6);
  JQ(D, r, "問3 法師が山へ登らなかったのはなぜか。［］", "神に参ることが本来の目的だと思い，人々が山へ登る理由を確かめなかったから。", ["山へ登る道がわからず，人に聞くのが恥ずかしかったから。", "年を取っていて，山へ登る体力がなかったから。", "山の上には何もないと，前から聞いていたから。", "かたへの人に，山へは登るなと言われていたから。"], 8);
  JQ(D, r, "問4 法師の失敗とはどのようなことか。［］", "石清水八幡宮の本殿は山の上にあるのに，ふもとの寺社だけを拝んで帰ってしまったこと。", ["一人で出かけたため，帰り道に迷ってしまったこと。", "仁和寺の法師なのに，ほかの寺に参ってしまったこと。", "年を取るまで一度も旅をしたことがなかったこと。", "参拝の様子を，かたへの人に正しく伝えられなかったこと。"], 8);
  JQ(D, r, "問5 最後の一文「少しのことにも，先達はあらまほしき事なり」の意味として最も適当なものはどれか。［］", "ちょっとしたことでも，その道の案内者や指導者はいてほしいものだ。", ["少しのことなら，人に頼らず自分でするべきだ。", "先に生まれた人は，常に正しいとは限らない。", "大きなことをするときだけ，案内者が必要である。", "少しでも早く，目的地に着くべきである。"], 8);
  D.ex("(ア)「心うし」＝残念だ・情けない。(イ)「かばかり」＝これほど。(ウ)「ゆかし」＝知りたい・見たい。問2：「こそ」→已然形「けれ」の係り結び。");
  D.ex("問3：「神へ参るこそ本意なれと思ひて，山までは見ず」。問4：本殿は山上にあることを知らずに帰った。問5：「先達」＝案内者、「あらまほし」＝あってほしい。");
}

function j5_mujun(r, D) {
  D.part("", "漢文『韓非子』より", 45);
  D.p("次の文章を読んで，後の問い(問1〜6)に答えよ。(本文は白文と書き下し文で示す。)");
  D.doc("【白文】", ["楚人有鬻盾与矛者。誉之曰、吾盾之堅、莫能陥也。又誉其矛曰、吾矛之利、於物無不陥也。或曰、以子之矛、陥子之盾、何如。其人弗能応也。"]);
  D.doc("【書き下し文(一部空欄)】", ["楚人に盾と矛とを(a)__鬻ぐ__者有り。之を誉めて曰はく，「吾が盾の堅きこと，〔 Ⅰ 〕」と。又其の矛を誉めて曰はく，「吾が矛の(b)__利__なること，物に於いて陥さざる無きなり」と。或ひと曰はく，「子の矛を以て，子の盾を陥さば何如」と。其の人応ふること能はざるなり。"]);
  JQ(D, r, "問1 (a)「鬻ぐ」の意味として最も適当なものはどれか。［］", "売る", ["作る", "買う", "盗む", "磨く"], 5);
  JQ(D, r, "　(b)「利」の意味として最も適当なものはどれか。［］", "鋭いこと", ["もうけ", "便利なこと", "かしこいこと", "重いこと"], 5);
  JQ(D, r, "問2 空欄〔 Ⅰ 〕に入る，「莫能陥也」の書き下し文として最も適当なものはどれか。［］", "能く陥すもの莫きなり", ["能く陥すこと莫かれ", "陥すに能ふ莫きなり", "莫ぞ能く陥さんや", "能はずして陥すなり"], 7);
  JQ(D, r, "問3 「於物無不陥也」の意味として最も適当なものはどれか。［］", "どんな物でも突き通さないものはない。", ["どんな物も突き通すことはできない。", "物によっては突き通せないものもある。", "物を突き通す必要はない。", "物を突き通してはならない。"], 7);
  JQ(D, r, "問4 「以子之矛、陥子之盾、何如」の意味として最も適当なものはどれか。［］", "あなたの矛であなたの盾を突いたら，どうなるのか。", ["あなたの矛と盾は，どちらが高いのか。", "あなたの矛で私の盾を突いてみよう。", "あなたの盾はなぜ矛より堅いのか。", "あなたの矛と盾を，どこで手に入れたのか。"], 7);
  JQ(D, r, "問5 「其人弗能応也」となったのはなぜか。［］", "どちらの答えをしても，自分の言ったことと食い違ってしまうから。", ["客の言葉が難しくて，意味がわからなかったから。", "盾と矛がすでに売り切れていたから。", "答える前に，客が帰ってしまったから。", "楚の国の決まりで，客と話してはいけなかったから。"], 7);
  JQ(D, r, "問6 この話からできた故事成語の意味として最も適当なものはどれか。［］", "前後のつじつまが合わないこと", ["余計なものを付け加えること", "両者が争う間に第三者が利益を得ること", "古い習慣にとらわれて工夫しないこと", "文章を何度も練り直すこと"], 7);
  D.ex("問1：「鬻」＝売る、「利」＝鋭い。問2：「莫」は「なシ」と読み、「能く陥すもの莫きなり」(突き通せるものはない)。問3：「無不〜」は二重否定で全部肯定。");
  D.ex("問4：「何如」＝どうであるか。問5：盾を突き通せば盾の自慢が、通せなければ矛の自慢がうそになる。問6：故事成語「矛盾」。");
}
function j5_dasoku(r, D) {

function exam() {
  const ex = S.ex, D = ex.ds[ex.cur], left = ex.end - Date.now(), gen = GG(), slot = gen.slots[ex.cur];
  const pickBar = slot.opt ? `<div class="pickbar${ex.sel.includes(ex.cur) ? " on" : ""}"><p>第${gen.slots.find(s => s.opt).no}問〜第${gen.slots[gen.slots.length - 1].no}問は選択問題です。${gen.pickN}問を選んで解答してください（選択中 ${ex.sel.length}問）。</p><button class="btn sm${ex.sel.includes(ex.cur) ? " primary" : ""}" data-act="pick" aria-pressed="${ex.sel.includes(ex.cur)}">${ex.sel.includes(ex.cur) ? "この問題を選択中（解除する）" : "この問題を選択して解答する"}</button>${ex.warn ? `<p class="warn">${ex.warn}</p>` : ""}</div>` : "";
  return `<div class="exam">
  <div class="bar"><span class="chip">${GG().name}　${setName(ex.set)}</span><span class="timer${left < 600000 ? " low" : ""}" id="timer" role="timer" aria-label="残り時間">${mmss(left)}</span><button class="btn sm" data-act="sheet">解答を終了</button>
    <nav class="tabs" aria-label="大問">${ex.ds.map((d, i) => { const [x, n] = doneCount(d, ex.a[i]); const opt = gen.slots[i].opt, on = ex.sel.includes(i); return `<button class="tab${i === ex.cur ? " cur" : ""}${opt ? (on ? " picked" : " opt") : ""}" data-act="go" data-i="${i}" aria-current="${i === ex.cur}">第${d.no}問<small>${opt ? (on ? "選択" : "未選択") : `${x}/${n}`}</small></button>`; }).join("")}</nav></div>
  <main class="booklet${gen.en ? " en" : ""}">${pickBar}${daimonHtml(D, ex.a[ex.cur], false, "mark", { di: ex.cur, limit: true, plays: ex.plays })}
    <div class="row nav">${ex.cur > 0 ? `<button class="btn" data-act="go" data-i="${ex.cur - 1}">第${ex.cur}問へ戻る</button>` : ""}${ex.cur < ex.ds.length - 1 ? `<button class="btn primary" data-act="go" data-i="${ex.cur + 1}">第${ex.cur + 2}問へ進む</button>` : `<button class="btn primary" data-act="sheet">解答を終了</button>`}</div></main>
  ${ex.sheet ? `<div class="overlay" data-act="close"><div class="dialog" role="dialog" aria-modal="true"><h2>解答を終了して採点しますか</h2><p>${(() => { const [x, n] = ex.ds.reduce((t, d, i) => { if (GG().slots[i].opt && !ex.sel.includes(i)) return t; const [a, b] = doneCount(d, ex.a[i]); return [t[0] + a, t[1] + b]; }, [0, 0]); const pk = GG().pickN; return (pk && ex.sel.length < pk ? `選択問題がまだ ${ex.sel.length} 問しか選ばれていません（${pk}問選んでください）。選ばれていない問題は採点されません。` : "") + (x < n ? `まだ塗っていない記号が ${n - x} 個あります。` : "すべての記号を塗りました。"); })()}</p><div class="row"><button class="btn" data-act="close">試験に戻る</button><button class="btn primary" data-act="finish">採点する</button></div><button class="btn ghost sm" data-act="quit">中断して戻る（記録されません）</button></div></div>` : ""}
</div>`;
}
function finish(timeout) {
  const ex = S.ex; clearInterval(tick); stopTTS();
  const sc = ex.ds.map((D, i) => (GG().slots[i].opt && !ex.sel.includes(i)) ? null : scoreD(D, ex.a[i])), total = sc.reduce((t, x) => t + (x || 0), 0);
  const d = load(); d[S.sid] = d[S.sid] || {}; const rec = d[S.sid][ex.set] || { best: 0, n: 0 }; rec.best = Math.max(rec.best, total); rec.last = total; rec.n++; d[S.sid][ex.set] = rec; save(d);
  S = { view: "result", sid: S.sid, rs: { ...ex, sc, total, used: Math.min(Date.now(), ex.end) - ex.t0, timeout } };
  render(true);
}
function result() {
  const R = S.rs;
  return `<div class="result">
  <section class="score-card"><p class="rs-t">${GG().name}　${setName(R.set)}の結果</p><p class="score"><b>${R.total}</b><span>／${GG().full}点</span></p>
    <p class="gifu">岐阜大の配点に換算すると <b>${Math.round(R.total * G().conv * 10) / 10}</b>／${GG().full * G().conv}点（${G().convNote}）</p>
    <p class="meta">所要時間 ${Math.max(1, Math.round(R.used / 60000))}分${R.timeout ? "（時間切れで自動採点）" : ""}</p>
    <div class="bd">${R.ds.map((D, i) => R.sc[i] == null ? `<div class="bd-r skip"><span>第${D.no}問</span><span class="bar-o"></span><span>選択せず</span></div>` : `<div class="bd-r"><span>第${D.no}問</span><span class="bar-o"><i style="width:${R.sc[i] / D.pts * 100}%"></i></span><span>${R.sc[i]}／${D.pts}</span></div>`).join("")}</div>
    <div class="row"><button class="btn primary" data-act="start" data-set="${R.set}">${R.set === "r" ? "新しい組み合わせで受験" : "この回をもう一度"}</button><button class="btn" data-act="subj">回の一覧へ</button></div></section>
  <section class="review"><h2>問題と解説</h2>${R.ds.map((D, i) => `<details class="rv"${i === 0 ? " open" : ""}><summary>第${D.no}問　${D.parts.map(p => p.title).join("／")}<span>${R.sc[i] == null ? "選択せず" : `${R.sc[i]}／${D.pts}点`}</span></summary><div class="booklet in${GG().en ? " en" : ""}">${daimonHtml(D, R.a[i], true, "none", { di: i })}</div></details>`).join("")}</section>
</div>`;
}
function drillNew(no) { const gen = GG(), slot = gen.slots[no - 1]; S = { view: "drill", sid: S.sid, dr: { no, D: buildDaimon(slot, rngFrom(Date.now() % 2147483647), 0, gen.pua ? PUA : undefined), a: {}, done: false } }; render(true); }
function drill() {
  const d = S.dr, sc = d.done ? scoreD(d.D, d.a) : 0;
  return `<div class="exam drill"><div class="bar"><button class="btn sm" data-act="subj">戻る</button><span class="chip">${GG().name}　第${d.no}問の練習</span>${d.done ? `<span class="timer">${sc}／${d.D.pts}点</span>` : ""}</div>
  <main class="booklet${GG().en ? " en" : ""}">${daimonHtml(d.D, d.a, d.done, "dmark", { di: 0 })}
  <div class="row nav">${d.done ? `<button class="btn primary" data-act="drill" data-no="${d.no}">次の問題</button>` : `<button class="btn primary" data-act="check">答え合わせ</button>`}</div></main></div>`;
}

function render(top) {
  if (TTS.playing && !["exam", "drill", "result"].includes(S.view)) stopTTS();
  const open = top ? [] : [...document.querySelectorAll("details[open]")].map((x, i) => i);
  $app.innerHTML = S.view === "exam" ? exam() : S.view === "result" ? result() : S.view === "drill" ? drill() : S.view === "subj" ? subj() : home();
  if (top) window.scrollTo(0, 0);
}
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act; if (act === "close" && e.target !== b) return;
  const y = window.scrollY;
  switch (act) {
    case "home": clearInterval(tick); stopTTS(); S = { view: "home" }; render(true); break;
    case "play": { const di = +b.dataset.d, key = b.dataset.k, k = `${di}:${key}`; const D = S.view === "exam" ? S.ex.ds[di] : S.view === "result" ? S.rs.ds[di] : S.dr.D; const blk = D.blocks.find(x => x.key === key);
      if (TTS.playing === k) { stopTTS(); render(); window.scrollTo(0, y); break; }
      if (S.view === "exam") { const used = S.ex.plays[k] || 0; if (used >= blk.times) break; S.ex.plays[k] = used + 1; }
      TTS.playing = k; speak(blk.lines, () => { if (TTS.playing === k) { TTS.playing = null; const yy = window.scrollY; render(); window.scrollTo(0, yy); } }); render(); window.scrollTo(0, y); break; }
    case "subj": clearInterval(tick); stopTTS(); S = { view: "subj", sid: b.dataset.s || S.sid }; render(true); break;
    case "start": startExam(b.dataset.set); break;
    case "drill": drillNew(+b.dataset.no); break;
    case "go": stopTTS(); S.ex.cur = +b.dataset.i; render(true); break;
    case "mark": { const ex = S.ex, A = ex.a[ex.cur], s = b.dataset.s, v = b.dataset.v; if (A[s] === v) delete A[s]; else A[s] = v;
      const gen = GG(); ex.warn = null; if (gen.slots[ex.cur].opt && !ex.sel.includes(ex.cur)) { if (ex.sel.length < gen.pickN) ex.sel.push(ex.cur); else ex.warn = `すでに${gen.pickN}問を選択しています。この問題を採点してほしい場合は，ほかの問題の選択を解除してください。`; }
      render(); window.scrollTo(0, y); break; }
    case "pick": { const ex = S.ex, gen = GG(), k = ex.sel.indexOf(ex.cur); ex.warn = null; if (k >= 0) ex.sel.splice(k, 1); else if (ex.sel.length < gen.pickN) ex.sel.push(ex.cur); else ex.warn = `選択できるのは${gen.pickN}問までです。ほかの問題の選択を解除してから選んでください。`; render(); window.scrollTo(0, y); break; }
    case "dmark": { const A = S.dr.a, s = b.dataset.s, v = b.dataset.v; if (A[s] === v) delete A[s]; else A[s] = v; render(); window.scrollTo(0, y); break; }
    case "check": S.dr.done = true; render(); window.scrollTo(0, y); break;
    case "sheet": S.ex.sheet = true; render(); window.scrollTo(0, y); break;
    case "close": S.ex.sheet = null; render(); window.scrollTo(0, y); break;
    case "finish": finish(false); break;
    case "quit": clearInterval(tick); S = { view: "subj", sid: S.sid }; render(true); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.view === "exam" && S.ex.sheet) { S.ex.sheet = null; render(); } });
render();

</script>
</body>
</html>
